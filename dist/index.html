      };

      // a project is a book: the cover swings open onto the details
      const setBook = (book, open, focus) => {
        const cover = book.querySelector(".pg-cover"), inside = book.querySelector(".pg-inside");
        book.classList.toggle("open", open);
        cover.setAttribute("aria-expanded", open);
        if (open) { inside.removeAttribute("inert"); inside.setAttribute("aria-hidden", "false"); cover.setAttribute("inert", ""); }
        else { inside.setAttribute("inert", ""); inside.setAttribute("aria-hidden", "true"); cover.removeAttribute("inert"); }
        if (focus) (open ? inside.querySelector(".pg-close") : cover).focus({ preventScroll: true });
      };

      const more = root.querySelector("#tech-more"), chipBox = root.querySelector("#tech-chips");
      more.addEventListener("click", () => {
        const open = !chipBox.classList.contains("show-all");
        chipBox.classList.toggle("show-all", open);
        more.setAttribute("aria-expanded", open);
        more.textContent = open ? t("Show fewer") : t("Show all {n} technologies", { n: chips.length });
      });
      q.addEventListener("input", () => { state.q = q.value.trim().toLowerCase(); draw(); });
      chips.forEach(c => c.addEventListener("click", () => { const x = c.dataset.tech; state.tech.has(x) ? state.tech.delete(x) : state.tech.add(x); draw(); }));
      const clear = () => { state.q = ""; q.value = ""; state.tech.clear(); draw(); };
      root.querySelector("#proj-clear").addEventListener("click", clear);
      grid.addEventListener("click", e => {
        const cover = e.target.closest(".pg-cover");
        if (cover) { setBook(cover.closest(".book"), true, true); return; }
        const close = e.target.closest(".pg-close");
        if (close) { setBook(close.closest(".book"), false, true); return; }
        const b = e.target.closest("[data-tech-add]");
        if (b) { const x = b.dataset.techAdd; state.tech.has(x) ? state.tech.delete(x) : state.tech.add(x); draw(); root.querySelector(".filters").scrollIntoView({ behavior: "smooth", block: "nearest" }); }
        if (e.target.closest("[data-clear]")) clear();
      });
      const onKey = e => {
        if (!grid.isConnected) { document.removeEventListener("keydown", onKey); return; }
        if (e.key !== "Escape") return;
        grid.querySelectorAll(".book.open").forEach(book => setBook(book, false, book.contains(document.activeElement)));
      };
      document.addEventListener("keydown", onKey);

      // the cards lean towards the pointer, with a soft glare (mouse only)
      if (!reduced && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const rest = book => { book.style.setProperty("--rx", "0deg"); book.style.setProperty("--ry", "0deg"); book.style.setProperty("--glow", "0"); };
        grid.addEventListener("pointermove", e => {
          const book = e.target.closest(".book");
          if (!book || book.classList.contains("open")) return;
          const r = book.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
          book.style.setProperty("--ry", ((px - 0.5) * 10).toFixed(2) + "deg");
          book.style.setProperty("--rx", ((0.5 - py) * 8).toFixed(2) + "deg");
          book.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
          book.style.setProperty("--my", (py * 100).toFixed(1) + "%");
          book.style.setProperty("--glow", "1");
        });
        grid.addEventListener("pointerout", e => { const book = e.target.closest(".book"); if (book && !book.contains(e.relatedTarget)) rest(book); });
      }
      draw();
    },

    contact(root) {
      const $ = id => root.querySelector("#" + id);
      $("cf-send").addEventListener("click", () => {
        const name = $("cf-name").value.trim(), subject = $("cf-subject").value.trim(), msg = $("cf-msg").value.trim();
        const missing = [!name && t("your name"), !subject && t("a subject"), !msg && t("a message")].filter(Boolean);
        if (missing.length) { $("cf-err").textContent = t("Add {list} first.", { list: joinList(missing) }); return; }
        $("cf-err").textContent = "";
        const body = `${msg}\n\n— ${name}`;
        window.location.href = `mailto:${C.profile.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        toast(t("Opening your email app"));
      });
    },

    resume(root) {
      // --- technical leadership clock
      const lg = root.querySelector("#leadership");
      if (lg) {
        const items = [...lg.querySelectorAll(".lg-item")], nodes = [...lg.querySelectorAll(".lg-node")];
        const hand = lg.querySelector(".lg-hand"), big = lg.querySelector(".lg-num-big");
        const n = items.length, reducedLg = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let cur = 0, angle = 0, auto = !reducedLg, timer = null, visible = false, hovering = false;
        const select = (i, user) => {
          if (user) { auto = false; lg.classList.remove("auto"); }
          let step = ((i - cur) % n + n) % n;       // the hand always moves forward, like time
          if (step === 0 && user) step = 0;
          angle += step * (360 / n);
          cur = i;
          hand.style.transform = `rotate(${angle}deg)`;
          big.textContent = String(i + 1).padStart(2, "0");
          items.forEach((it, k) => {
            const on = k === i;
            it.classList.toggle("open", on);
            it.querySelector(".lg-cat").setAttribute("aria-expanded", on);
          });
          nodes.forEach((nd, k) => nd.classList.toggle("on", k === i));
          if (auto) { lg.classList.remove("tick"); void lg.offsetWidth; lg.classList.add("tick"); }
        };
        items.forEach((it, i) => {
          const b = it.querySelector(".lg-cat");
          b.addEventListener("click", () => select(i, true));
          b.addEventListener("keydown", e => {
            if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
            const k = (i + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
            items[k].querySelector(".lg-cat").focus(); select(k, true); e.preventDefault();
          });
        });
        nodes.forEach((nd, i) => nd.addEventListener("click", () => { select(i, true); items[i].querySelector(".lg-cat").focus({ preventScroll: true }); }));
        lg.addEventListener("pointerenter", () => { hovering = true; });
        lg.addEventListener("pointerleave", () => { hovering = false; });
        if (auto) {
          lg.classList.add("auto");
          const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible && auto) select(cur, false); }, { threshold: 0.4 });
          io.observe(lg);
          timer = setInterval(() => {
            if (!lg.isConnected) { clearInterval(timer); io.disconnect(); return; }
            if (auto && visible && !hovering && !lg.contains(document.activeElement)) select((cur + 1) % n, false);
          }, 6000);
        }
        select(0, false);
      }

      const chart = root.querySelector("#skills-chart");
      const tip = root.querySelector("#skill-tip");
      const level = v => (v >= 85 ? 5 : v >= 75 ? 4 : v >= 65 ? 3 : 2);
      let cat = "all";
      const draw = () => {
        chart.innerHTML = C.skills.filter(s => cat === "all" || (s.group || s.cat) === cat).map(s => `
          <div class="skill-cat">
            <h3>${esc(s.cat)}</h3>
            <div class="bars">${s.items.map(([n, v]) => `
              <div class="bar" tabindex="0" role="img" aria-label="${esc(n)}: ${v}%" data-skill="${esc(n)}" data-v="${v}">
                <span class="bar-name">${esc(n)}</span>
                <span class="track"><span class="fill l${level(v)}" style="--v:${v}%"></span></span>
                <span class="bar-v">${v}%</span>
              </div>`).join("")}</div>
          </div>`).join("");
      };
      const show = el => {
        if (!el) { tip.classList.remove("show"); return; }
        tip.innerHTML = `<strong>${esc(t("Skill:"))}</strong> ${esc(el.dataset.skill)}<br><strong>${esc(t("Experience:"))}</strong> ${el.dataset.v}%`;
        const r = el.getBoundingClientRect(), pr = chart.parentElement.getBoundingClientRect();
        tip.style.left = Math.min(r.left - pr.left + 20, pr.width - 200) + "px";
        tip.style.top = r.top - pr.top - 56 + "px";
        tip.classList.add("show");
      };
      chart.addEventListener("pointerover", e => show(e.target.closest(".bar")));
      chart.addEventListener("pointerleave", () => show(null));
      chart.addEventListener("focusin", e => show(e.target.closest(".bar")));
      chart.addEventListener("focusout", () => show(null));
      chart.addEventListener("click", e => show(e.target.closest(".bar")));
      root.querySelectorAll(".chip[data-cat]").forEach(c => c.addEventListener("click", () => {
        cat = c.dataset.cat;
        root.querySelectorAll(".chip[data-cat]").forEach(x => x.setAttribute("aria-pressed", x === c));
        draw();
      }));
      draw();
      const tg = root.querySelector("#cv-toggle"), view = root.querySelector("#cv-view");
      tg.addEventListener("click", () => {
        const open = view.hidden;
        view.hidden = !open; tg.setAttribute("aria-expanded", open);
        tg.lastChild.textContent = t(open ? "Hide CV" : "View CV");
        if (open && !view.dataset.loaded) { view.dataset.loaded = "1"; renderPdf(view); }
        if (open) view.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
  };

  // ======================================================================
  function Browser(root, hooks) {
    this.root = root;
    this.hooks = hooks;
    this.stack = [];
    this.idx = -1;
    this.current = null;
    this.busy = false;
    this.queued = null;
    this._build();
  }

  Browser.prototype._build = function () {
    this.root.innerHTML = `
      <header class="chrome">
        <div class="tabbar">
          <div class="lights">
            <button type="button" class="light red" data-desk data-i18n-label="Close the browser and return to the desk" aria-label="${esc(t("Close the browser and return to the desk"))}"></button>
            <span class="light yellow" aria-hidden="true"></span><span class="light green" aria-hidden="true"></span>
          </div>
          <nav class="tabs" role="tablist" data-i18n-label="Portfolio pages" aria-label="${esc(t("Portfolio pages"))}">
            ${ROUTES.map(r => `<a class="tab" role="tab" href="#/${r.key}" data-nav="${r.key}" id="tab-${r.key}" aria-selected="false" aria-controls="viewport"><span class="fav" aria-hidden="true">${r.icon}</span><span class="tab-title" data-i18n="${r.title}">${esc(t(r.title))}</span></a>`).join("")}
          </nav>
        </div>
        <div class="toolbar">
          <button type="button" class="tool" id="nav-back" data-i18n-label="Back" aria-label="${esc(t("Back"))}">${icon("back")}</button>
          <button type="button" class="tool" id="nav-fwd" data-i18n-label="Forward" aria-label="${esc(t("Forward"))}">${icon("fwd")}</button>
          <button type="button" class="tool" id="nav-reload" data-i18n-label="Reload page" aria-label="${esc(t("Reload page"))}">${icon("reload")}</button>
          <form class="address" id="address" role="search">
            ${icon("lock", "lock")}
            <label class="sr" for="addr" data-i18n="Address">${esc(t("Address"))}</label>
            <input id="addr" type="text" dir="ltr" spellcheck="false" autocomplete="off" autocapitalize="off" enterkeyhint="go">
          </form>
          <div class="depth" id="depth" role="img"><small>${esc(t("Depth"))}</small><span class="depth-dots" aria-hidden="true">${ROUTES.map(() => "<i></i>").join("")}</span><span class="depth-num" aria-hidden="true"><b>1</b>/${ROUTES.length}</span></div>
          <button type="button" class="tool desk-btn" data-desk data-i18n-label="Back to the desk" aria-label="${esc(t("Back to the desk"))}">${icon("desk")}<span data-i18n="Desk">${esc(t("Desk"))}</span></button>
        </div>
        <div class="progress" aria-hidden="true"></div>
      </header>
      <main class="viewport" id="viewport" tabindex="-1"><div class="page" id="page"></div></main>
      <div class="dive" aria-hidden="true"><span class="dive-msg"></span><span class="dive-bar"><i></i></span></div>
      <div class="chrono" aria-hidden="true"><b class="chrono-year"></b><span class="chrono-dir"></span></div>`;

    this.viewport = this.root.querySelector("#viewport");
    this.page = this.root.querySelector("#page");
    this.addr = this.root.querySelector("#addr");
    this.progress = this.root.querySelector(".progress");
    this.chrono = this.root.querySelector(".chrono");
    this.diveEl = this.root.querySelector(".dive");
    this.depthEl = this.root.querySelector("#depth");

    this.root.addEventListener("click", e => {
      const nav = e.target.closest("[data-nav]");
      if (nav) { e.preventDefault(); this.go(nav.dataset.nav); return; }
      const ge = e.target.closest("[data-goto-exp]");
      if (ge) { e.preventDefault(); this.go("experience", { focus: "exp-" + ge.dataset.gotoExp }); return; }
      const gp = e.target.closest("[data-goto-proj]");
      if (gp) { e.preventDefault(); this.go("projects", { focus: "proj-" + gp.dataset.gotoProj }); return; }
      if (e.target.closest("[data-desk]")) { e.preventDefault(); this.hooks.onDesk(); return; }
      const cp = e.target.closest("[data-copy]");
      if (cp) { copyText(cp.dataset.copy); return; }
      if (e.target.closest('[data-action="download-cv"]')) downloadCV();
    });
    this.root.querySelector("#nav-back").addEventListener("click", () => this.back());
    this.root.querySelector("#nav-fwd").addEventListener("click", () => this.forward());
    this.root.querySelector("#nav-reload").addEventListener("click", () => this.reload());
    this.root.querySelector("#address").addEventListener("submit", e => {
      e.preventDefault();
      const raw = this.addr.value;
      const key = resolveRoute(raw);
      this.addr.blur();
      if (key) this.go(key);
      else this.go("notfound", { path: raw.replace(/^devleb:\/\//i, "").trim() || "?" });
    });
    this.addr.addEventListener("focus", () => this.addr.select());

    // arrow keys move between tabs
    const tabs = [...this.root.querySelectorAll(".tab")];
    tabs.forEach((t, i) => t.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
      n.focus(); e.preventDefault();
    }));
    this.tabs = tabs;
    this._initDive();

    let ticking = false;
    this.viewport.addEventListener("scroll", () => {
      if (this.dive) this.dive.moved = performance.now();
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        this._diveHint();
        const max = this.viewport.scrollHeight - this.viewport.clientHeight;
        const p = max > 0 ? this.viewport.scrollTop / max : 0;
        this.progress.style.transform = `scaleX(${p})`;
        this.hooks.onScroll && this.hooks.onScroll(p);
        if (this.shown && this.shown.key === "experience") this._expYear();
      });
    }, { passive: true });
  };

  Browser.prototype._syncChrome = function () {
    const key = this.current && this.current.key;
    this.tabs.forEach(t => {
      const on = t.dataset.nav === key;
      t.setAttribute("aria-selected", on);
      t.tabIndex = on ? 0 : -1;
      if (on) t.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
    this.addr.value = SCHEME + (key === "notfound" ? this.current.path : key);
    this.root.querySelector("#nav-back").disabled = this.idx <= 0;
    this.root.querySelector("#nav-fwd").disabled = this.idx >= this.stack.length - 1;
    const di = ROUTES.findIndex(r => r.key === key);
    this.depthEl.hidden = di < 0;
    if (di >= 0) {
      this.depthEl.setAttribute("aria-label", t("Page {n} of {total}", { n: di + 1, total: ROUTES.length }));
      this.depthEl.querySelector("b").textContent = di + 1;
      [...this.depthEl.querySelectorAll(".depth-dots i")].forEach((d, i) => { d.classList.toggle("now", i === di); d.classList.toggle("seen", i < di); });
    }
    const r = ROUTES.find(r => r.key === key);
    document.title = (r ? t(r.title) : t("Not found")) + " — " + C.profile.name;
  };

  Browser.prototype._render = function (entry) {
    this.page.innerHTML = entry.key === "notfound" ? PAGES.notfound(entry.path) : PAGES[entry.key]();
    this.page.dataset.page = entry.key;
    this.shown = entry;
    if (INIT[entry.key]) INIT[entry.key](this.page);
    this.viewport.scrollTop = 0;
    this.progress.style.transform = "scaleX(0)";
    this.hooks.onScroll && this.hooks.onScroll(0);
    if (entry.key === "experience") this._expYear(true);
  };

  /* Experience: the dial shows the year of the role being read.
     Reading down a role runs its years backwards (end year → start year). */
  Browser.prototype._expYear = function (force) {
    const items = [...this.page.querySelectorAll(".timeline > li[data-from]")];
    if (!items.length) return;
    const vp = this.viewport;
    // not laid out yet (the browser is still hidden): measure once it is on screen
    cancelAnimationFrame(this._expRetry);
    if (!vp.clientHeight) { this._expRetry = requestAnimationFrame(() => { if (this.shown && this.shown.key === "experience") this._expYear(true); }); return; }
    const line = vp.getBoundingClientRect().top + vp.clientHeight * 0.4;
    let year = +items[0].dataset.to, active = 0;
    for (let i = 0; i < items.length; i++) {
      const r = items[i].getBoundingClientRect();
      if (r.top > line) break;
      active = i;
      const k = Math.min(1, Math.max(0, (line - r.top) / Math.max(1, r.height)));
      year = +items[i].dataset.to + (+items[i].dataset.from - +items[i].dataset.to) * k;
    }
    // at the very bottom, land on the first year of the career
    if (vp.scrollTop >= vp.scrollHeight - vp.clientHeight - 2 && vp.scrollTop > 0) { active = items.length - 1; year = +items[active].dataset.from; }
    items.forEach((li, i) => li.classList.toggle("now", i === active));
    const y = Math.round(year);
    if (y === this._year && !force) return;
    const dir = this._year == null || force ? 0 : y < this._year ? -1 : 1;
    this._year = y;
    this.hooks.onYear && this.hooks.onYear("experience", String(y), dir);
  };

  // navigation with the time-travel transition
  Browser.prototype._transition = async function (entry, instant) {
    if (this.busy) { this.queued = [entry, instant]; return; }
    this.busy = true;
    const fromKey = this.shown ? this.shown.key : null;
    // going to a later page is going deeper (down), to an earlier one is coming back up
    const ix = k => ROUTES.findIndex(r => r.key === k);
    const diveDir = entry.dive || (fromKey && ix(fromKey) >= 0 && ix(entry.key) >= 0 ? Math.sign(ix(entry.key) - ix(fromKey)) : 0);
    if (diveDir && !instant) this.root.dataset.dive = diveDir > 0 ? "down" : "up";
    this._diveShow(0, 0);
    this.current = entry;
    this._syncChrome();
    const planetKey = entry.key;
    if (instant) {
      this.hooks.onShow && this.hooks.onShow(planetKey);
      this._render(entry);
      this.page.classList.remove("leaving"); this.page.classList.add("arrived");
    } else {
      const dir = this._direction(fromKey, entry.key);
      const w = this.hooks.onWarp(planetKey, dir);
      this._chrono(fromKey, entry.key, dir);
      this.root.classList.add("warping");
      this.page.classList.remove("arrived"); this.page.classList.add("leaving");
      await w.mid;
      this._render(entry);
      if (entry.arrive === "bottom") this._toBottom();
      this.page.classList.remove("leaving");
      void this.page.offsetWidth;
      this.page.classList.add("arrived");
      await w.done;
      this.root.classList.remove("warping");
    }
    delete this.root.dataset.dive;
    this.dive.lock = performance.now() + 900;   // let a trackpad's momentum die out before the next dive
    if (entry.focus || entry.action) setTimeout(() => { if (entry.focus) this._applyFocus(entry.focus); if (entry.action === "open-cv") this._openCv(); }, instant ? 180 : 90);
    this.busy = false;
    this._diveHint();
    if (this.queued) { const q = this.queued; this.queued = null; this._transition(q[0], q[1]); }
  };

  Browser.prototype.go = function (key, opts = {}) {
    const entry = { key, path: opts.path, focus: opts.focus, action: opts.action, dive: opts.dive, arrive: opts.arrive };
    if (this.current && this.current.key === key && key !== "notfound" && !opts.force) {
      if (opts.focus || opts.action) { if (opts.focus) this._applyFocus(opts.focus); if (opts.action === "open-cv") this._openCv(); }
      else this.viewport.scrollTo({ top: 0, behavior: "smooth" });
      this._syncChrome();
      return;
    }
    this.stack = this.stack.slice(0, this.idx + 1);
    this.stack.push(entry);

/* ==========================================================================
   Phone tilt: the desk shifts a little as the phone is tilted.
   Android turns it on by itself. iPhones need a tap (Motion > Tilt in the Scene
   panel) because iOS asks for permission first.
   ========================================================================== */
(function () {
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hasEvent = "DeviceOrientationEvent" in window;
  const needsPermission = hasEvent && typeof window.DeviceOrientationEvent.requestPermission === "function";

  let on = false, sink = null, sawData = false;

  function handler(e) {
    if (e.gamma == null || e.beta == null || !sink) return;
    sawData = true;
    const angle = (screen.orientation && screen.orientation.angle) || 0;
    let x = e.gamma, y = e.beta - 50;                 // holding a phone upright is about 50 degrees
    if (angle === 90) { x = e.beta - 50; y = -e.gamma; }
    else if (angle === 270 || angle === -90) { x = -(e.beta - 50); y = e.gamma; }
    sink(clamp(x / 22, -1, 1), clamp(y / 22, -1, 1));
  }

  async function enable() {
    if (on || !hasEvent) return on;
    if (needsPermission) {
      try { if ((await window.DeviceOrientationEvent.requestPermission()) !== "granted") return false; }
      catch (e) { return false; }
    }
    window.addEventListener("deviceorientation", handler, true);
    on = true;
    return true;
  }

  function disable() {
    if (!on) return;
    window.removeEventListener("deviceorientation", handler, true);
    on = false;
    if (sink) sink(0, 0);
  }

    supported: coarse && hasEvent && !reduced,
    needsPermission,
    setSink(fn) { sink = fn; },
    enable, disable,
    get on() { return on; },
    get sawData() { return sawData; }
  };
})();

/* ==========================================================================
   Scene environment: the time of day and the weather for the desk.

   Time of day : the visitor's own clock (dawn, day, dusk, night), or a manual pick.
   Weather     : "Live" looks up the real weather with Open-Meteo (free, no key).

                 2. Otherwise the main city of the visitor's time zone is used

                 "My location" asks the browser for permission and uses the exact spot.

(function () {
  const t = (s, v) => window.I18N.t(s, v);

  const WEATHERS = ["sunny", "cloudy", "rainy", "foggy", "snowy"];
  const LS_SCENE = "devleb.scene.v1", LS_WEATHER = "devleb.weather.v2";

    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        p.push(esc(st.reason === "timezone"
          ? t("Your time zone ({tz}) doesn't name a city. Try My location, or pick a weather.", { tz: st.tz })
          : t("Couldn't reach the weather service (some preview windows and blockers stop it). The sky is clear for now.")));
      }
      if (st.live && st.live.declined) p.push(esc(t("Location permission was declined, so your time zone's city is used.")));
      return p.join(" ");
    };

    const lineText = e => {
      const time = timeText();
      if (st.weather === "live") {
        if (st.liveState === "loading" || st.liveState === "idle") return t("Checking the weather…");
        if (st.liveState === "ok") {
          const v = { time, city: st.live.city, temp: Math.round(st.live.temp), cond: condWord(e.weather, e.phase) };
          return t(st.live.basis === "device" ? "It's {time} where you are: {temp}°C, {cond}." : "It's {time} in {city}: {temp}°C, {cond}.", v);
        }
        return t("It's {time} for you. Live weather isn't available here, so the sky is clear.", { time });
      }
      return t("It's {time}. Weather set to {w}.", { time, w: wxLabel(e.weather, e.phase) });
    };

    const render = () => {
      const e = effective();
      const icon = e.weather === "rainy" ? "rain" : e.weather === "snowy" ? "snow" : e.weather === "foggy" ? "fog" : e.weather === "cloudy" ? "cloud" : (e.phase === "night" ? "moon" : "sun");
      const label = `${t(cap(e.phase))} · ${wxLabel(e.weather, e.phase)}`;
      const b = $("#scene-btn");
      b.innerHTML = ico(icon) + `<span class="lbl">${esc(label)}</span>`;
      b.setAttribute("aria-label", t("Scene: {phase}, {weather}. Change time and weather.", { phase: t(cap(e.phase)), weather: wxLabel(e.weather, e.phase) }));
      ctl.querySelectorAll("[data-time]").forEach(c => c.setAttribute("aria-pressed", c.dataset.time === st.time));
      ctl.querySelectorAll("[data-wx]").forEach(c => {
        const v = c.dataset.wx;
        c.setAttribute("aria-pressed", v === "live" ? st.weather === "live" && !st.precise : v === "here" ? st.weather === "live" && st.precise : v === st.weather);
      });
      ctl.querySelectorAll("[data-tilt]").forEach(c => c.setAttribute("aria-pressed", !!(window.Tilt && window.Tilt.on)));
      $("#sp-note").innerHTML = noteHtml();
      if (line) line.textContent = lineText(e);
    };

    const apply = instant => {
      const e = effective();
      desk.setEnvironment(e.phase, e.weather, { instant: !!instant });
      render();
    };

    const loadLive = async ask => {
      st.liveState = "loading"; render();
      try { st.live = await liveWeather({ ask }); st.liveState = "ok"; st.reason = ""; }
      catch (err) { st.live = null; st.liveState = "failed"; st.reason = (err && err.code) || "network"; st.tz = (err && err.extra) || ""; }
      apply(false);
    };

    // ----- interaction (events are delegated, so the panel can be rebuilt freely)
    const setOpen = open => { $("#scene-pop").hidden = !open; $("#scene-btn").setAttribute("aria-expanded", open); };
    ctl.addEventListener("click", async e => {
      if (e.target.closest("#scene-btn")) { setOpen($("#scene-pop").hidden); return; }
      const tm = e.target.closest("[data-time]"), wx = e.target.closest("[data-wx]"), tl = e.target.closest("[data-tilt]");
      if (tm) { st.time = tm.dataset.time; save(); apply(false); }
      else if (wx) {
        const v = wx.dataset.wx;
        if (v === "live" || v === "here") {
          st.weather = "live"; st.precise = v === "here"; save();
          await loadLive(st.precise);
        } else { st.weather = v; save(); apply(false); }
      } else if (tl && window.Tilt) {
        if (window.Tilt.on) { window.Tilt.disable(); st.tilt = "off"; }
        else { st.tilt = (await window.Tilt.enable()) ? "on" : "off"; }
        save(); render();
      }
    });
    document.addEventListener("pointerdown", e => { if (!$("#scene-pop").hidden && !ctl.contains(e.target)) setOpen(false); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#scene-pop").hidden) { setOpen(false); $("#scene-btn").focus(); } });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (st.time === "auto") apply(false); else render(); } });

    // a language change rebuilds the labels

    // ----- tilt: Android starts it by itself; iPhone waits for a tap
    if (window.Tilt && window.Tilt.supported && (st.tilt === "on" || (st.tilt === undefined && !window.Tilt.needsPermission))) {
      window.Tilt.enable().then(ok => { if (ok) render(); });
    }

    // first look: instantly, so the desk never flashes the wrong sky
    apply(true);
    if (st.weather === "live") loadLive(false);
    setInterval(() => { if (st.time === "auto") apply(false); else render(); }, 60 * 1000);
  }

  window.SceneEnvironment = { init, phaseFor, weatherFromCode };
})();

</script>
  <script>
/* ==========================================================================
   Main controller — wires the desk, the tunnel backdrop and the browser.
   States: desk → entering → browser → exiting → desk
   ========================================================================== */
(function () {
  const content = () => window.I18N.content();
  // what is drawn on the laptop screen and on the era clocks follows the language
  const locale = () => {
    const I = window.I18N, t = I.t;
    return { rtl: I.rtl, role: content().profile.role, tabs: window.PortfolioBrowser.ROUTES.map(r => t(r.title)),
             lines: [t("Backend / Blockchain / Intelligence & data"), t("BSc Computer Science")], cta: t("Step inside") };
  };
  const eraLabels = () => Object.fromEntries(Object.entries(window.PortfolioBrowser.ERA).map(([k, v]) => [k, window.I18N.t(v.label)]));
  const $ = s => document.querySelector(s);
  const body = document.body;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mobile = window.matchMedia("(pointer: coarse)").matches || Math.min(window.innerWidth, window.innerHeight) < 600;
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  const veil = $("#veil");
  const intro = $("#intro");
  const loader = $("#loader");
  const browserEl = $("#browser");
  const canvas = $("#scene");

  let state = "desk";
  let renderer = null, desk = null, tunnel = null;

  function webglOK() {
    try {
      const c = document.createElement("canvas");
      return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl")));
    } catch (e) { return false; }
  }
  const has3D = !!window.THREE && webglOK();

  // ---------- browser (always available) ----------
  const browser = new window.PortfolioBrowser(browserEl, {
    onWarp: (key, dir) => (tunnel ? tunnel.warpTo(key, dir) : { mid: Promise.resolve(), done: new Promise(r => setTimeout(r, reduced ? 0 : 350)) }),
    onShow: key => tunnel && tunnel.show(key),
    onDesk: () => exitToDesk(),
    onScroll: p => tunnel && tunnel.setScroll(p),
    onYear: (key, label, dir) => tunnel && tunnel.setLabel(key, label, dir)
  });

  function routeFromHash() {
    const h = (location.hash || "").replace(/^#\/?/, "");
    return h ? window.PortfolioBrowser.resolveRoute(h) || "notfound" : null;
  }
  // The site always opens on Home. Only an explicit link such as  yoursite/?page=projects  opens another page;
  // a leftover #/page in the address (from an earlier visit or a refresh) is ignored.
  function routeFromLink() {
    const q = new URLSearchParams(location.search).get("page");
    return q ? window.PortfolioBrowser.resolveRoute(q) || "notfound" : null;
  }

  // ---------- 3D setup ----------
  if (has3D) {
    const T = window.THREE;
    renderer = new T.WebGLRenderer({ canvas, antialias: !mobile || window.devicePixelRatio < 2, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    desk = new window.DeskScene(renderer, { mobile, reducedMotion: reduced, name: content().profile.name, role: content().profile.role });
    desk.setLocale(locale());
    if (window.SceneEnvironment) window.SceneEnvironment.init(desk);
    tunnel = new window.TimeScene(renderer, { mobile, reducedMotion: reduced, labels: eraLabels() });
    // tilting a phone moves the desk and the tunnel a little
    if (window.Tilt) window.Tilt.setSink((x, y) => { desk.setPointer(x, y); tunnel.setPointer(x, y); });
  } else {
    body.classList.add("no-webgl");
  }

  // ---------- transitions ----------
  function showBrowser() {
    browserEl.hidden = false;
    browserEl.removeAttribute("aria-hidden");
    requestAnimationFrame(() => body.classList.add("in-browser"));
  }

  async function enterBrowser(opts = {}) {
    if (state !== "desk") return;
    if (desk && desk.cvBusy && !opts.fromCv) return;   // the CV is on its way: let it finish first
    const route = opts.route || (browser.current && browser.current.key) || "home";
    body.classList.add("leaving-desk");
    intro.setAttribute("aria-hidden", "true");
    if (desk && !opts.instant) {
      state = "entering";
      await desk.enter(t => { veil.style.opacity = smooth(0.72, 0.98, t); });
    }
    veil.style.opacity = 1;
    state = "browser";
    if (!browser.current) browser.go(route, { instant: true, focus: opts.focus, action: opts.action });
    else {
      if (tunnel) tunnel.show(browser.current.key);
      if (opts.route) browser.go(opts.route, { instant: true, focus: opts.focus, action: opts.action });
    }
    showBrowser();
    if (tunnel && !tunnel._warmed) { tunnel._warmed = true; tunnel.prewarm(window.PortfolioBrowser.ROUTES.map(r => r.key)); }
    setTimeout(() => { veil.style.opacity = 0; }, 60);
    setTimeout(() => browser.viewport.focus({ preventScroll: true }), 400);
  }

  async function exitToDesk() {
    if (state !== "browser") return;
    if (!desk) return; // no 3D: stay in the browser
    body.classList.remove("in-browser");
    veil.style.transition = "opacity .25s ease";
    veil.style.opacity = 1;
    await new Promise(r => setTimeout(r, reduced ? 0 : 260));
    browserEl.hidden = true;
    browserEl.setAttribute("aria-hidden", "true");
    veil.style.transition = "";
    if (desk) desk.resetCv();   // the CV sheet is back on the table when the desk comes into view
    state = "exiting";
    await desk.exit(t => { veil.style.opacity = 1 - smooth(0.02, 0.3, t); });
    veil.style.opacity = 0;
    state = "desk";
    body.classList.remove("leaving-desk");
    intro.removeAttribute("aria-hidden");
    $("#enter-btn").focus({ preventScroll: true });
  }

  // ---------- loop ----------
  let last = performance.now();
  let frame = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden || !renderer) return;
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    frame++;
    if (state === "browser") {
      // idle phones render at half rate to save battery
      if (mobile && !tunnel.isWarping() && frame % 2) return;
      tunnel.update(mobile && !tunnel.isWarping() ? dt * 2 : dt);
      tunnel.render();
    } else {
      desk.update(dt);
      desk.render();
    }
  }

  // ---------- input ----------
  function ndc(e) { return { x: (e.clientX / window.innerWidth) * 2 - 1, y: -(e.clientY / window.innerHeight) * 2 + 1 }; }

  // a small label that names whatever the pointer is over on the desk
  const PROP_TIP = { hourglass: "Flip the hourglass", cv: "Open my CV", coin: "See Dynamic Eye Technology" };
  const tip = document.createElement("div");
  tip.className = "prop-tip"; tip.hidden = true; tip.setAttribute("aria-hidden", "true");
  document.body.appendChild(tip);

  let hoverTick = 0;
  window.addEventListener("pointermove", e => {
    const p = ndc(e);
    if (desk) desk.setPointer(p.x, -p.y);
    if (tunnel) tunnel.setPointer(p.x, -p.y);
    if (state === "desk" && desk && !desk.cvBusy && e.pointerType === "mouse") {
      const onCanvas = e.target === canvas;
      const hit = onCanvas && desk.hitScreen(p.x, p.y);
      const prop = onCanvas && !hit ? desk.pickProp(p.x, p.y) : null;
      desk.hoverScreen = hit; desk.setHoverProp(prop);
      canvas.style.cursor = hit || prop ? "pointer" : "";
      if (prop) { tip.textContent = window.I18N.t(PROP_TIP[prop]); tip.hidden = false; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; }
      else tip.hidden = true;
    }
  }, { passive: true });

  canvas.addEventListener("click", e => {
    if (state !== "desk" || !desk || desk.cvBusy) return;
    const p = ndc(e);
    tip.hidden = true;
    if (desk.hitScreen(p.x, p.y)) { enterBrowser(); return; }
    const prop = desk.pickProp(p.x, p.y);
    if (prop === "hourglass") desk.flipHourglass();
    else if (prop === "cv") desk.raiseCv().then(() => enterBrowser({ route: "resume", action: "open-cv", fromCv: true }));   // the sheet lifts and flips first
    else if (prop === "coin") { desk.spinCoin(); enterBrowser({ route: "projects", focus: "proj-dynamic-eye-technology" }); }
  });
  canvas.addEventListener("pointerleave", () => { tip.hidden = true; if (desk) desk.setHoverProp(null); });


  window.addEventListener("wheel", e => { if (state === "desk" && e.deltaY > 25 && !loader.isConnected) enterBrowser(); }, { passive: true });
  let touchY = null;
  window.addEventListener("touchstart", e => { if (state === "desk") touchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchend", e => {
    if (state === "desk" && touchY !== null && touchY - e.changedTouches[0].clientY > 70) enterBrowser();
    touchY = null;
  }, { passive: true });

  $("#enter-btn").addEventListener("click", () => enterBrowser());
  $("#skip-btn").addEventListener("click", () => enterBrowser({ instant: true }));

  window.addEventListener("hashchange", () => {
    const key = routeFromHash();
    if (!key) return;
    if (state === "browser") { if (!browser.current || browser.current.key !== key) browser.go(key); }
    else if (state === "desk") enterBrowser({ route: key });
  });

  window.addEventListener("resize", () => {
    if (!renderer) return;
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    desk.resize(window.innerWidth, window.innerHeight);
    tunnel.resize(window.innerWidth, window.innerHeight);
    browser.refreshYear();
  });

  // ---------- start ----------
  function start() {
    const deep = routeFromLink();
    if (location.hash) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
    const finishLoading = () => {
      loader.classList.add("done");
      setTimeout(() => loader.remove(), 700);
    };
    if (!has3D) {
      finishLoading();
      state = "desk";
      enterBrowser({ instant: true, route: deep || "home" });
      return;
    }
    requestAnimationFrame(loop);
    if (deep) {
      // a shared link to a page goes straight to that page
      desk.lidAngle = desk.lidTarget = -0.26; desk.screenPower = 1;
      finishLoading();
      enterBrowser({ instant: true, route: deep });
      return;
    }
    setTimeout(() => {
      finishLoading();
      body.classList.add("intro-ready");
      desk.openLid();
    }, reduced ? 50 : 450);
  }

  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
  fontsReady.then(start);
})();

</script>
