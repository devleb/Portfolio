  TimeScene.prototype.resize = function (w, h) {
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    if (this.current && !this.warp) { this.current.position.copy(this._restPos()); this.current.scale.setScalar(this._restScale()); }
  };

  TimeScene.prototype.setPointer = function (x, y) { this.pointer.set(x, y); };
  TimeScene.prototype.setScroll = function (p) { this.scroll = p; };

  TimeScene.prototype.show = function (key) {
    if (this.current) this.scene.remove(this.current);
    this.current = this._marker(key);
    this.current.position.copy(this._restPos());
    this.current.scale.setScalar(this._restScale());
    this.scene.add(this.current);
  };

  /* Travel to another page's moment. dir: -1 into the past, +1 into the future.
     Returns { mid: Promise (swap content now), done: Promise } */
  TimeScene.prototype.warpTo = function (key, dir) {
    let midRes, doneRes;
    const mid = new Promise(r => (midRes = r));
    const done = new Promise(r => (doneRes = r));
    if (this.reduced || !this.current) { this.show(key); midRes(); doneRes(); return { mid, done }; }
    if (this.warp) {
      const w = this.warp; this.warp = null;
      if (w.old && w.old !== w.next) this.scene.remove(w.old);
      w.next.position.copy(this._restPos()); w.next.scale.setScalar(this._restScale());
      w.midRes(); w.doneRes(); this.current = w.next;
    }
    const old = this.current, next = this._marker(key), rest = this._restPos();
    if (next !== old) {
      next.position.set(rest.x * 0.2, rest.y * 0.2, -600);
      next.scale.setScalar(this._restScale());
      this.scene.add(next);
    }
    this.dir = dir || 1;
    this.warp = { t: 0, dur: 1.6, old, next, oldStart: old.position.clone(), rest, midRes, doneRes, midFired: false };
    this.current = next;
    return { mid, done };
  };

  TimeScene.prototype.update = function (dt) {
    this.clock += dt;
    const w = this.warp;
    let speed = 0.3, travel = 0;

    if (w) {
      w.t = Math.min(1, w.t + dt / w.dur);
      const t = w.t;
      travel = Math.sin(Math.PI * clamp(t * 1.04, 0, 1));
      const up = clamp(t / 0.36, 0, 1), down = clamp((t - 0.36) / 0.64, 0, 1);
      speed = 0.3 + 48 * (t < 0.36 ? easeIn(up) : 1 - easeOut(down));
      this.camera.fov = this.baseFov + 20 * travel;
      this.camera.rotation.z = this.dir * 0.35 * travel;
      if (w.old && w.old !== w.next) {
        const k = easeIn(clamp(t / 0.45, 0, 1));
        w.old.position.set(w.oldStart.x * (1 + k * 2), w.oldStart.y * (1 + k * 1.4), w.oldStart.z + k * 110);
        if (t > 0.45) this.scene.remove(w.old);
      }
      if (w.old !== w.next) {
        const k = easeOut(clamp((t - 0.3) / 0.7, 0, 1));
        w.next.position.set(w.rest.x * (0.2 + 0.8 * k), w.rest.y * (0.2 + 0.8 * k), -600 + (600 + w.rest.z) * k);
      }
      if (!w.midFired && t >= 0.42) { w.midFired = true; w.midRes(); }
      if (t >= 1) { this.camera.fov = this.baseFov; this.camera.rotation.z = 0; this.warp = null; w.doneRes(); }
      this.camera.updateProjectionMatrix();
    }
    if (!w) this.dir += (1 - this.dir) * Math.min(1, dt * 1.5); // hands settle back to clockwise
    this.speed += (speed - this.speed) * Math.min(1, dt * 12);
    const move = this.speed * dt * 60;

    // colour of time: warm sepia into the past, cool patina into the future
    const tint = this.tintRest.clone().lerp(this.dir < 0 ? this.tintPast : this.tintFuture, travel);
    this.endGlow.material.color.copy(tint);
    this.endGlow.scale.setScalar(700 + 500 * travel);
    this.scene.background.copy(this.bg).lerp(tint, 0.06 * travel);

    // tunnel rings rush past and twist with the direction of travel
    const twist = this.dir * this.speed * 0.035;
    this.rings.forEach((r, i) => {
      r.position.z += move;
      if (r.position.z > -2) r.position.z -= this.DEPTH;
      r.rotation.z += dt * (r.userData.spin + twist * (1 + (i % 3) * 0.35) * 60 * 0.02);
      const near = clamp((-r.position.z - 3) / 26, 0, 1);
      r.material.opacity = r.userData.base * near * (1 + 0.6 * travel);
    });

    // dust
    const d = this.dust, pp = this.ptsPos, lp = this.linePos, tail = 0.2 + this.speed * 2.2;
    for (let i = 0; i < this.N; i++) {
      let z = d[i * 3 + 2] + move;
      if (z > 2) { this._spawn(i, false); z = d[i * 3 + 2]; }
      d[i * 3 + 2] = z;
      const x = d[i * 3], y = d[i * 3 + 1];
      pp[i * 3] = x; pp[i * 3 + 1] = y; pp[i * 3 + 2] = z;
      lp[i * 6] = x; lp[i * 6 + 1] = y; lp[i * 6 + 2] = z;
      lp[i * 6 + 3] = x; lp[i * 6 + 4] = y; lp[i * 6 + 5] = z - tail;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.lines.geometry.attributes.position.needsUpdate = true;
    this.lines.material.opacity = clamp((this.speed - 1.5) / 10, 0, 1);
    this.points.material.opacity = 1 - 0.6 * this.lines.material.opacity;
    this.dustGroup.rotation.z += dt * (0.01 + twist * 0.6);

    // clocks tick; hands spin backwards into the past, forwards into the future
    [this.current, w && w.old].forEach(m => {
      if (!m || !m.parent) return;
      const u = m.userData;
      const spin = -(0.06 + this.dir * this.speed * 0.9);
      u.minute.rotation.z += dt * spin;
      u.hour.rotation.z += (dt * spin) / 12;
      u.dial.rotation.z += dt * (0.03 - this.dir * this.speed * 0.05);
      u.arms[0].rotation.z += dt * 0.25; u.arms[1].rotation.z -= dt * 0.18;
    });
    if (this.current && !w) {
      this.scrollSmooth += (this.scroll - this.scrollSmooth) * Math.min(1, dt * 4);
      const r = this._restPos();
      this.current.position.set(r.x, r.y + this.scrollSmooth * 6, r.z);
      this.current.scale.setScalar(this._restScale());
    }
    if (!this.reduced) {
      this.pointerSmooth.lerp(this.pointer, Math.min(1, dt * 2));
      this.camera.position.x = this.pointerSmooth.x * 1.2;
      this.camera.position.y = -this.pointerSmooth.y * 0.8;
    }
  };

  TimeScene.prototype.render = function () { this.renderer.render(this.scene, this.camera); };
  TimeScene.prototype.isWarping = function () { return !!this.warp; };

  // build every clock ahead of time so the first jump never stutters
  TimeScene.prototype.prewarm = function (keys) {
    const queue = keys.filter(k => !this.cache[k]);
    const idle = window.requestIdleCallback || (fn => setTimeout(fn, 120));
    const step = () => {
      const k = queue.shift(); if (!k) return;
      const m = this._marker(k);
      if (m !== this.current && !this.warp) {
        m.position.set(0, 0, -1500); this.scene.add(m);
        this.renderer.compile(this.scene, this.camera);
        this.renderer.render(this.scene, this.camera);
        this.scene.remove(m);
      }
      idle(step);
    };
    idle(step);
  };

  window.TimeScene = TimeScene;
})();

/* ==========================================================================
   The browser inside the laptop: tabs, address bar, back / forward /
   reload, and every portfolio page with its interactive features.
   ========================================================================== */
(function () {
  const C = window.CONTENT;
  const A = window.ASSETS;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const ROUTES = [
    { key: "home", title: "Home", icon: "✋" },
    { key: "education", title: "Education", icon: "🎓" },
    { key: "experience", title: "Experience", icon: "💻" },
    { key: "projects", title: "Projects", icon: "📚" },
    { key: "contact", title: "Contact", icon: "💬" },
    { key: "resume", title: "Resume", icon: "📝" },
    { key: "blog", title: "Blog", icon: "♾️" }
  ];
  const ALIASES = {
    "": "home", index: "home", about: "home", me: "home",
    edu: "education", certificates: "education", certs: "education", degree: "education",
    work: "experience", "work&experience": "experience", jobs: "experience", career: "experience",
    project: "projects", portfolio: "projects", work_samples: "projects",
    contacts: "contact", email: "contact", social: "contact",
    cv: "resume", skills: "resume",
    blogs: "blog", articles: "blog", medium: "blog"
  };
  const SCHEME = "devleb://";

  // Every page is a moment in time. n is the year the counter travels to; label is what the clock shows.
  // Pages with an earlier year are reached by travelling back, later ones by travelling ahead.
  const YEAR = new Date().getFullYear();
  const ERA = {
    education:  { n: 2009, label: "2009" },
    experience: { n: 2012, label: "2012" },
    projects:   { n: 2017, label: "2017" },
    resume:     { n: 2023, label: "2023" },
    home:       { n: YEAR, label: "NOW" },
    contact:    { n: YEAR + 1, label: "NEXT" },
    blog:       { n: YEAR + 40, label: "∞" },
    notfound:   { n: null, label: "????" }
  };
  const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  function resolveRoute(input) {
    let s = String(input || "").trim().toLowerCase();
    s = s.replace(/^devleb:\/\//, "").replace(/^https?:\/\/[^/]+/, "").replace(/^#?\/?/, "").replace(/\/+$/, "").split(/[?#]/)[0];
    if (ROUTES.some(r => r.key === s)) return s;
    if (ALIASES[s] !== undefined) return ALIASES[s];
    const partial = ROUTES.find(r => s.length >= 3 && r.key.startsWith(s));
    return partial ? partial.key : null;
  }

  // ---------- icons (simple stroke icons) ----------
  const P = {
    back: '<path d="M15 18l-6-6 6-6"/>',
    fwd: '<path d="M9 18l6-6-6-6"/>',

  // ---------- helpers shared by pages ----------
  function toast(msg) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast("Copied " + text); return true; }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
      ta.remove();
      toast(ok ? "Copied " + text : "Copy blocked here. The address is " + text);
      return ok;
    }
  }

  async function cvBytes() {
    if (A.cv.startsWith("data:")) {
      const b64 = A.cv.split(",")[1];
      const bin = atob(b64); const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    }
    const r = await fetch(A.cv);
    if (!r.ok) throw new Error("CV file not found at " + A.cv);
    return new Uint8Array(await r.arrayBuffer());
  }

  // claude.ai published pages save files through the downloads capability;
  // everywhere else a normal download link is used.
  let downloadsNS = null;
  if (window.claude && typeof window.claude.use === "function") {
    Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 8000))])
      .then(ns => { downloadsNS = ns; }).catch(() => {});
  }
  async function downloadCV() {
    if (downloadsNS) {
      try {
        const bytes = await cvBytes();
        await downloadsNS.save({ filename: A.cvFileName, data: new Blob([bytes], { type: "application/pdf" }) });
        toast("CV saved");
      } catch (e) {
        if (e && e.code === "declined") return;
        toast("The download didn't start here. Try the link on the published site.");
      }
      return;
    }
    const a = document.createElement("a");
    a.href = A.cv; a.download = A.cvFileName; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
  }

  function loadScript(src) {
    return new Promise((res, rej) => {
      if ([...document.scripts].some(s => s.src === src)) return res();
      const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load " + src));
      document.head.appendChild(s);
    });
  }

  async function renderPdf(container) {
    const V = window.VENDOR;
    container.innerHTML = '<p class="muted">Loading the CV…</p>';
    try {
      await loadScript(V.pdfWorker); // runs on the main thread: no separate worker file needed
      await loadScript(V.pdf);
      const lib = window.pdfjsLib;
      const doc = await lib.getDocument({ data: await cvBytes() }).promise;
      container.innerHTML = "";
      const width = Math.min(container.clientWidth || 800, 900);
      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const vp0 = page.getViewport({ scale: 1 });
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const vp = page.getViewport({ scale: (width / vp0.width) * dpr });
        const cv = document.createElement("canvas");
        cv.width = vp.width; cv.height = vp.height;
        cv.style.width = width + "px"; cv.style.maxWidth = "100%"; cv.style.height = "auto";
        cv.className = "pdf-page"; cv.setAttribute("aria-label", "CV page " + i);
        container.appendChild(cv);
        await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      }
    } catch (e) {
      container.innerHTML = `<p class="muted">The CV preview couldn't load (${esc(e.message)}). Use Download CV instead.</p>`;
    }
  }

      return `<line x1="${(cx + Math.cos(a) * r1).toFixed(1)}" y1="${(cx + Math.sin(a) * r1).toFixed(1)}" x2="${(cx + Math.cos(a) * r2).toFixed(1)}" y2="${(cx + Math.sin(a) * r2).toFixed(1)}" class="${major ? "tk-major" : "tk"}"/>`;
    }).join("");
    const nodes = cats.map((c, i) => {
      const a = ((-90 + (i * 360) / n) * Math.PI) / 180, x = cx + Math.cos(a) * R, y = cx + Math.sin(a) * R;
      return `<g class="lg-node" data-i="${i}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
        <title>${esc(c.cat)}</title>
        <circle class="lg-halo" r="36"/>
        <circle class="lg-dot" r="27"/>
        <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[c.icon] || ""}</svg>
      </g>`;
    }).join("");
    return `
    <svg class="lg-dial" viewBox="0 0 400 400" aria-hidden="true">
      <defs>
        <radialGradient id="lgFace" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#1f2750"/><stop offset="1" stop-color="#080c1c"/></radialGradient>
        <linearGradient id="lgBrass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d9a0"/><stop offset=".5" stop-color="#c9a25e"/><stop offset="1" stop-color="#7a5a2a"/></linearGradient>
        <filter id="lgGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <circle cx="200" cy="200" r="196" fill="url(#lgFace)"/>
      <circle cx="200" cy="200" r="192" fill="none" stroke="url(#lgBrass)" stroke-width="7"/>
      <circle class="lg-timer" cx="200" cy="200" r="186" pathLength="100"/>
      ${ticks}
      <circle class="lg-orbit" cx="200" cy="200" r="${R}"/>
      <g class="lg-hand"><line x1="200" y1="214" x2="200" y2="${200 - R + 34}"/><circle cx="200" cy="${200 - R + 34}" r="4"/></g>
      ${nodes}
      <circle cx="200" cy="200" r="60" class="lg-hub"/>
      <text x="200" y="206" class="lg-num-big">01</text>
      <text x="200" y="232" class="lg-of">of ${String(n).padStart(2, "0")}</text>
    </svg>`;
  }

  <script>
/* ==========================================================================
   Main controller — wires the desk, the tunnel backdrop and the browser.
   States: desk → entering → browser → exiting → desk

(function () {
  const C = window.CONTENT;
  const $ = s => document.querySelector(s);
  const body = document.body;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mobile = window.matchMedia("(pointer: coarse)").matches || Math.min(window.innerWidth, window.innerHeight) < 600;
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  const veil = $("#veil");
  const intro = $("#intro");
  const loader = $("#loader");
  const browserEl = $("#browser");
  const canvas = $("#scene");

  let state = "desk";
  let renderer = null, desk = null, tunnel = null;

  function webglOK() {
    try {
      const c = document.createElement("canvas");
      return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl")));
    } catch (e) { return false; }
  }

  // ---------- browser (always available) ----------
  const browser = new window.PortfolioBrowser(browserEl, {
    onWarp: (key, dir) => (tunnel ? tunnel.warpTo(key, dir) : { mid: Promise.resolve(), done: new Promise(r => setTimeout(r, reduced ? 0 : 350)) }),
    onShow: key => tunnel && tunnel.show(key),
    onDesk: () => exitToDesk(),
    onScroll: p => tunnel && tunnel.setScroll(p)
  });

  function routeFromHash() {
    const h = (location.hash || "").replace(/^#\/?/, "");
    return h ? window.PortfolioBrowser.resolveRoute(h) || "notfound" : null;
  }

  // ---------- 3D setup ----------
  if (has3D) {
    const T = window.THREE;
    renderer = new T.WebGLRenderer({ canvas, antialias: !mobile || window.devicePixelRatio < 2, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    desk = new window.DeskScene(renderer, { mobile, reducedMotion: reduced, name: C.profile.name, role: C.profile.role });
    tunnel = new window.TimeScene(renderer, { mobile, reducedMotion: reduced, labels: Object.fromEntries(Object.entries(window.PortfolioBrowser.ERA).map(([k, v]) => [k, v.label])) });

  function showBrowser() {
    browserEl.hidden = false;

    if (desk && !opts.instant) {
      state = "entering";
      await desk.enter(t => { veil.style.opacity = smooth(0.72, 0.98, t); });
    }
    veil.style.opacity = 1;
    state = "browser";
    if (!browser.current) browser.go(route, { instant: true });
    else if (tunnel) tunnel.show(browser.current.key);
    showBrowser();
    if (tunnel && !tunnel._warmed) { tunnel._warmed = true; tunnel.prewarm(window.PortfolioBrowser.ROUTES.map(r => r.key)); }
    setTimeout(() => { veil.style.opacity = 0; }, 60);
    setTimeout(() => browser.viewport.focus({ preventScroll: true }), 400);
  }

  async function exitToDesk() {
    if (state !== "browser") return;
    if (!desk) return; // no 3D: stay in the browser
    body.classList.remove("in-browser");
    veil.style.transition = "opacity .25s ease";
    veil.style.opacity = 1;
    await new Promise(r => setTimeout(r, reduced ? 0 : 260));
    browserEl.hidden = true;
    browserEl.setAttribute("aria-hidden", "true");
    veil.style.transition = "";
    state = "exiting";
    await desk.exit(t => { veil.style.opacity = 1 - smooth(0.02, 0.3, t); });
    veil.style.opacity = 0;
    state = "desk";
    body.classList.remove("leaving-desk");
    intro.removeAttribute("aria-hidden");
    $("#enter-btn").focus({ preventScroll: true });
  }

  // ---------- loop ----------
  let last = performance.now();
  let frame = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden || !renderer) return;
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    frame++;
    if (state === "browser") {
      // idle phones render at half rate to save battery
      if (mobile && !tunnel.isWarping() && frame % 2) return;
      tunnel.update(mobile && !tunnel.isWarping() ? dt * 2 : dt);
      tunnel.render();
    } else {
      desk.update(dt);
      desk.render();
    }
  }

  // ---------- input ----------
  function ndc(e) { return { x: (e.clientX / window.innerWidth) * 2 - 1, y: -(e.clientY / window.innerHeight) * 2 + 1 }; }

  let hoverTick = 0;
  window.addEventListener("pointermove", e => {
    const p = ndc(e);
    if (desk) desk.setPointer(p.x, -p.y);
    if (tunnel) tunnel.setPointer(p.x, -p.y);
    if (state === "desk" && desk && e.pointerType === "mouse" && ++hoverTick % 3 === 0) {
      const hit = e.target === canvas && desk.hitScreen(p.x, p.y);
      desk.hoverScreen = hit;
      canvas.style.cursor = hit ? "pointer" : "";
    }
  }, { passive: true });

  canvas.addEventListener("click", e => {
    if (state !== "desk" || !desk) return;
    const p = ndc(e);
    if (desk.hitScreen(p.x, p.y)) enterBrowser();
  });

  window.addEventListener("wheel", e => { if (state === "desk" && e.deltaY > 25 && !loader.isConnected) enterBrowser(); }, { passive: true });
  let touchY = null;
  window.addEventListener("touchstart", e => { if (state === "desk") touchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchend", e => {
    if (state === "desk" && touchY !== null && touchY - e.changedTouches[0].clientY > 70) enterBrowser();
    touchY = null;
  }, { passive: true });

  $("#enter-btn").addEventListener("click", () => enterBrowser());
  $("#skip-btn").addEventListener("click", () => enterBrowser({ instant: true }));

  window.addEventListener("hashchange", () => {
    const key = routeFromHash();
    if (!key) return;
    if (state === "browser") { if (!browser.current || browser.current.key !== key) browser.go(key); }
    else if (state === "desk") enterBrowser({ route: key });
  });

  window.addEventListener("resize", () => {
    if (!renderer) return;
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    desk.resize(window.innerWidth, window.innerHeight);
    tunnel.resize(window.innerWidth, window.innerHeight);
  });

  // ---------- start ----------
  function start() {
    const deep = routeFromHash();
    const finishLoading = () => {
      loader.classList.add("done");
      setTimeout(() => loader.remove(), 700);
    };
    if (!has3D) {
      finishLoading();
      state = "desk";
      enterBrowser({ instant: true, route: deep || "home" });
      return;
    }
    requestAnimationFrame(loop);
    if (deep) {
      // a shared link to a page goes straight to that page
      desk.lidAngle = desk.lidTarget = -0.26; desk.screenPower = 1;
      finishLoading();
      enterBrowser({ instant: true, route: deep });
      return;
    }
    setTimeout(() => {
      finishLoading();
      body.classList.add("intro-ready");
      desk.openLid();
    }, reduced ? 50 : 450);
  }

  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
  fontsReady.then(start);
})();

</script>
</body>
</html>
