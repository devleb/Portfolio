<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Georges Matta — Portfolio</title>
<meta name="description" content="Georges Matta, senior developer and project manager: Go and Python backends, blockchain, and intelligence & data tooling. BSc Computer Science.">
<meta name="theme-color" content="#070b1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Georges Matta — 3D portfolio
   Palette: deep midnight blue, starlight, and the desk lamp's amber (brass) carried
   into the screen. Type: Unbounded (display) + Instrument Sans (text).
   ========================================================================== */
:root {
  --void: #070b1a;
  --deep: #0d1330;
  --glass: rgba(14, 19, 46, 0.62);
  --glass-strong: rgba(10, 14, 34, 0.86);
  --line: rgba(234, 230, 218, 0.1);
  --line-strong: rgba(234, 230, 218, 0.2);
  --star: #eae6da;
  --dust: #a3a8bf;
  --amber: #f2a541;
  --amber-soft: #f6c98a;
  --signal: #6fd3e0;
  --plum: #a594e0;
  --ink: #1a0f06;
  --display: "Unbounded", "Instrument Sans", system-ui, sans-serif;
  --text: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 9px;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* The site is a night scene in both viewer themes; tokens stay dark on purpose. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --void: #070b1a; } }
:root[data-theme="dark"] { --void: #070b1a; }

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--void); color: var(--star);
  font: 400 17px/1.6 var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; display: block; }
a { color: var(--signal); text-underline-offset: 3px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--dust); }
.ico { width: 18px; height: 18px; flex: none; }

/* ---------- stage ---------- */
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
.no-webgl #scene { display: none; }
.no-webgl { background: radial-gradient(1200px 700px at 80% 30%, #2a1a4a, transparent 60%), radial-gradient(900px 600px at 10% 80%, #14204a, transparent 60%), var(--void); }
#veil { position: fixed; inset: 0; background: var(--void); opacity: 0; pointer-events: none; transition: opacity .45s ease; z-index: 30; }

#loader {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  background: var(--void); transition: opacity .6s ease;
}
#loader.done { opacity: 0; pointer-events: none; }
#loader p { font-family: var(--display); font-size: 15px; letter-spacing: .02em; color: var(--dust); margin: 0; }
#loader .dot { display: inline-block; width: 8px; height: 8px; margin-right: 10px; border-radius: 50%; background: var(--amber); animation: blink 1s ease-in-out infinite; vertical-align: middle; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- intro overlay ---------- */
.intro {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 0 clamp(20px, 5vw, 64px) calc(clamp(24px, 6vh, 64px) + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
  opacity: 0; transform: translateY(16px);
  transition: opacity .8s ease .9s, transform .8s ease .9s;
}
.intro-ready .intro { opacity: 1; transform: none; }
.leaving-desk .intro { opacity: 0; transform: translateY(12px); transition: opacity .35s ease, transform .35s ease; }
.intro-card { max-width: 440px; pointer-events: auto; }
.intro-name { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 4.6vw, 44px); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 6px; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
.intro-role { margin: 0 0 22px; color: var(--amber-soft); font-size: 17px; text-shadow: 0 1px 12px rgba(0,0,0,.7); }
.intro .actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.intro .hint { margin: 14px 0 0; font-size: 14px; color: var(--dust); }
.leaving-desk .intro-card { pointer-events: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 9px;
  min-height: 46px; padding: 0 20px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: rgba(234,230,218,.06);
  color: var(--star); text-decoration: none; font-weight: 500; font-size: 16px; cursor: pointer;
  transition: background .2s, border-color .2s, transform .15s;
}
.btn:hover { background: rgba(234,230,218,.12); border-color: rgba(234,230,218,.35); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--ink); font-weight: 600; box-shadow: 0 8px 30px -10px rgba(242,165,65,.7); }
.btn.primary:hover { background: #f7b65e; }
.btn.ghost { background: transparent; }
.link-btn { background: none; border: 0; padding: 6px 2px; color: var(--dust); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; font-size: 15px; }
.link-btn:hover { color: var(--star); }

/* ---------- browser ---------- */
.browser {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  opacity: 0; transition: opacity .5s ease;
}
.browser[hidden] { display: none; }
.in-browser .browser { opacity: 1; }
.chrome {
  flex: none; position: relative;
  padding-top: env(safe-area-inset-top, 0px);
  background: linear-gradient(to bottom, rgba(7,11,26,.92), rgba(7,11,26,.78));
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  border-bottom: 1px solid var(--line);
  transform: translateY(-100%); transition: transform .6s cubic-bezier(.2,.8,.2,1) .1s;
}
.in-browser .chrome { transform: none; }
.tabbar { display: flex; align-items: flex-end; gap: 14px; padding: 8px 12px 0; }
.lights { display: flex; gap: 8px; align-items: center; padding: 0 4px 12px; flex: none; }
.light { width: 13px; height: 13px; border-radius: 50%; border: 0; padding: 0; display: block; }
.light.red { background: #ff6b5a; cursor: pointer; position: relative; }
.light.red::after { content: "×"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; line-height: 1; color: #5a140c; opacity: 0; font-weight: 700; }
.light.red:hover::after, .light.red:focus-visible::after { opacity: 1; }
.light.yellow { background: #f2c14e; } .light.green { background: #57c26a; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 8px; flex: none;
  padding: 9px 16px 11px; min-height: 42px;
  border-radius: 12px 12px 0 0; color: var(--dust); text-decoration: none; font-size: 15px; font-weight: 500;
  position: relative; transition: color .2s, background .2s;
}
.tab:hover { color: var(--star); background: rgba(234,230,218,.05); }
.tab[aria-selected="true"] { color: var(--star); background: rgba(234,230,218,.1); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 2px; background: var(--amber); }
.fav { font-size: 15px; line-height: 1; }

.toolbar { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-top: 1px solid var(--line); }
.tool {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-width: 40px; height: 40px; padding: 0 10px; border-radius: 10px;
  background: none; border: 0; color: var(--star); cursor: pointer;
}
.tool:hover:not(:disabled) { background: rgba(234,230,218,.08); }
.tool:disabled { opacity: .3; cursor: default; }
.tool.spin .ico { animation: spin .6s ease; }
@keyframes spin { to { transform: rotate(360deg); } }
.desk-btn span { font-size: 14px; font-weight: 500; }
.address {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 14px; margin: 0 6px; border-radius: 999px;
  background: rgba(234,230,218,.07); border: 1px solid transparent; transition: border-color .2s, background .2s;
}
.address:focus-within { border-color: var(--amber); background: rgba(234,230,218,.1); }
.address .lock { width: 14px; height: 14px; color: var(--signal); }
.address input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 15px; color: var(--star); }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--amber), var(--signal)); transform: scaleX(0); transform-origin: left; }

.viewport {
  flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; outline: none;
  -webkit-overflow-scrolling: touch;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.page {
  width: min(100% - clamp(32px, 8vw, 160px), 880px);
  margin: 0 0 0 clamp(16px, 7vw, 120px);
  padding: clamp(28px, 6vh, 64px) 0 96px;
  transition: opacity .32s ease, transform .4s ease, filter .32s ease;
}
.page.leaving { opacity: 0; transform: scale(.95) translateY(8px); filter: blur(6px); }
.page.arrived { animation: arrive .75s cubic-bezier(.2,.8,.2,1) both; }
@keyframes arrive { from { opacity: 0; transform: scale(.9) translateY(24px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }

/* ---------- type ---------- */
.display { font-family: var(--display); font-weight: 600; font-size: clamp(38px, 6.2vw, 68px); line-height: 1.02; letter-spacing: -0.03em; margin: 0 0 14px; }
.page h2 { font-family: var(--display); font-weight: 500; font-size: 22px; line-height: 1.25; letter-spacing: -0.01em; margin: 0 0 12px; }
.page h3 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
.page p { margin: 0 0 14px; max-width: 64ch; }
.lede { font-size: clamp(18px, 2.1vw, 21px); line-height: 1.5; color: rgba(234,230,218,.86); }
.kicker { color: var(--amber-soft); font-weight: 500; margin: 0 0 6px !important; }
.subtitle { font-size: 19px; color: rgba(234,230,218,.86); }
.big { font-size: clamp(26px, 3.4vw, 34px) !important; }
.page-head { margin-bottom: 28px; }
.page-head .actions { margin-top: 18px; }

/* ---------- panels ---------- */
.panel {
  background: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: clamp(20px, 3vw, 30px);
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  margin-bottom: 18px;
}
.panel.slim { padding-block: 18px; }
.panel > :last-child { margin-bottom: 0; }
.points { margin: 8px 0 0; padding-left: 1.2em; }
.points li { margin: 0 0 6px; max-width: 64ch; }
.points li::marker { color: var(--amber); }
.tags { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tags li, .tag { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: rgba(111,211,224,.1); color: var(--signal); border: 1px solid rgba(111,211,224,.18); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- home ---------- */
.hero { margin-bottom: 34px; }
.avatar-wrap { position: relative; width: 132px; height: 132px; margin-bottom: 26px; }
.avatar { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid rgba(242,165,65,.6); }
.orbit { position: absolute; inset: -14px; border-radius: 50%; border: 1px dashed rgba(234,230,218,.25); animation: orbit 14s linear infinite; }
.orbit i { position: absolute; top: 50%; left: -5px; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 14px var(--amber); }
@keyframes orbit { to { transform: rotate(360deg); } }
.role { font-size: clamp(19px, 2.4vw, 23px); color: var(--amber); font-weight: 500; margin: 0 0 18px !important; }
.hero .actions { margin: 26px 0 30px; }
.facts { display: flex; flex-wrap: wrap; gap: 14px 40px; margin: 0; }
.facts dt { font-size: 14px; color: var(--dust); }
.facts dd { margin: 0; font-weight: 500; }
.hero .display, .hero .role, .hero .lede, .page-head { text-shadow: 0 1px 14px rgba(7,11,26,.85); }
.focus { display: grid; gap: 22px; }
.focus article { padding-top: 18px; border-top: 1px solid var(--line); }
.focus article:first-child { padding-top: 4px; border-top: 0; }
.focus p { margin: 0; color: rgba(234,230,218,.82); }

/* ---------- education ---------- */
.tabs-inline { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 18px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line); }
.tabs-inline button { border: 0; background: none; padding: 9px 18px; min-height: 42px; border-radius: 999px; cursor: pointer; color: var(--dust); font-weight: 500; }
.tabs-inline button[aria-selected="true"] { background: var(--star); color: var(--void); }
.cert-list { list-style: none; margin: 0; padding: 0; }
.cert-list li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); }
.cert-list li:first-child { border-top: 0; padding-top: 0; }
.cert-list h3 { margin: 0 0 2px; }
.cert-list p { margin: 0 !important; font-size: 15px; }
.chip-btn { display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 7px 12px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: none; cursor: pointer; font-size: 14px; color: var(--dust); }
.chip-btn:hover { color: var(--star); border-color: var(--amber); }
.chip-btn .ico { width: 15px; height: 15px; }

/* ---------- experience timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 30px; width: 1px; background: linear-gradient(var(--amber), rgba(111,211,224,.5), transparent); }
.timeline > li { position: relative; margin-bottom: 8px; }
.timeline > li::before { content: ""; position: absolute; left: -27px; top: 7px; width: 13px; height: 13px; border-radius: 50%; background: var(--void); border: 2px solid var(--amber); }
.timeline > li:first-child::before { background: var(--amber); box-shadow: 0 0 16px rgba(242,165,65,.7); }
.when { font-weight: 600; color: var(--amber-soft); margin: 0 0 8px !important; }

/* ---------- projects ---------- */
.filters { display: grid; gap: 16px; position: sticky; top: 12px; z-index: 2; background: var(--glass-strong); }
.search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border-radius: var(--r-md); background: rgba(234,230,218,.06); border: 1px solid var(--line); }
.search:focus-within { border-color: var(--amber); }
.search input { flex: 1; border: 0; outline: 0; background: none; min-width: 0; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-strong); background: none; cursor: pointer; font-size: 14px; color: rgba(234,230,218,.86); transition: background .15s, border-color .15s, color .15s; }
.chip .n { font-size: 12px; color: var(--dust); }
.chips .chip.rare:not(.keep) { display: none; }
.chips.show-all .chip.rare { display: inline-flex; }
.chip:hover { border-color: rgba(234,230,218,.4); }
.chip[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--ink); }
.chip[aria-pressed="true"] .n { color: rgba(26,15,6,.7); }
.filter-foot { display: flex; justify-content: space-between; align-items: center; }
.filter-foot p { margin: 0 !important; font-weight: 600; }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 18px; margin-top: 18px; }
.proj { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: flex; flex-direction: column; }
.cover {
  height: 132px; position: relative; overflow: hidden;
  background:
    radial-gradient(circle 130px at 82% 128%, transparent 0 94%, hsl(var(--h) 70% 60%) 94% 100%, transparent 101%),
    radial-gradient(circle 130px at 82% 128%, hsl(var(--h) 45% 14%) 0 94%, transparent 94.5%),
    radial-gradient(circle 230px at 82% 128%, hsl(var(--h) 80% 60% / .3), transparent),
    linear-gradient(160deg, hsl(calc(var(--h) + 200) 40% 16%), #0a0e1a 80%);
}
.cover::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-conic-gradient(from 0deg at 82% 128%, rgba(234,230,218,.55) 0 .7deg, transparent .7deg 6deg);
  -webkit-mask: radial-gradient(circle 130px at 82% 128%, transparent 0 76%, #000 77% 90%, transparent 91%);
  mask: radial-gradient(circle 130px at 82% 128%, transparent 0 76%, #000 77% 90%, transparent 91%);
}
.cover span { position: absolute; left: 22px; bottom: 14px; font-family: var(--display); font-weight: 700; font-size: 44px; letter-spacing: -0.03em; color: rgba(234,230,218,.9); line-height: 1; }
.proj-body { padding: 20px 22px 22px; display: flex; flex-direction: column; flex: 1; }
.proj-body h2 { font-size: 21px !important; margin-bottom: 6px !important; }
.proj-body h3 { font-size: 14px; color: var(--dust); font-weight: 600; margin: 14px 0 4px; }
.proj-body p { font-size: 16px; margin: 0 0 4px; }
.proj-body .points { font-size: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; color: var(--amber-soft); }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 16px; }
.tag { cursor: pointer; font: inherit; font-size: 13px; }
.tag:hover, .tag.on { background: var(--signal); color: var(--void); }
.empty { text-align: left; }

/* ---------- experience: projects inside a role ---------- */
.role-projects { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 18px; }
.role-projects li { padding-top: 16px; border-top: 1px solid var(--line); }
.role-projects li:first-child { border-top: 0; padding-top: 4px; }
.role-projects p { font-size: 16px; margin: 6px 0 0; color: rgba(234,230,218,.82); }
.proj-link { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 4px 0; min-height: 36px; background: none; border: 0; cursor: pointer; text-align: left; color: var(--signal); font-weight: 600; font-size: 18px; text-decoration: underline; text-underline-offset: 4px; }
.proj-link small { color: var(--amber-soft); font-weight: 500; font-size: 14px; text-decoration: none; }
.proj-link:hover { color: var(--star); }
.role-badge { display: inline-flex; align-items: center; gap: 7px; margin: 4px 0 2px; padding: 6px 12px; min-height: 34px; border-radius: 999px; border: 1px solid rgba(242,165,65,.35); background: rgba(242,165,65,.08); color: var(--amber-soft); font-size: 14px; cursor: pointer; text-align: left; }
.role-badge:hover { border-color: var(--amber); background: rgba(242,165,65,.14); }
.role-badge .ico { width: 15px; height: 15px; }
.flash { animation: flash 1.8s ease; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 2px var(--amber), 0 0 36px rgba(242,165,65,.35); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ---------- year counter while travelling ---------- */
.chrono { position: absolute; inset: 0; z-index: 6; display: grid; place-content: center; justify-items: center; gap: 6px; pointer-events: none; opacity: 0; transition: opacity .2s ease; }
.chrono.on { opacity: 1; }
.chrono.on.settle { opacity: 0; transition-duration: .5s; }
.chrono-year { font-family: var(--display); font-weight: 700; font-size: clamp(64px, 17vw, 190px); letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--star); text-shadow: 0 0 60px rgba(242,165,65,.65), 0 0 12px rgba(7,11,26,.9); }
.chrono-dir { font-size: 17px; color: var(--amber-soft); text-shadow: 0 1px 10px rgba(7,11,26,.9); }

/* ---------- contact ---------- */
.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; margin-bottom: 18px; }
.link-row {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px; min-height: 72px;
  border-radius: var(--r-md); background: var(--glass); border: 1px solid var(--line);
  color: var(--star); text-decoration: none; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: border-color .2s, background .2s;
}
.link-row:hover { border-color: var(--amber); background: rgba(242,165,65,.08); }
.link-row strong { display: block; font-weight: 600; }
.link-row small { display: block; color: var(--dust); font-size: 14px; }
.link-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(242,165,65,.12); color: var(--amber); flex: none; }
.link-row .ext { margin-left: auto; width: 16px; height: 16px; color: var(--dust); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.form .full { grid-column: 1 / -1; }
.form label { display: grid; gap: 6px; font-size: 15px; font-weight: 500; }
.form input, .form textarea { width: 100%; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: rgba(7,11,26,.5); font-size: 16px; resize: vertical; }
.form input:focus, .form textarea:focus { outline: 0; border-color: var(--amber); }
.form-error { color: #ff9b8a; min-height: 1em; margin: 0 !important; font-size: 15px; }

/* ---------- resume ---------- */
.resume-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 16px; }
.rows li:first-child { border-top: 0; padding-top: 0; }
.info { margin: 0; display: grid; gap: 10px; }
.info dt { font-size: 14px; color: var(--dust); }
.info dd { margin: 0; overflow-wrap: anywhere; }
/* technical leadership clock */
.lg-wrap { display: grid; grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); gap: 34px; align-items: center; margin-top: 22px; }
.lg-dial { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 18px 40px rgba(0,0,0,.5)); }
.lg-dial .tk { stroke: rgba(201,162,94,.45); stroke-width: 1.4; }
.lg-dial .tk-major { stroke: #f6c98a; stroke-width: 3; }
.lg-orbit { fill: none; stroke: rgba(201,162,94,.35); stroke-width: 1.2; stroke-dasharray: 3 7; transform-box: view-box; transform-origin: 200px 200px; animation: lgspin 60s linear infinite; }
@keyframes lgspin { to { transform: rotate(360deg); } }
.lg-timer { fill: none; stroke: var(--amber); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; transform-box: view-box; transform-origin: 200px 200px; transform: rotate(-90deg); }
.lg.auto.tick .lg-timer { opacity: .75; animation: lgtimer 6s linear forwards; }
@keyframes lgtimer { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
.lg-hand { transform-box: view-box; transform-origin: 200px 200px; transition: transform 1s cubic-bezier(.5,.05,.2,1.2); }
.lg-hand line { stroke: var(--amber); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(242,165,65,.8)); }
.lg-hand circle { fill: var(--amber); }
.lg-hub { fill: #0b1024; stroke: url(#lgBrass); stroke-width: 3; }
.lg-num-big { font-family: var(--display); font-weight: 700; font-size: 44px; fill: var(--star); text-anchor: middle; letter-spacing: -1px; }
.lg-of { font-family: var(--text); font-size: 14px; fill: var(--dust); text-anchor: middle; }
.lg-node { cursor: pointer; color: #c9a25e; }
.lg-node .lg-dot { fill: #0d1330; stroke: #c9a25e; stroke-width: 2; transition: fill .3s, stroke .3s; }
.lg-node .lg-halo { fill: var(--amber); opacity: 0; filter: url(#lgGlow); transition: opacity .4s; }
.lg-node:hover .lg-dot { stroke: var(--amber-soft); }
.lg-node.on { color: var(--ink); }
.lg-node.on .lg-dot { fill: var(--amber); stroke: #fff3d8; }
.lg-node.on .lg-halo { opacity: .55; }
.lg-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lg-item { border-radius: var(--r-md); border: 1px solid transparent; transition: background .3s, border-color .3s; }
.lg-item.open { background: linear-gradient(100deg, rgba(242,165,65,.14), rgba(242,165,65,.03) 70%); border-color: rgba(242,165,65,.35); }
.lg-cat { width: 100%; display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; min-height: 52px; background: none; border: 0; cursor: pointer; text-align: left; color: rgba(234,230,218,.72); border-radius: var(--r-md); }
.lg-cat:hover { color: var(--star); }
.lg-num { font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--dust); font-variant-numeric: tabular-nums; }
.lg-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; border: 1px solid rgba(201,162,94,.4); color: #c9a25e; transition: background .3s, color .3s; }
.lg-name { font-family: var(--display); font-weight: 500; font-size: 17px; line-height: 1.25; letter-spacing: -0.01em; transition: color .3s; }
.lg-count { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: rgba(234,230,218,.08); color: var(--dust); }
.lg-item.open .lg-name { color: var(--amber); }
.lg-item.open .lg-num { color: var(--amber-soft); }
.lg-item.open .lg-ico { background: var(--amber); color: var(--ink); border-color: var(--amber); }
.lg-item.open .lg-count { background: rgba(242,165,65,.2); color: var(--amber-soft); }
.lg-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s ease, visibility .45s; visibility: hidden; }
.lg-item.open .lg-body { grid-template-rows: 1fr; visibility: visible; }
.lg-items { overflow: hidden; min-height: 0; list-style: none; margin: 0; padding: 0 16px 0 72px; display: grid; gap: 10px; }
.lg-item.open .lg-items { padding-bottom: 16px; }
.lg-items li { display: grid; gap: 6px; font-size: 16px; }
.lg-items strong { font-weight: 600; color: var(--star); }
.lg-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.lg-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px dashed var(--amber); color: var(--amber-soft); background: rgba(242,165,65,.08); }
.lg-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: lgpulse 1.8s ease-in-out infinite; }
@keyframes lgpulse { 50% { opacity: .25; } }
.lg-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.lg-tags span::first-letter { text-transform: uppercase; }
.lg-tags span { display: inline-block; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: rgba(124,199,180,.12); color: var(--signal); border: 1px solid rgba(124,199,180,.22); }
@media (max-width: 860px) {
  .lg-wrap { grid-template-columns: 1fr; gap: 22px; }
  .lg-dial { max-width: 280px; margin: 0 auto; }
  .lg-items { padding-left: 16px; }
  .lg-name { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { .lg-orbit, .lg-status::before { animation: none; } }
.skills-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.skills-head h2 { margin: 0 !important; }
.skills-chart { display: grid; gap: 20px; position: relative; }
.skill-cat h3 { color: var(--amber-soft); font-size: 15px; margin-bottom: 8px; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(120px, 220px) 1fr 44px; align-items: center; gap: 12px; padding: 4px 6px; border-radius: 8px; cursor: default; }
.bar:hover, .bar:focus-visible { background: rgba(234,230,218,.06); }
.bar-name { font-size: 15px; }
.bar-v { font-size: 14px; color: var(--dust); text-align: right; font-variant-numeric: tabular-nums; }
.track { height: 10px; border-radius: 999px; background: rgba(234,230,218,.07); overflow: hidden; }
.fill { display: block; height: 100%; width: var(--v); border-radius: inherit; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; transform-origin: left; }
@keyframes grow { from { transform: scaleX(0); } }
.l5 { background: var(--amber); } .l4 { background: var(--amber-soft); } .l3 { background: var(--signal); } .l2 { background: var(--plum); }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 0; margin: 18px 0 0; font-size: 14px; color: var(--dust); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
.panel { position: relative; }
.skill-tip { position: absolute; z-index: 3; pointer-events: none; padding: 9px 12px; border-radius: 10px; background: var(--star); color: var(--void); font-size: 14px; line-height: 1.45; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; min-width: 170px; }
.skill-tip.show { opacity: 1; transform: none; }
.cv-view { display: grid; justify-items: center; gap: 14px; }
.cv-view[hidden] { display: none; }
.pdf-page { border-radius: 6px; box-shadow: 0 10px 40px -10px rgba(0,0,0,.6); background: #fff; }

/* ---------- blog ---------- */
.post { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 26px; align-items: center; }
.post img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: var(--r-md); }
.post .btn { margin-top: 6px; }
.dest { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.dest a { display: block; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); color: var(--star); text-decoration: none; }
.dest a:hover { border-color: var(--amber); }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 50; transform: translate(-50%, 20px); opacity: 0; padding: 12px 18px; border-radius: 999px; background: var(--star); color: var(--void); font-weight: 500; font-size: 15px; transition: opacity .25s, transform .25s; pointer-events: none; max-width: calc(100% - 32px); }

}

  <script>
/* ==========================================================================
   Desk scene — a warm desk at night: laptop, lamp, mug, plant, books,
   a little planet model and a window full of stars.
   The laptop screen is a live canvas texture. Entering flies the camera
   into the screen until it fills the viewport.
   ========================================================================== */
(function () {
  const T = window.THREE;
  const TAU = Math.PI * 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function canvasTex(w, h, draw, opts = {}) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    draw(g, w, h);
    const t = new T.CanvasTexture(c);
    t.encoding = T.sRGBEncoding;
    t.anisotropy = opts.aniso || 4;
    if (opts.repeat) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }
    return t;
  }

  function roundedRectShape(w, h, r, x0 = -w / 2, y0 = -h / 2) {
    const s = new T.Shape();
    s.moveTo(x0 + r, y0);
    s.lineTo(x0 + w - r, y0);
    s.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
    s.lineTo(x0 + w, y0 + h - r);
    s.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h);
    s.lineTo(x0 + r, y0 + h);
    s.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r);
    s.lineTo(x0, y0 + r);
    s.quadraticCurveTo(x0, y0, x0 + r, y0);
    return s;
  }

  // ---------- procedural textures ----------
  function woodTexture() {
    return canvasTex(1024, 512, (g, w, h) => {
      g.fillStyle = "#6a4128"; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 260; i++) {
        const y = Math.random() * h;
        const amp = 2 + Math.random() * 7;
        const f = 0.004 + Math.random() * 0.01;
        const ph = Math.random() * 10;
        g.strokeStyle = `rgba(${40 + Math.random() * 40},${20 + Math.random() * 20},${10},${0.08 + Math.random() * 0.18})`;
        g.lineWidth = 0.6 + Math.random() * 2.4;
        g.beginPath();
        for (let x = 0; x <= w; x += 8) {
          const yy = y + Math.sin(x * f + ph) * amp + Math.sin(x * f * 3.1 + ph) * amp * 0.3;
          x === 0 ? g.moveTo(x, yy) : g.lineTo(x, yy);
        }
        g.stroke();
      }
      // a few knots
      for (let k = 0; k < 3; k++) {
        const x = Math.random() * w, y = Math.random() * h;
        const gr = g.createRadialGradient(x, y, 1, x, y, 22);
        gr.addColorStop(0, "rgba(40,20,10,.55)"); gr.addColorStop(1, "rgba(40,20,10,0)");
        g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, 30, 10, 0, 0, TAU); g.fill();
      }
      const sheen = g.createLinearGradient(0, 0, 0, h);
      sheen.addColorStop(0, "rgba(255,210,160,.05)"); sheen.addColorStop(1, "rgba(0,0,0,.12)");
      g.fillStyle = sheen; g.fillRect(0, 0, w, h);
    }, { aniso: 8 });
  }

  function wallTexture() {
    return canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = "#3a3440"; g.fillRect(0, 0, w, h);
      const img = g.getImageData(0, 0, w, h);
      for (let i = 0; i < img.data.length; i += 4) {
        const n = (Math.random() - 0.5) * 14;
        img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
      }
      g.putImageData(img, 0, 0);
    }, { repeat: [3, 2] });
  }

  function nightSkyTexture() {
    return canvasTex(1024, 768, (g, w, h) => {
      const bg = g.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, "#0a1030"); bg.addColorStop(0.7, "#1b1b4a"); bg.addColorStop(1, "#3b2a55");
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      // nebula haze
      [["rgba(120,80,190,.20)", 0.3, 0.35, 320], ["rgba(242,165,65,.10)", 0.75, 0.6, 260], ["rgba(111,211,224,.10)", 0.6, 0.2, 240]].forEach(([c, x, y, r]) => {
        const gr = g.createRadialGradient(x * w, y * h, 0, x * w, y * h, r);
        gr.addColorStop(0, c); gr.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = gr; g.fillRect(0, 0, w, h);
      });
      for (let i = 0; i < 700; i++) {
        const r = Math.random() < 0.94 ? Math.random() * 1.1 + 0.3 : Math.random() * 2 + 1.2;
        g.fillStyle = `rgba(255,${230 + Math.random() * 25},${200 + Math.random() * 55},${0.4 + Math.random() * 0.6})`;
        g.beginPath(); g.arc(Math.random() * w, Math.random() * h * 0.92, r, 0, TAU); g.fill();
      }
      // moon
      const mx = w * 0.78, my = h * 0.26, mr = 46;
      const glow = g.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 3);
      glow.addColorStop(0, "rgba(255,240,210,.35)"); glow.addColorStop(1, "rgba(255,240,210,0)");
      g.fillStyle = glow; g.fillRect(0, 0, w, h);
      g.fillStyle = "#f3ead6"; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
      g.fillStyle = "rgba(170,160,140,.35)";
      [[-12, -8, 10], [14, 10, 7], [4, -20, 5], [-16, 16, 6]].forEach(([dx, dy, r]) => { g.beginPath(); g.arc(mx + dx, my + dy, r, 0, TAU); g.fill(); });
      // distant hills / city line
      g.fillStyle = "#0c0a18";
      g.beginPath(); g.moveTo(0, h);
      for (let x = 0; x <= w; x += 16) g.lineTo(x, h * 0.86 - Math.sin(x * 0.006) * 30 - Math.sin(x * 0.02) * 8);
      g.lineTo(w, h); g.fill();
      for (let i = 0; i < 40; i++) {
        g.fillStyle = `rgba(255,${180 + Math.random() * 60},90,${0.5 + Math.random() * 0.5})`;
        g.fillRect(Math.random() * w, h * 0.9 + Math.random() * h * 0.08, 2, 2);
      }
    });
  }

  function keyboardTexture() {
    return canvasTex(1024, 400, (g, w, h) => {
      g.fillStyle = "#1c1d22"; g.fillRect(0, 0, w, h);
      const rows = 6, pad = 10;
      const kh = (h - pad * (rows + 1)) / rows;
      for (let r = 0; r < rows; r++) {
        const keys = r === 5 ? [1.3, 1.1, 1.3, 5.6, 1.3, 1.1, 1, 1, 1] : r === 0 ? Array(14).fill(1) : [1.4, ...Array(11).fill(1), 1.6];
        const total = keys.reduce((a, b) => a + b, 0);
        const unit = (w - pad * (keys.length + 1)) / total;
        let x = pad;
        keys.forEach(k => {
          const kw = unit * k;
          const y = pad + r * (kh + pad);
          g.fillStyle = "#0b0b0e";
          g.beginPath(); g.roundRect ? g.roundRect(x, y, kw, r === 0 ? kh * 0.7 : kh, 6) : g.rect(x, y, kw, kh); g.fill();
          g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(x + 3, y + 2, kw - 6, 2);
          x += kw + pad;
        });
      }
    });
  }

  function softDot(color = "255,255,255") {
    return canvasTex(64, 64, (g, w) => {
      const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      gr.addColorStop(0, `rgba(${color},1)`); gr.addColorStop(0.35, `rgba(${color},.45)`); gr.addColorStop(1, `rgba(${color},0)`);
      g.fillStyle = gr; g.fillRect(0, 0, w, w);
    });
  }

  // ======================================================================
  function DeskScene(renderer, opts) {
    this.renderer = renderer;
    this.mobile = opts.mobile;
    this.reduced = opts.reducedMotion;
    this.profileName = opts.name;
    this.role = opts.role;
    this.scene = new T.Scene();
    this.scene.background = new T.Color("#120d12");
    this.scene.fog = new T.Fog("#120d12", 4, 9);
    this.camera = new T.PerspectiveCamera(40, 1, 0.01, 40);
    this.clock = 0;
    this.pointer = new T.Vector2(0, 0);
    this.pointerSmooth = new T.Vector2(0, 0);
    this.lidAngle = Math.PI / 2 - 0.02; // closed
    this.lidTarget = this.lidAngle;
    this.screenPower = 0; // 0 off → 1 on
    this.mode = "intro";
    this.fly = null;
    this.hoverScreen = false;
    this._build();
    this._buildScreen();
    this._updateHourglass(0);
    this.resize(window.innerWidth, window.innerHeight);
    this.camera.position.copy(this.introPos);
    this.camera.lookAt(this.introLook);
  }

  DeskScene.prototype._build = function () {
    const s = this.scene;
    const shadowSize = this.mobile ? 1024 : 2048;
    const DESK_Y = 0.75;
    this.DESK_Y = DESK_Y;

    // --- lights
    s.add(new T.HemisphereLight(0x9aa8ff, 0x3a2414, 0.38));
    const moon = new T.DirectionalLight(0x8ea6ff, 0.45);
    moon.position.set(0.8, 2.6, -2.5);
    s.add(moon);

    // --- room
    const floor = new T.Mesh(new T.PlaneGeometry(12, 12), new T.MeshStandardMaterial({ color: "#0c0909", roughness: 1 }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; s.add(floor);

    const wallMat = new T.MeshStandardMaterial({ map: wallTexture(), roughness: 0.95 });
    const wall = new T.Mesh(new T.PlaneGeometry(8, 4), wallMat);
    wall.position.set(0, 2, -0.72); wall.receiveShadow = true; s.add(wall);

    // window on the wall
    const win = new T.Group();
    const skyMat = new T.MeshBasicMaterial({ map: nightSkyTexture(), toneMapped: false });
    const sky = new T.Mesh(new T.PlaneGeometry(1.2, 0.86), skyMat);
    win.add(sky);
    const frameMat = new T.MeshStandardMaterial({ color: "#2a2230", roughness: 0.7 });
    const bars = [[1.3, 0.05, 0, 0.455], [1.3, 0.05, 0, -0.455], [0.05, 0.96, -0.625, 0], [0.05, 0.96, 0.625, 0], [0.03, 0.9, 0, 0], [1.25, 0.03, 0, 0]];
    bars.forEach(([w, h, x, y]) => { const b = new T.Mesh(new T.BoxGeometry(w, h, 0.05), frameMat); b.position.set(x, y, 0.02); win.add(b); });
    const sill = new T.Mesh(new T.BoxGeometry(1.42, 0.035, 0.12), frameMat); sill.position.set(0, -0.49, 0.05); win.add(sill);
    win.position.set(0.5, 1.52, -0.71);
    s.add(win);

    // --- desk
    const wood = woodTexture();
    const deskMat = new T.MeshStandardMaterial({ map: wood, roughness: 0.55, metalness: 0.05 });
    const top = new T.Mesh(new T.BoxGeometry(2.3, 0.05, 1.15), deskMat);
    top.position.set(0, DESK_Y - 0.025, -0.1); top.receiveShadow = true; top.castShadow = true; s.add(top);
    const legMat = new T.MeshStandardMaterial({ color: "#2a1c14", roughness: 0.6 });
    [[-1.08, 0.4], [1.08, 0.4], [-1.08, -0.6], [1.08, -0.6]].forEach(([x, z]) => {
      const l = new T.Mesh(new T.BoxGeometry(0.06, DESK_Y - 0.05, 0.06), legMat);
      l.position.set(x, (DESK_Y - 0.05) / 2, z); l.castShadow = true; s.add(l);
    });

    // --- laptop
    const lap = new T.Group();
    lap.position.set(0, DESK_Y, 0.02);
    s.add(lap);
    this.laptop = lap;
    const W = 0.62, D = 0.43, H = 0.02, LT = 0.008, LH = 0.405;
    this.lapDims = { W, D, H, LT, LH };
    const alu = new T.MeshStandardMaterial({ color: "#8d9099", metalness: 0.75, roughness: 0.32 });
    const baseGeo = new T.ExtrudeGeometry(roundedRectShape(W, D, 0.02), { depth: H, bevelEnabled: true, bevelThickness: 0.002, bevelSize: 0.002, bevelSegments: 2, curveSegments: 8 });
    baseGeo.rotateX(-Math.PI / 2);
    const base = new T.Mesh(baseGeo, alu);
    base.position.y = 0.002; base.castShadow = true; base.receiveShadow = true; lap.add(base);
    const kb = new T.Mesh(new T.PlaneGeometry(0.54, 0.2), new T.MeshStandardMaterial({ map: keyboardTexture(), roughness: 0.8 }));
    kb.rotation.x = -Math.PI / 2; kb.position.set(0, H + 0.0045, -0.07); lap.add(kb);
    const pad = new T.Mesh(new T.PlaneGeometry(0.2, 0.115), new T.MeshStandardMaterial({ color: "#7c7f88", metalness: 0.6, roughness: 0.25 }));
    pad.rotation.x = -Math.PI / 2; pad.position.set(0, H + 0.0045, 0.125); lap.add(pad);

    // lid pivot on the hinge
    const hinge = new T.Group();
    hinge.position.set(0, H + 0.004 + LT, -D / 2 + 0.012);
    lap.add(hinge);
    this.hinge = hinge;
    const lidGeo = new T.ExtrudeGeometry(roundedRectShape(W, LH, 0.02, -W / 2, 0), { depth: LT, bevelEnabled: true, bevelThickness: 0.0015, bevelSize: 0.0015, bevelSegments: 2, curveSegments: 8 });
    const lid = new T.Mesh(lidGeo, alu);
    lid.castShadow = true; hinge.add(lid);
    const bezel = new T.Mesh(new T.PlaneGeometry(W - 0.012, LH - 0.012), new T.MeshStandardMaterial({ color: "#09090c", roughness: 0.3, metalness: 0.2 }));
    bezel.position.set(0, LH / 2, LT + 0.0017); hinge.add(bezel);
    // logo on the back of the lid
    const logo = new T.Mesh(new T.CircleGeometry(0.028, 32), new T.MeshStandardMaterial({ color: "#f2a541", emissive: "#f2a541", emissiveIntensity: 0.25, metalness: 0.5, roughness: 0.3 }));
    logo.position.set(0, LH / 2, -0.0018); logo.rotation.y = Math.PI; hinge.add(logo);

    this.SCREEN_W = 0.566; this.SCREEN_H = this.SCREEN_W / 1.6;
    this.screenCanvas = document.createElement("canvas");
    this.screenCanvas.width = 1280; this.screenCanvas.height = 800;
    this.screenTex = new T.CanvasTexture(this.screenCanvas);
    this.screenTex.encoding = T.sRGBEncoding;
    this.screenTex.anisotropy = 8;
    const screen = new T.Mesh(new T.PlaneGeometry(this.SCREEN_W, this.SCREEN_H), new T.MeshBasicMaterial({ map: this.screenTex, toneMapped: false }));
    screen.position.set(0, LH / 2 + 0.006, LT + 0.0022);
    hinge.add(screen);
    this.screen = screen;

    this.screenLight = new T.PointLight(0x8aa0ff, 0, 1.4, 2);
    this.screenLight.position.set(0, LH / 2, 0.25);
    hinge.add(this.screenLight);

    // --- desk lamp
    const lamp = new T.Group();
    lamp.position.set(-0.78, DESK_Y, -0.32);
    s.add(lamp);
    const lampMat = new T.MeshStandardMaterial({ color: "#23262d", metalness: 0.6, roughness: 0.35 });
    const lb = new T.Mesh(new T.CylinderGeometry(0.1, 0.11, 0.02, 40), lampMat); lb.position.y = 0.01; lb.castShadow = true; lamp.add(lb);
    const arm1 = new T.Mesh(new T.CylinderGeometry(0.009, 0.009, 0.46, 12), lampMat);
    arm1.position.set(0.05, 0.23, 0.02); arm1.rotation.z = -0.22; arm1.castShadow = true; lamp.add(arm1);
    const joint = new T.Mesh(new T.SphereGeometry(0.018, 16, 12), lampMat); joint.position.set(0.1, 0.45, 0.04); lamp.add(joint);
    const arm2 = new T.Mesh(new T.CylinderGeometry(0.008, 0.008, 0.36, 12), lampMat);
    arm2.position.set(0.24, 0.5, 0.11); arm2.rotation.z = -1.25; arm2.rotation.y = -0.45; arm2.castShadow = true; lamp.add(arm2);
    const head = new T.Group(); head.position.set(0.39, 0.53, 0.19); lamp.add(head);
    const shade = new T.Mesh(new T.ConeGeometry(0.085, 0.13, 40, 1, true), new T.MeshStandardMaterial({ color: "#23262d", metalness: 0.55, roughness: 0.35, side: T.DoubleSide }));
    shade.castShadow = true;
    head.add(shade);
    const bulb = new T.Mesh(new T.SphereGeometry(0.03, 20, 16), new T.MeshBasicMaterial({ color: "#ffd9a0", toneMapped: false }));
    bulb.position.y = -0.03; head.add(bulb);
    // point the lamp head toward the laptop
    const headWorld = new T.Vector3(); head.getWorldPosition(headWorld);
    const target = new T.Vector3(0.05, DESK_Y, 0.05);
    head.lookAt(target); head.rotateX(-Math.PI / 2);
    const spot = new T.SpotLight(0xffb45e, 3.4, 4, 0.72, 0.65, 1.4);
    spot.position.copy(headWorld);
    spot.target.position.copy(target);
    spot.castShadow = true;
    spot.shadow.mapSize.set(shadowSize, shadowSize);
    spot.shadow.bias = -0.0004;
    spot.shadow.camera.near = 0.1; spot.shadow.camera.far = 3;
    s.add(spot); s.add(spot.target);
    this.spot = spot;
    const warmFill = new T.PointLight(0xff9a4a, 0.35, 2.2, 2); warmFill.position.copy(headWorld); s.add(warmFill);

    // dust drifting in the lamp beam
    const dustN = this.mobile ? 70 : 140;
    const dustGeo = new T.BufferGeometry();
    const dp = new Float32Array(dustN * 3);
    for (let i = 0; i < dustN; i++) {
      const t = Math.random();
      dp[i * 3] = lerp(headWorld.x, target.x, t) + (Math.random() - 0.5) * 0.35 * t;
      dp[i * 3 + 1] = lerp(headWorld.y, target.y + 0.05, t);
      dp[i * 3 + 2] = lerp(headWorld.z, target.z, t) + (Math.random() - 0.5) * 0.35 * t;
    }
    dustGeo.setAttribute("position", new T.BufferAttribute(dp, 3));
    this.dust = new T.Points(dustGeo, new T.PointsMaterial({ size: 0.006, map: softDot("255,210,150"), transparent: true, opacity: 0.55, depthWrite: false, blending: T.AdditiveBlending }));
    this.dustBase = dp.slice();
    s.add(this.dust);

    // --- mug with steam
    const mug = new T.Group(); mug.position.set(0.55, DESK_Y, 0.2); s.add(mug);
    const pts = [];
    for (let i = 0; i <= 12; i++) { const t = i / 12; pts.push(new T.Vector2(0.043 + Math.sin(t * Math.PI) * 0.003, t * 0.1)); }
    const mugMat = new T.MeshStandardMaterial({ color: "#e9e4da", roughness: 0.35 });
    const body = new T.Mesh(new T.LatheGeometry(pts, 40), new T.MeshStandardMaterial({ color: "#e9e4da", roughness: 0.35, side: T.DoubleSide }));
    body.castShadow = true; mug.add(body);
    const bottom = new T.Mesh(new T.CircleGeometry(0.043, 32), mugMat); bottom.rotation.x = -Math.PI / 2; bottom.position.y = 0.002; mug.add(bottom);
    const coffee = new T.Mesh(new T.CircleGeometry(0.041, 32), new T.MeshStandardMaterial({ color: "#2b160c", roughness: 0.2 }));
    coffee.rotation.x = -Math.PI / 2; coffee.position.y = 0.085; mug.add(coffee);
    const handle = new T.Mesh(new T.TorusGeometry(0.026, 0.007, 12, 24, Math.PI * 1.2), mugMat);
    handle.position.set(0.046, 0.05, 0); handle.rotation.z = -Math.PI * 0.6; handle.castShadow = true; mug.add(handle);
    mug.rotation.y = -0.6;
    this.steam = [];
    const steamTex = softDot("255,255,255");
    for (let i = 0; i < 5; i++) {
      const sp = new T.Sprite(new T.SpriteMaterial({ map: steamTex, transparent: true, opacity: 0, depthWrite: false }));
      sp.position.set(0.55, DESK_Y + 0.1, 0.2); sp.scale.setScalar(0.05);
      sp.userData.offset = i / 5; s.add(sp); this.steam.push(sp);
    }

    // --- plant
    const plant = new T.Group(); plant.position.set(0.92, DESK_Y, -0.38); s.add(plant);
    const pot = new T.Mesh(new T.CylinderGeometry(0.075, 0.058, 0.13, 32), new T.MeshStandardMaterial({ color: "#c9cfc0", roughness: 0.6 }));
    pot.position.y = 0.065; pot.castShadow = true; plant.add(pot);
    const soil = new T.Mesh(new T.CircleGeometry(0.07, 24), new T.MeshStandardMaterial({ color: "#2a1d14" })); soil.rotation.x = -Math.PI / 2; soil.position.y = 0.125; plant.add(soil);
    const leafMat = new T.MeshStandardMaterial({ color: "#3f7a4a", roughness: 0.55, side: T.DoubleSide });
    for (let i = 0; i < 11; i++) {
      const leaf = new T.Mesh(new T.SphereGeometry(0.05, 12, 8), leafMat);
      leaf.scale.set(0.35, 1.7, 0.12);
      const a = (i / 11) * TAU + Math.random() * 0.3;
      const tilt = 0.35 + Math.random() * 0.45;
      leaf.position.set(Math.cos(a) * 0.035, 0.2 + Math.random() * 0.05, Math.sin(a) * 0.035);
      leaf.rotation.set(Math.sin(a) * tilt, -a, -Math.cos(a) * tilt);
      leaf.castShadow = true; plant.add(leaf);
    }
    this.plant = plant;

    // --- books
    const books = new T.Group(); books.position.set(-0.52, DESK_Y, 0.25); books.rotation.y = 0.35; s.add(books);
    [["#2f4b7c", 0.24, 0.035, 0.17], ["#b8863b", 0.22, 0.03, 0.16], ["#6b2e3e", 0.235, 0.04, 0.165]].reduce((y, [c, w, h, d], i) => {
      const b = new T.Mesh(new T.BoxGeometry(w, h, d), new T.MeshStandardMaterial({ color: c, roughness: 0.8 }));
      b.position.set((i - 1) * 0.008, y + h / 2, 0); b.rotation.y = (i - 1) * 0.08; b.castShadow = true; b.receiveShadow = true; books.add(b);
      const pages = new T.Mesh(new T.BoxGeometry(w - 0.01, h - 0.008, d - 0.004), new T.MeshStandardMaterial({ color: "#efe7d4", roughness: 0.9 }));
      pages.position.copy(b.position); pages.position.x += 0.006; pages.rotation.copy(b.rotation); books.add(pages);
      return y + h;
    }, 0);

    // --- notebook + pen
    const note = new T.Mesh(new T.BoxGeometry(0.15, 0.008, 0.21), new T.MeshStandardMaterial({ color: "#1f3a3d", roughness: 0.85 }));
    note.position.set(0.36, DESK_Y + 0.004, 0.36); note.rotation.y = -0.25; note.castShadow = true; note.receiveShadow = true; s.add(note);
    const pen = new T.Mesh(new T.CylinderGeometry(0.004, 0.004, 0.14, 10), new T.MeshStandardMaterial({ color: "#f2a541", metalness: 0.4, roughness: 0.3 }));
    pen.rotation.z = Math.PI / 2; pen.rotation.y = 0.6; pen.position.set(0.37, DESK_Y + 0.013, 0.36); pen.castShadow = true; s.add(pen);

    // --- hourglass: the desk's hint at what is inside the laptop
    const hg = new T.Group(); hg.position.set(0.5, DESK_Y, -0.3); s.add(hg);
    const brass = new T.MeshStandardMaterial({ color: "#b8945a", metalness: 0.7, roughness: 0.35 });
    const spin = new T.Group(); spin.position.y = 0.088; hg.add(spin);
    [0.08, -0.08].forEach(y => { const pl = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 0.01, 32), brass); pl.position.y = y; pl.castShadow = true; spin.add(pl); });
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * TAU + 0.4;
      const post = new T.Mesh(new T.CylinderGeometry(0.0035, 0.0035, 0.16, 8), brass);
      post.position.set(Math.cos(a) * 0.043, 0, Math.sin(a) * 0.043); post.castShadow = true; spin.add(post);
    }
    const prof = [[0.001, -0.07], [0.028, -0.066], [0.036, -0.045], [0.03, -0.02], [0.01, -0.006], [0.004, 0], [0.01, 0.006], [0.03, 0.02], [0.036, 0.045], [0.028, 0.066], [0.001, 0.07]].map(([r, y]) => new T.Vector2(r, y));
    spin.add(new T.Mesh(new T.LatheGeometry(prof, 32), new T.MeshStandardMaterial({ color: "#cfe6ff", transparent: true, opacity: 0.2, roughness: 0.05, metalness: 0.1, side: T.DoubleSide, depthWrite: false })));
    const sandMat = new T.MeshStandardMaterial({ color: "#f2a541", roughness: 0.8, emissive: "#f2a541", emissiveIntensity: 0.08 });
    const topSand = new T.Mesh(new T.CylinderGeometry(0.03, 0.005, 1, 20), sandMat); spin.add(topSand);
    const botSand = new T.Mesh(new T.ConeGeometry(0.033, 1, 20), sandMat); spin.add(botSand);
    const stream = new T.Mesh(new T.CylinderGeometry(0.0012, 0.0012, 0.07, 6), sandMat); stream.position.y = -0.03; spin.add(stream);
    this.hourglass = { spin, topSand, botSand, stream, t: 0 };

    // raycast targets
    this.raycaster = new T.Raycaster();
    this.hitTargets = [this.screen, bezel, lid];

    // camera framing
    this.introLook = new T.Vector3(0.02, DESK_Y + 0.17, -0.04);
    this.introPosBase = new T.Vector3(0.42, DESK_Y + 0.58, 1.38);
    this.introPos = this.introPosBase.clone();
  };

  // ---------- the laptop screen (canvas) ----------
  DeskScene.prototype._buildScreen = function () {
    const n = 180;
    this.screenStars = Array.from({ length: n }, () => ({ x: Math.random(), y: 0.14 + Math.random() * 0.86, r: Math.random() * 1.6 + 0.4, p: Math.random() * TAU, s: 0.5 + Math.random() * 2 }));
    this._drawScreen(0);
  };

  DeskScene.prototype._drawScreen = function (t) {
    const g = this.screenCanvas.getContext("2d");
    const w = 1280, h = 800;
    const p = this.screenPower;
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    if (p <= 0.001) { this.screenTex.needsUpdate = true; return; }
    g.globalAlpha = clamp(p, 0, 1);

    const bg = g.createRadialGradient(w * 0.72, h * 0.45, 20, w * 0.6, h * 0.5, w * 0.9);
    bg.addColorStop(0, "#2a1a4a"); bg.addColorStop(0.5, "#101634"); bg.addColorStop(1, "#070b1a");
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    this.screenStars.forEach(st => {
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * st.s + st.p));
      g.fillStyle = `rgba(234,230,218,${a})`;
      g.beginPath(); g.arc(st.x * w, st.y * h, st.r, 0, TAU); g.fill();
    });
    // time dial: a brass-rimmed clock whose minute hand runs backwards
    const px = w * 0.77, py = h * 0.58, pr = 150;
    const halo = g.createRadialGradient(px, py, pr * 0.7, px, py, pr * 2.1);
    halo.addColorStop(0, "rgba(242,165,65,.32)"); halo.addColorStop(1, "rgba(242,165,65,0)");
    g.fillStyle = halo; g.fillRect(0, 0, w, h);
    g.lineWidth = 2;
    for (let i = 1; i <= 5; i++) {
      g.strokeStyle = `rgba(201,162,94,${0.34 - i * 0.05})`;
      g.setLineDash([7, 11]); g.lineDashOffset = t * 14 * (i % 2 ? 1 : -1);
      g.beginPath(); g.arc(px, py, pr * (1 + i * 0.3), 0, TAU); g.stroke();
    }
    g.setLineDash([]);
    const face = g.createRadialGradient(px - 40, py - 50, 10, px, py, pr);
    face.addColorStop(0, "#242d55"); face.addColorStop(1, "#090d1d");
    g.fillStyle = face; g.beginPath(); g.arc(px, py, pr, 0, TAU); g.fill();
    g.strokeStyle = "#c9a25e"; g.lineWidth = 9; g.beginPath(); g.arc(px, py, pr, 0, TAU); g.stroke();
    for (let i = 0; i < 60; i++) {
      const a = (i / 60) * TAU, major = i % 5 === 0, r1 = pr - 12, r2 = pr - (major ? 36 : 22);
      g.strokeStyle = major ? "#f6c98a" : "rgba(201,162,94,.6)"; g.lineWidth = major ? 4 : 2;
      g.beginPath(); g.moveTo(px + Math.cos(a) * r1, py + Math.sin(a) * r1); g.lineTo(px + Math.cos(a) * r2, py + Math.sin(a) * r2); g.stroke();
    }
    const hand = (a, len, wd, col) => {
      g.strokeStyle = col; g.lineWidth = wd; g.lineCap = "round";
      g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.sin(a) * len, py - Math.cos(a) * len); g.stroke();
    };
    hand(-t * 0.05 + 0.9, pr * 0.5, 9, "#eae6da");
    hand(-t * 0.6, pr * 0.78, 5, "#f2a541");
    g.lineCap = "butt";
    g.fillStyle = "#f2a541"; g.beginPath(); g.arc(px, py, 9, 0, TAU); g.fill();

    // browser chrome
    g.fillStyle = "rgba(10,14,34,.92)"; g.fillRect(0, 0, w, 104);
    ["#ff6b5a", "#f2c14e", "#57c26a"].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(34 + i * 30, 30, 9, 0, TAU); g.fill(); });
    const tabs = ["Home", "Education", "Experience", "Projects", "Contact", "Resume", "Blog"];
    let tx = 140;
    g.font = "500 20px 'Instrument Sans', system-ui, sans-serif";
    tabs.forEach((name, i) => {
      const tw = g.measureText(name).width + 44;
      if (i === 0) { g.fillStyle = "rgba(234,230,218,.12)"; g.beginPath(); (g.roundRect ? g.roundRect(tx, 10, tw, 40, 10) : g.rect(tx, 10, tw, 40)); g.fill(); }
      g.fillStyle = i === 0 ? "#eae6da" : "rgba(234,230,218,.55)";
      g.fillText(name, tx + 22, 37);
      tx += tw + 6;
    });
    g.fillStyle = "rgba(234,230,218,.08)";
    g.beginPath(); (g.roundRect ? g.roundRect(140, 60, w - 180, 34, 17) : g.rect(140, 60, w - 180, 34)); g.fill();
    g.fillStyle = "rgba(234,230,218,.7)"; g.font = "400 18px 'Instrument Sans', system-ui, sans-serif";
    g.fillText("devleb://home", 162, 83);

    // hero text
    g.fillStyle = "#eae6da";
    g.font = "600 76px 'Unbounded', 'Instrument Sans', system-ui, sans-serif";
    g.fillText(this.profileName, 86, 330);
    g.fillStyle = "#f2a541";
    g.font = "500 30px 'Instrument Sans', system-ui, sans-serif";
    g.fillText(this.role, 90, 385);
    g.fillStyle = "rgba(234,230,218,.7)";
    g.font = "400 24px 'Instrument Sans', system-ui, sans-serif";
    ["Backend / Blockchain / Intelligence & data", "BSc Computer Science"].forEach((l, i) => g.fillText(l, 90, 440 + i * 36));

    // call to action pulse
    const pulse = 0.5 + 0.5 * Math.sin(t * 3);
    const hover = this.hoverScreen ? 1 : 0;
    g.fillStyle = `rgba(242,165,65,${0.85 + 0.15 * hover})`;
    g.beginPath(); (g.roundRect ? g.roundRect(90, 560, 250, 64, 32) : g.rect(90, 560, 250, 64)); g.fill();
    g.strokeStyle = `rgba(242,165,65,${0.4 * (1 - pulse)})`; g.lineWidth = 3 + pulse * 10;
    g.beginPath(); (g.roundRect ? g.roundRect(90 - pulse * 8, 560 - pulse * 8, 250 + pulse * 16, 64 + pulse * 16, 40) : g.rect(90, 560, 250, 64)); g.stroke();
    g.fillStyle = "#1a0f06"; g.font = "600 24px 'Instrument Sans', system-ui, sans-serif";
    g.fillText("Step inside", 152, 600);

    // boot overlay
    if (p < 1) {
      g.globalAlpha = 1 - p;
      g.fillStyle = "#070b1a"; g.fillRect(0, 0, w, h);
      g.fillStyle = "#f2a541"; g.font = "600 56px 'Unbounded', system-ui, sans-serif";
      g.textAlign = "center"; g.fillText("DevLeb", w / 2, h / 2 + 18); g.textAlign = "left";
    }
    g.globalAlpha = 1;
    // subtle scanline glare
    const glare = g.createLinearGradient(0, 0, w, h);
    glare.addColorStop(0, "rgba(255,255,255,.06)"); glare.addColorStop(0.4, "rgba(255,255,255,0)");
    g.fillStyle = glare; g.fillRect(0, 0, w, h);
    this.screenTex.needsUpdate = true;
  };

  // sand runs for 40 s, then the hourglass is lifted, flipped and set down again
  DeskScene.prototype._updateHourglass = function (dt) {
    const h = this.hourglass; h.t += dt;
    const PERIOD = 40, FLIP = 1.2;
    const n = Math.floor(h.t / PERIOD), p = h.t % PERIOD;
    const flipK = clamp(p / FLIP, 0, 1), k = clamp((p - FLIP) / (PERIOD - FLIP), 0, 1);
    h.spin.rotation.z = n === 0 ? 0 : Math.PI * (n - 1 + easeInOut(flipK));
    h.spin.position.y = 0.088 + (n === 0 ? 0 : Math.sin(Math.PI * flipK) * 0.03);
    const top = n % 2 === 0 ? 1 - k : k, bot = 1 - top;
    const th = Math.max(0.001, top * 0.055), bh = Math.max(0.001, bot * 0.05);
    h.topSand.scale.y = th; h.topSand.position.y = 0.006 + th / 2;
    h.botSand.scale.y = bh; h.botSand.position.y = -0.066 + bh / 2;
    h.stream.visible = flipK >= 1 && k > 0.001 && k < 0.999;
  };

  // ---------- public API ----------
  DeskScene.prototype.resize = function (w, h) {
    const aspect = w / h;
    this.camera.aspect = aspect;
    // pull back on narrow (portrait) screens so the laptop stays framed
    const k = aspect < 1 ? clamp(0.62 / aspect, 1, 1.6) : aspect < 1.3 ? 1.15 : 1;
    this.camera.fov = aspect < 1 ? 56 : 40;
    // on portrait screens aim a little lower so the laptop sits above the intro text
    this.introLook.y = this.DESK_Y + (aspect < 1 ? 0.02 : 0.17);
    this.introPos = this.introLook.clone().add(this.introPosBase.clone().sub(this.introLook).multiplyScalar(k));
    this.camera.updateProjectionMatrix();
    if (this.mode === "intro" && !this.fly) this.camera.position.copy(this.introPos);
  };

  DeskScene.prototype.openLid = function () {
    this.lidTarget = -0.26;
    this.powerOnAt = this.clock + (this.reduced ? 0 : 1.1);
  };

  DeskScene.prototype.setPointer = function (x, y) { this.pointer.set(x, y); };

  DeskScene.prototype.hitScreen = function (ndcX, ndcY) {
    this.raycaster.setFromCamera({ x: ndcX, y: ndcY }, this.camera);
    return this.raycaster.intersectObjects(this.hitTargets, false).length > 0;
  };

  DeskScene.prototype._screenFrame = function () {
    this.scene.updateMatrixWorld(true);
    const center = new T.Vector3(); this.screen.getWorldPosition(center);
    const q = new T.Quaternion(); this.screen.getWorldQuaternion(q);
    const normal = new T.Vector3(0, 0, 1).applyQuaternion(q);
    const up = new T.Vector3(0, 1, 0).applyQuaternion(q);
    const vfov = (this.camera.fov * Math.PI) / 180;
    const tanH = Math.tan(vfov / 2);
    const dH = this.SCREEN_H / 2 / tanH;
    const dW = this.SCREEN_W / 2 / (tanH * this.camera.aspect);
    const d = Math.min(dH, dW) * 0.96; // fill the viewport completely
    const pos = center.clone().add(normal.clone().multiplyScalar(d));
    const m = new T.Matrix4().lookAt(pos, center, up);
    const quat = new T.Quaternion().setFromRotationMatrix(m);
    return { pos, quat, center };
  };

  // fly into the screen; onProgress(t 0..1)
  DeskScene.prototype.enter = function (onProgress) {
    return new Promise(resolve => {
      this.lidAngle = this.lidTarget = -0.26;
      this.screenPower = 1;
      const end = this._screenFrame();
      const startPos = this.camera.position.clone();
      const startQuat = this.camera.quaternion.clone();
      const mid = startPos.clone().lerp(end.pos, 0.5); mid.y += 0.08; mid.x += 0.12;
      this.mode = "entering";
      this.fly = { t: 0, dur: this.reduced ? 0.01 : 1.7, startPos, startQuat, mid, end, onProgress, resolve };
    });
  };

  // fly back out to the desk view
  DeskScene.prototype.exit = function (onProgress) {
    return new Promise(resolve => {
      const from = this._screenFrame();
      this.camera.position.copy(from.pos);
      this.camera.quaternion.copy(from.quat);
      const m = new T.Matrix4().lookAt(this.introPos, this.introLook, new T.Vector3(0, 1, 0));
      const endQuat = new T.Quaternion().setFromRotationMatrix(m);
      const mid = from.pos.clone().lerp(this.introPos, 0.5); mid.y += 0.1; mid.x -= 0.1;
      this.mode = "exiting";
      this.fly = { t: 0, dur: this.reduced ? 0.01 : 1.5, startPos: from.pos.clone(), startQuat: from.quat.clone(), mid, end: { pos: this.introPos.clone(), quat: endQuat }, onProgress, resolve, out: true };
    });
  };

  DeskScene.prototype.update = function (dt) {
    this.clock += dt;
    const t = this.clock;

    // lid
    this.lidAngle += (this.lidTarget - this.lidAngle) * (this.reduced ? 1 : 1 - Math.pow(0.02, dt));
    this.hinge.rotation.x = this.lidAngle;
    if (this.powerOnAt !== undefined && t > this.powerOnAt) this.screenPower = Math.min(1, this.screenPower + dt / (this.reduced ? 0.01 : 1.2));
    this.screenLight.intensity = 0.7 * this.screenPower;

    // screen canvas at ~30fps
    this._screenAcc = (this._screenAcc || 0) + dt;
    if (this._screenAcc > 1 / 30 && this.mode !== "hidden") { this._screenAcc = 0; this._drawScreen(t); }

    // ambient life
    if (!this.reduced) {
      this._updateHourglass(dt);
      this.plant.rotation.z = Math.sin(t * 0.7) * 0.01;
      const dp = this.dust.geometry.attributes.position;
      for (let i = 0; i < dp.count; i++) {
        dp.array[i * 3] = this.dustBase[i * 3] + Math.sin(t * 0.3 + i) * 0.02;
        dp.array[i * 3 + 1] = this.dustBase[i * 3 + 1] + Math.sin(t * 0.2 + i * 1.7) * 0.03;
      }
      dp.needsUpdate = true;
      this.steam.forEach(sp => {
        const k = (t * 0.22 + sp.userData.offset) % 1;
        sp.position.y = this.DESK_Y + 0.1 + k * 0.22;
        sp.position.x = 0.55 + Math.sin(k * 6 + sp.userData.offset * 9) * 0.02;
        sp.scale.setScalar(0.04 + k * 0.08);
        sp.material.opacity = Math.sin(k * Math.PI) * 0.12;
      });
    }

    // camera
    if (this.fly) {
      const f = this.fly;
      f.t = Math.min(1, f.t + dt / f.dur);
      const e = easeInOut(f.t);
      const a = f.startPos.clone().lerp(f.mid, e), b = f.mid.clone().lerp(f.end.pos, e);
      this.camera.position.copy(a.lerp(b, e));
      const qe = f.out ? easeOut(f.t) : Math.pow(e, 0.8);
      this.camera.quaternion.copy(f.startQuat).slerp(f.end.quat, qe);
      if (f.onProgress) f.onProgress(f.t);
      if (f.t >= 1) {
        this.fly = null;
        this.mode = f.out ? "intro" : "inside";
        f.resolve();
      }
    } else if (this.mode === "intro") {
      const k = this.reduced ? 0 : 1 - Math.pow(0.05, dt);
      this.pointerSmooth.lerp(this.pointer, k);
      const off = new T.Vector3(this.pointerSmooth.x * 0.16, -this.pointerSmooth.y * 0.08 + Math.sin(t * 0.4) * 0.008, 0);
      this.camera.position.copy(this.introPos).add(off);
      this.camera.lookAt(this.introLook);
    }
  };

  DeskScene.prototype.render = function () {
    this.renderer.render(this.scene, this.camera);
  };

  window.DeskScene = DeskScene;
})();

</script>
  <script>
/* ==========================================================================
   Time scene — the backdrop inside the laptop browser.
   A tunnel of clock dials. Each page is a moment in time marked by a brass
   astrolabe clock. Switching tabs travels through the tunnel: twisting one
   way into the past, the other way into the future.
   ========================================================================== */
(function () {
  const T = window.THREE;
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  const ROMAN = ["XII", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI"];

  // clock look per page (label comes from the browser's era for that page)
  const MARKERS = {
    home:       { tint: "#f2a541", metal: "#c9a25e" },
    education:  { tint: "#7cc7b4", metal: "#b7c4bd" },
    experience: { tint: "#e0a36a", metal: "#b87333" },
    projects:   { tint: "#7cc7b4", metal: "#c9a25e" },
    contact:    { tint: "#f6c98a", metal: "#d9c7a0" },
    resume:     { tint: "#f2a541", metal: "#b8945a" },
    blog:       { tint: "#c9a0dc", metal: "#b9a6c9" },
    notfound:   { tint: "#8a90a8", metal: "#6f7382" }
  };

  function tex(w, h, draw) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 4; return t;
  }
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };

  // a transparent clock-dial band: ticks, numerals, gear teeth
  function dialTexture(variant, color, size = 1024) {
    return tex(size, size, (g, w) => {
      g.scale(w / 1024, w / 1024); w = 1024;
      const c = w / 2, r1 = w * 0.49, r0 = w * 0.37;
      g.strokeStyle = rgba(color, 0.9); g.fillStyle = rgba(color, 0.9);
      g.lineWidth = 4; g.beginPath(); g.arc(c, c, r1, 0, TAU); g.stroke();
      g.lineWidth = 2; g.beginPath(); g.arc(c, c, r0, 0, TAU); g.stroke();
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * TAU, major = i % 5 === 0;
        const len = major ? 34 : 16;
        g.lineWidth = major ? 5 : 2;
        g.beginPath();
        g.moveTo(c + Math.cos(a) * (r1 - 8), c + Math.sin(a) * (r1 - 8));
        g.lineTo(c + Math.cos(a) * (r1 - 8 - len), c + Math.sin(a) * (r1 - 8 - len));
        g.stroke();
      }
      g.textAlign = "center"; g.textBaseline = "middle";
      g.font = `600 ${variant === 0 ? 46 : 34}px Georgia, 'Times New Roman', serif`;
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU - Math.PI / 2;
        const rr = (r0 + r1) / 2 - 20;
        g.save(); g.translate(c + Math.cos(a) * rr, c + Math.sin(a) * rr); g.rotate(a + Math.PI / 2);
        g.fillText(variant === 0 ? ROMAN[i] : variant === 1 ? String(i * 5).padStart(2, "0") : "", 0, 0);
        g.restore();
      }
      if (variant === 2) { // gear teeth
        for (let i = 0; i < 72; i++) {
          g.save(); g.translate(c, c); g.rotate((i / 72) * TAU);
          g.fillRect(-7, -r1 - 2, 14, 18); g.restore();
        }
        g.setLineDash([10, 14]); g.lineWidth = 3; g.beginPath(); g.arc(c, c, r0 + 30, 0, TAU); g.stroke(); g.setLineDash([]);
      }
    });
  }

  function glowTexture(color) {
    return tex(256, 256, (g, w) => {
      const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      gr.addColorStop(0, rgba(color, 0.55)); gr.addColorStop(0.35, rgba(color, 0.16)); gr.addColorStop(1, rgba(color, 0));
      g.fillStyle = gr; g.fillRect(0, 0, w, w);
    });
  }

  // the enamel face of an era clock, with its year label
  function faceTexture(label, cfg, size = 1024) {
    return tex(size, size, (g, w) => {
      g.scale(w / 1024, w / 1024); w = 1024;
      const c = w / 2;
      const bg = g.createRadialGradient(c * 0.8, c * 0.7, 40, c, c, c);
      bg.addColorStop(0, "#1d2440"); bg.addColorStop(1, "#070a16");
      g.fillStyle = bg; g.beginPath(); g.arc(c, c, c, 0, TAU); g.fill();
      g.strokeStyle = rgba(cfg.metal, 0.6);
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * TAU, major = i % 5 === 0;
        g.lineWidth = major ? 8 : 3;
        g.beginPath();
        g.moveTo(c + Math.cos(a) * (c - 30), c + Math.sin(a) * (c - 30));
        g.lineTo(c + Math.cos(a) * (c - (major ? 90 : 55)), c + Math.sin(a) * (c - (major ? 90 : 55)));
        g.stroke();
      }
      g.fillStyle = rgba(cfg.metal, 0.85);
      g.font = "600 70px Georgia, 'Times New Roman', serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      [0, 3, 6, 9].forEach(i => { const a = (i / 12) * TAU - Math.PI / 2; g.fillText(ROMAN[i], c + Math.cos(a) * (c - 160), c + Math.sin(a) * (c - 160)); });
      g.fillStyle = rgba(cfg.tint, 1);
      g.font = `700 ${label.length > 4 ? 120 : 150}px 'Unbounded', 'Instrument Sans', system-ui, sans-serif`;
      g.fillText(label, c, c + 220);
    });
  }

  function TimeScene(renderer, opts) {
    this.renderer = renderer;
    this.mobile = opts.mobile;
    this.reduced = opts.reducedMotion;
    this.S = this.mobile ? 512 : 1024; // texture size
    this.dialCache = {};
    this.scene = new T.Scene();
    this.bg = new T.Color("#0a0e1a");
    this.scene.background = this.bg.clone();
    this.scene.fog = new T.Fog(this.bg.clone(), 30, 520);
    this.camera = new T.PerspectiveCamera(60, 1, 0.1, 2000);
    this.baseFov = 60;
    this.speed = 0.3; this.dir = 1;
    this.clock = 0;
    this.pointer = new T.Vector2(); this.pointerSmooth = new T.Vector2();
    this.scroll = 0; this.scrollSmooth = 0;
    this.cache = {};
    this.labels = opts.labels || {};
    this.warp = null;
    this.tintPast = new T.Color("#e0a060");
    this.tintFuture = new T.Color("#7cc7b4");
    this.tintRest = new T.Color("#f2a541");

    // light at the end of the tunnel
    this.endGlow = new T.Sprite(new T.SpriteMaterial({ map: glowTexture("#ffffff"), color: this.tintRest.clone(), transparent: true, depthWrite: false, blending: T.AdditiveBlending, fog: false }));
    this.endGlow.position.set(0, 0, -900); this.endGlow.scale.setScalar(700);
    this.scene.add(this.endGlow);

    // lights for the brass clocks
    this.scene.add(new T.AmbientLight(0x505a80, 0.55));
    const key = new T.DirectionalLight(0xffe2b8, 1.3); key.position.set(-30, 25, 40); this.scene.add(key);
    const rim = new T.DirectionalLight(0x7cc7b4, 0.55); rim.position.set(40, -10, -20); this.scene.add(rim);

    // tunnel of dials
    const K = this.mobile ? 16 : 24;
    this.SPACING = 22; this.DEPTH = K * this.SPACING;
    const dialTex = [dialTexture(0, "#c9a25e", this.S), dialTexture(1, "#7cc7b4", this.S), dialTexture(2, "#f2a541", this.S)];
    this.rings = [];
    for (let i = 0; i < K; i++) {
      const R = 22 + (i % 3) * 3;
      const m = new T.Mesh(new T.PlaneGeometry(R * 2, R * 2), new T.MeshBasicMaterial({ map: dialTex[i % 3], transparent: true, opacity: 0.5, depthWrite: false, blending: T.AdditiveBlending }));
      m.position.z = -i * this.SPACING - 6;
      m.rotation.z = Math.random() * TAU;
      m.userData = { spin: (i % 2 ? 1 : -1) * (0.02 + Math.random() * 0.05), base: 0.42 + (i % 3) * 0.08 };
      this.scene.add(m); this.rings.push(m);
    }

    // time dust: points at rest, streaks while travelling
    const N = this.mobile ? 420 : 800;
    this.N = N;
    this.dust = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) this._spawn(i, true);
    const cols = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const r = Math.random();
      cols.set(r < 0.45 ? [0.95, 0.72, 0.4] : r < 0.7 ? [0.5, 0.82, 0.74] : [0.93, 0.9, 0.84], i * 3);
    }
    this.dustGroup = new T.Group(); this.scene.add(this.dustGroup);
    const pts = new T.BufferGeometry();
    this.ptsPos = new Float32Array(N * 3);
    pts.setAttribute("position", new T.BufferAttribute(this.ptsPos, 3));
    pts.setAttribute("color", new T.BufferAttribute(cols, 3));
    const dot = tex(64, 64, (g, w) => {
      const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.3, "rgba(255,255,255,.45)"); gr.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = gr; g.fillRect(0, 0, w, w);
    });
    this.points = new T.Points(pts, new T.PointsMaterial({ size: (this.mobile ? 2.2 : 2.6) * Math.min(window.devicePixelRatio || 1, 2), map: dot, vertexColors: true, transparent: true, depthWrite: false, blending: T.AdditiveBlending, sizeAttenuation: false }));
    this.dustGroup.add(this.points);
    const lg = new T.BufferGeometry();
    this.linePos = new Float32Array(N * 6);
    const lcol = new Float32Array(N * 6);
    for (let i = 0; i < N; i++) lcol.set([cols[i * 3], cols[i * 3 + 1], cols[i * 3 + 2], 0, 0, 0], i * 6);
    lg.setAttribute("position", new T.BufferAttribute(this.linePos, 3));
    lg.setAttribute("color", new T.BufferAttribute(lcol, 3));
    this.lines = new T.LineSegments(lg, new T.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending }));
    this.dustGroup.add(this.lines);

    this.current = null;
    this.resize(window.innerWidth, window.innerHeight);
  }

  TimeScene.prototype._spawn = function (i, anywhere) {
    const a = Math.random() * TAU, r = 3 + Math.pow(Math.random(), 0.6) * 15;
    this.dust[i * 3] = Math.cos(a) * r;
    this.dust[i * 3 + 1] = Math.sin(a) * r;
    this.dust[i * 3 + 2] = anywhere ? -Math.random() * 520 : -520 + Math.random() * 30;
  };

  // ---------- era clocks ----------
  TimeScene.prototype._makeMarker = function (key) {
    const cfg = MARKERS[key] || MARKERS.notfound;
    const label = this.labels[key] || "????";
    const g = new T.Group();
    const metal = new T.MeshStandardMaterial({ color: cfg.metal, metalness: 0.55, roughness: 0.32, emissive: cfg.metal, emissiveIntensity: 0.08 });

    const glow = new T.Sprite(new T.SpriteMaterial({ map: glowTexture(cfg.tint), transparent: true, depthWrite: false, blending: T.AdditiveBlending }));
    glow.scale.setScalar(26); g.add(glow);

    const body = new T.Group(); g.add(body);
    const face = new T.Mesh(new T.CircleGeometry(4.3, 72), new T.MeshStandardMaterial({ map: faceTexture(label, cfg, this.S), roughness: 0.5, metalness: 0.1 }));
    body.add(face);
    const rim = new T.Mesh(new T.TorusGeometry(4.45, 0.22, 16, 96), metal); body.add(rim);
    const dialMap = this.dialCache[cfg.metal] || (this.dialCache[cfg.metal] = dialTexture(0, cfg.metal, this.S));
    const dial = new T.Mesh(new T.PlaneGeometry(12.6, 12.6), new T.MeshBasicMaterial({ map: dialMap, transparent: true, opacity: 0.85, depthWrite: false }));
    dial.position.z = -0.05; body.add(dial);
    const outer = new T.Mesh(new T.TorusGeometry(6.3, 0.09, 12, 120), metal); body.add(outer);

    // hands pivot at the centre
    const mkHand = (w, len, z) => {
      const pivot = new T.Group(); pivot.position.z = z;
      const h = new T.Mesh(new T.BoxGeometry(w, len, 0.08), metal); h.position.y = len / 2 - 0.3;
      pivot.add(h); body.add(pivot); return pivot;
    };
    const hour = mkHand(0.28, 2.4, 0.12), minute = mkHand(0.16, 3.5, 0.2);
    const cap = new T.Mesh(new T.SphereGeometry(0.32, 20, 14), metal); cap.position.z = 0.25; body.add(cap);

    // armillary rings orbiting the clock
    const arms = [0.9, -0.6].map((tilt, i) => {
      const pivot = new T.Group(); pivot.rotation.x = tilt; pivot.rotation.y = i ? 0.8 : -0.4;
      const ring = new T.Mesh(new T.TorusGeometry(7.4 + i * 0.7, 0.06, 8, 140), metal);
      pivot.add(ring); g.add(pivot); return pivot;
    });

    g.rotation.set(0.12, -0.38, 0);
    g.userData = { hour, minute, dial, arms, spin: 0 };
    return g;
  };

  TimeScene.prototype._marker = function (key) {
    if (!this.cache[key]) this.cache[key] = this._makeMarker(key);
    return this.cache[key];
  };

  TimeScene.prototype._restPos = function () {
    const z = -34;
    const vh = 2 * Math.tan((this.baseFov * Math.PI) / 360) * Math.abs(z);
    const vw = vh * this.camera.aspect;
    if (this.camera.aspect > 1.15) return new T.Vector3(vw * 0.33, vh * 0.02, z);
    return new T.Vector3(vw * 0.4, vh * 0.34, z);
