<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Georges Matta — Portfolio</title>
<meta name="description" content="Georges Matta, senior developer and project manager: Go and Python backends, blockchain, and intelligence & data tooling. BSc Computer Science.">
<meta name="theme-color" content="#070b1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Georges Matta — 3D portfolio
   Palette: deep midnight blue, starlight, and the desk lamp's amber (brass) carried
   into the screen. Type: Unbounded (display) + Instrument Sans (text).
   ========================================================================== */
:root {
  --void: #070b1a;
  --deep: #0d1330;
  --glass: rgba(14, 19, 46, 0.62);
  --glass-strong: rgba(10, 14, 34, 0.86);
  --line: rgba(234, 230, 218, 0.1);
  --line-strong: rgba(234, 230, 218, 0.2);
  --star: #eae6da;
  --dust: #a3a8bf;
  --amber: #f2a541;
  --amber-soft: #f6c98a;
  --signal: #6fd3e0;
  --plum: #a594e0;
  --ink: #1a0f06;
  --display: "Unbounded", "Instrument Sans", system-ui, sans-serif;
  --text: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 9px;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* The site is a night scene in both viewer themes; tokens stay dark on purpose. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --void: #070b1a; } }
:root[data-theme="dark"] { --void: #070b1a; }

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--void); color: var(--star);
  font: 400 17px/1.6 var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; display: block; }
a { color: var(--signal); text-underline-offset: 3px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--dust); }
.ico { width: 18px; height: 18px; flex: none; }

/* ---------- stage ---------- */
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
.no-webgl #scene { display: none; }
.no-webgl { background: radial-gradient(1200px 700px at 80% 30%, #2a1a4a, transparent 60%), radial-gradient(900px 600px at 10% 80%, #14204a, transparent 60%), var(--void); }
#veil { position: fixed; inset: 0; background: var(--void); opacity: 0; pointer-events: none; transition: opacity .45s ease; z-index: 30; }

#loader {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  background: var(--void); transition: opacity .6s ease;
}
#loader.done { opacity: 0; pointer-events: none; }
#loader p { font-family: var(--display); font-size: 15px; letter-spacing: .02em; color: var(--dust); margin: 0; }
#loader .dot { display: inline-block; width: 8px; height: 8px; margin-right: 10px; border-radius: 50%; background: var(--amber); animation: blink 1s ease-in-out infinite; vertical-align: middle; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- intro overlay ---------- */
.intro {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 0 clamp(20px, 5vw, 64px) calc(clamp(24px, 6vh, 64px) + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
  opacity: 0; transform: translateY(16px);
  transition: opacity .8s ease .9s, transform .8s ease .9s;
}
.intro-ready .intro { opacity: 1; transform: none; }
.leaving-desk .intro { opacity: 0; transform: translateY(12px); transition: opacity .35s ease, transform .35s ease; }
.intro-card { max-width: 440px; pointer-events: auto; }
.intro-name { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 4.6vw, 44px); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 6px; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
.intro-role { margin: 0 0 22px; color: var(--amber-soft); font-size: 17px; text-shadow: 0 1px 12px rgba(0,0,0,.7); }
.intro .actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.intro .hint { margin: 14px 0 0; font-size: 14px; color: var(--dust); }
.leaving-desk .intro-card { pointer-events: none; }

/* ---------- desk controls: scene (time + weather) and hourglass ---------- */
.scene-ctl { position: fixed; z-index: 12; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; display: flex; gap: 8px; align-items: flex-start; justify-content: flex-end; opacity: 0; pointer-events: none; transform: translateY(-8px); transition: opacity .6s ease .9s, transform .6s ease .9s; }
.intro-ready .scene-ctl { opacity: 1; pointer-events: auto; transform: none; }
.leaving-desk .scene-ctl { opacity: 0; pointer-events: none; transition-delay: 0s; transition-duration: .25s; }
.no-webgl .scene-ctl { display: none; }
.scene-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: rgba(10,14,34,.62); color: var(--star); font-weight: 500; font-size: 15px; cursor: pointer; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }
.scene-btn:hover { border-color: rgba(234,230,218,.4); background: rgba(10,14,34,.78); }
.scene-btn[aria-expanded="true"] { border-color: var(--amber); }
.scene-btn .ico { width: 18px; height: 18px; color: var(--amber); }
.scene-pop { position: absolute; top: calc(100% + 10px); right: 0; width: min(330px, calc(100vw - 28px)); padding: 16px; border-radius: 18px; background: var(--glass-strong); border: 1px solid var(--line-strong); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 24px 60px -20px rgba(0,0,0,.7); }
.scene-pop[hidden] { display: none; }
.sp-h { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--dust); }
.sp-h:not(:first-child) { margin-top: 14px; }
.sp-row { display: flex; flex-wrap: wrap; gap: 6px; }
.sp-note { margin: 14px 0 0; font-size: 14px; line-height: 1.45; color: var(--dust); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 9px;
  min-height: 46px; padding: 0 20px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: rgba(234,230,218,.06);
  color: var(--star); text-decoration: none; font-weight: 500; font-size: 16px; cursor: pointer;
  transition: background .2s, border-color .2s, transform .15s;
}
.btn:hover { background: rgba(234,230,218,.12); border-color: rgba(234,230,218,.35); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--ink); font-weight: 600; box-shadow: 0 8px 30px -10px rgba(242,165,65,.7); }
.btn.primary:hover { background: #f7b65e; }
.btn.ghost { background: transparent; }
.link-btn { background: none; border: 0; padding: 6px 2px; color: var(--dust); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; font-size: 15px; }
.link-btn:hover { color: var(--star); }

/* ---------- browser ---------- */
.browser {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  opacity: 0; transition: opacity .5s ease;
}
.browser[hidden] { display: none; }
.in-browser .browser { opacity: 1; }
.chrome {
  flex: none; position: relative;
  padding-top: env(safe-area-inset-top, 0px);
  background: linear-gradient(to bottom, rgba(7,11,26,.92), rgba(7,11,26,.78));
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  border-bottom: 1px solid var(--line);
  transform: translateY(-100%); transition: transform .6s cubic-bezier(.2,.8,.2,1) .1s;
}
.in-browser .chrome { transform: none; }
.tabbar { display: flex; align-items: flex-end; gap: 14px; padding: 8px 12px 0; }
.lights { display: flex; gap: 8px; align-items: center; padding: 0 4px 12px; flex: none; }
.light { width: 13px; height: 13px; border-radius: 50%; border: 0; padding: 0; display: block; }
.light.red { background: #ff6b5a; cursor: pointer; position: relative; }
.light.red::after { content: "×"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; line-height: 1; color: #5a140c; opacity: 0; font-weight: 700; }
.light.red:hover::after, .light.red:focus-visible::after { opacity: 1; }
.light.yellow { background: #f2c14e; } .light.green { background: #57c26a; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 8px; flex: none;
  padding: 9px 16px 11px; min-height: 42px;
  border-radius: 12px 12px 0 0; color: var(--dust); text-decoration: none; font-size: 15px; font-weight: 500;
  position: relative; transition: color .2s, background .2s;
}
.tab:hover { color: var(--star); background: rgba(234,230,218,.05); }
.tab[aria-selected="true"] { color: var(--star); background: rgba(234,230,218,.1); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 2px; background: var(--amber); }
.fav { font-size: 15px; line-height: 1; }

.toolbar { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-top: 1px solid var(--line); }
.tool {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-width: 40px; height: 40px; padding: 0 10px; border-radius: 10px;
  background: none; border: 0; color: var(--star); cursor: pointer;
}
.tool:hover:not(:disabled) { background: rgba(234,230,218,.08); }
.tool:disabled { opacity: .3; cursor: default; }
.tool.spin .ico { animation: spin .6s ease; }
@keyframes spin { to { transform: rotate(360deg); } }
.desk-btn span { font-size: 14px; font-weight: 500; }
.address {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 14px; margin: 0 6px; border-radius: 999px;
  background: rgba(234,230,218,.07); border: 1px solid transparent; transition: border-color .2s, background .2s;
}
.address:focus-within { border-color: var(--amber); background: rgba(234,230,218,.1); }
.address .lock { width: 14px; height: 14px; color: var(--signal); }
.address input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 15px; color: var(--star); }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--amber), var(--signal)); transform: scaleX(0); transform-origin: left; }

.viewport {
  flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; outline: none;
  -webkit-overflow-scrolling: touch;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.page {
  width: min(100% - clamp(32px, 8vw, 160px), 880px);
  margin: 0 0 0 clamp(16px, 7vw, 120px);
  padding: clamp(28px, 6vh, 64px) 0 96px;
  transition: opacity .32s ease, transform .4s ease, filter .32s ease;
}
.page.leaving { opacity: 0; transform: scale(.95) translateY(8px); filter: blur(6px); }
.page.arrived { animation: arrive .75s cubic-bezier(.2,.8,.2,1) both; }
@keyframes arrive { from { opacity: 0; transform: scale(.9) translateY(24px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }

/* ---------- travel by scrolling ---------- */
.viewport { --dive: 0; }
/* The page leans into your push. It grows from the edge you are pushing against (the bottom when going
   deeper, the top when coming back), so the scrollable area never changes while you push. */
.page { scale: calc(1 + var(--dive) * .03); }
.viewport[data-push="down"] .page { transform-origin: 50% 100%; }
.viewport[data-push="up"] .page { transform-origin: 50% 0; }
.browser[data-dive="down"] .page.leaving { transform: scale(1.1) translateY(-14px); }
.browser[data-dive="up"] .page.leaving { transform: scale(.92) translateY(14px); }
.browser[data-dive="down"] .page.arrived { animation-name: arrive-down; }
.browser[data-dive="up"] .page.arrived { animation-name: arrive-up; }
@keyframes arrive-down { from { opacity: 0; transform: scale(.88) translateY(28px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes arrive-up { from { opacity: 0; transform: scale(1.1) translateY(-28px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }

.dive {
  position: absolute; left: 50%; z-index: 7; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 7px; justify-items: center; max-width: calc(100% - 24px);
  padding: 10px 18px 12px; border-radius: 16px; white-space: nowrap; font-size: 14px; color: var(--star);
  background: rgba(10,14,30,.84); border: 1px solid rgba(242,165,65,.35);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .25s ease, transform .25s ease;
}
.dive.on { opacity: 1; transform: translate(-50%, 0); }
.dive.up { bottom: auto; top: calc(var(--chrome-h, 104px) + 14px); transform: translate(-50%, -12px); }
.dive.up.on { transform: translate(-50%, 0); }
.dive-msg b { color: var(--amber-soft); font-weight: 600; }
.dive-bar { width: 190px; max-width: 60vw; height: 4px; border-radius: 4px; background: rgba(234,230,218,.14); overflow: hidden; }
.dive-bar i { display: block; height: 100%; transform: scaleX(0); transform-origin: left; background: linear-gradient(90deg, var(--amber), var(--signal)); }
.dive.hint .dive-bar { display: none; }
.dive.hint .dive-msg::after { content: " \2193"; display: inline-block; color: var(--amber); animation: dive-nudge 1.4s ease-in-out infinite; }
@keyframes dive-nudge { 50% { transform: translateY(3px); } }

.depth { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; margin-right: 2px; border-radius: 999px; background: rgba(234,230,218,.05); color: var(--dust); font-size: 14px; white-space: nowrap; }
.depth[hidden] { display: none; }
.depth small { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; }
.depth-dots { display: inline-flex; align-items: center; gap: 5px; }
.depth-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(234,230,218,.2); transition: background .3s, transform .3s, box-shadow .3s; }
.depth-dots i.seen { background: rgba(242,165,65,.5); }
.depth-dots i.now { background: var(--amber); transform: scale(1.5); box-shadow: 0 0 8px rgba(242,165,65,.8); }
.depth-num b { color: var(--star); font-weight: 600; }
@media (max-width: 980px) { .depth small, .depth-dots { display: none; } }
@media (max-width: 760px) { .depth { padding: 0 10px; gap: 0; } }

/* ---------- type ---------- */
.display { font-family: var(--display); font-weight: 600; font-size: clamp(38px, 6.2vw, 68px); line-height: 1.02; letter-spacing: -0.03em; margin: 0 0 14px; }
.page h2 { font-family: var(--display); font-weight: 500; font-size: 22px; line-height: 1.25; letter-spacing: -0.01em; margin: 0 0 12px; }
.page h3 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
.page p { margin: 0 0 14px; max-width: 64ch; }
.lede { font-size: clamp(18px, 2.1vw, 21px); line-height: 1.5; color: rgba(234,230,218,.86); }
.kicker { color: var(--amber-soft); font-weight: 500; margin: 0 0 6px !important; }
.subtitle { font-size: 19px; color: rgba(234,230,218,.86); }
.big { font-size: clamp(26px, 3.4vw, 34px) !important; }
.page-head { margin-bottom: 28px; }
.page-head .actions { margin-top: 18px; }

/* ---------- panels ---------- */
.panel {
  background: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: clamp(20px, 3vw, 30px);
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  margin-bottom: 18px;
}
.panel.slim { padding-block: 18px; }
.panel > :last-child { margin-bottom: 0; }
.points { margin: 8px 0 0; padding-left: 1.2em; }
.points li { margin: 0 0 6px; max-width: 64ch; }
.points li::marker { color: var(--amber); }
.tags { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tags li, .tag { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: rgba(111,211,224,.1); color: var(--signal); border: 1px solid rgba(111,211,224,.18); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- home ---------- */
.hero { margin-bottom: 34px; }
.avatar-wrap { position: relative; width: 132px; height: 132px; margin-bottom: 26px; }
.avatar { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid rgba(242,165,65,.6); }
.orbit { position: absolute; inset: -14px; border-radius: 50%; border: 1px dashed rgba(234,230,218,.25); animation: orbit 14s linear infinite; }
.orbit i { position: absolute; top: 50%; left: -5px; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 14px var(--amber); }
@keyframes orbit { to { transform: rotate(360deg); } }
.role { font-size: clamp(19px, 2.4vw, 23px); color: var(--amber); font-weight: 500; margin: 0 0 18px !important; }
.hero .actions { margin: 26px 0 30px; }
.facts { display: flex; flex-wrap: wrap; gap: 14px 40px; margin: 0; }
.facts dt { font-size: 14px; color: var(--dust); }
.facts dd { margin: 0; font-weight: 500; }
.hero .display, .hero .role, .hero .lede, .page-head { text-shadow: 0 1px 14px rgba(7,11,26,.85); }
.focus { display: grid; gap: 22px; }
.focus article { padding-top: 18px; border-top: 1px solid var(--line); }
.focus article:first-child { padding-top: 4px; border-top: 0; }
.focus p { margin: 0; color: rgba(234,230,218,.82); }

/* ---------- education ---------- */
.tabs-inline { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 18px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line); }
.tabs-inline button { border: 0; background: none; padding: 9px 18px; min-height: 42px; border-radius: 999px; cursor: pointer; color: var(--dust); font-weight: 500; }
.tabs-inline button[aria-selected="true"] { background: var(--star); color: var(--void); }
.cert-list { list-style: none; margin: 0; padding: 0; }
.cert-list li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); }
.cert-list li:first-child { border-top: 0; padding-top: 0; }
.cert-list h3 { margin: 0 0 2px; }
.cert-list p { margin: 0 !important; font-size: 15px; }
.chip-btn { display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 7px 12px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: none; cursor: pointer; font-size: 14px; color: var(--dust); }
.chip-btn:hover { color: var(--star); border-color: var(--amber); }
.chip-btn .ico { width: 15px; height: 15px; }

/* ---------- experience timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 30px; width: 1px; background: linear-gradient(var(--amber), rgba(111,211,224,.5), transparent); }
.timeline > li { position: relative; margin-bottom: 8px; }
.timeline > li::before { content: ""; position: absolute; left: -27px; top: 7px; width: 13px; height: 13px; border-radius: 50%; background: var(--void); border: 2px solid var(--amber); transition: background .35s, box-shadow .35s, transform .35s; }
.timeline > li.now::before { background: var(--amber); box-shadow: 0 0 16px rgba(242,165,65,.7); transform: scale(1.2); }
.timeline > li .when { transition: color .35s; }
.timeline > li.now .when { color: var(--amber); }
.when { font-weight: 600; color: var(--amber-soft); margin: 0 0 8px !important; }

/* ---------- projects ---------- */
.filters { display: grid; gap: 16px; position: sticky; top: 12px; z-index: 2; background: var(--glass-strong); }
.search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border-radius: var(--r-md); background: rgba(234,230,218,.06); border: 1px solid var(--line); }
.search:focus-within { border-color: var(--amber); }
.search input { flex: 1; border: 0; outline: 0; background: none; min-width: 0; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-strong); background: none; cursor: pointer; font-size: 14px; color: rgba(234,230,218,.86); transition: background .15s, border-color .15s, color .15s; }
.chip .n { font-size: 12px; color: var(--dust); }
.chips .chip.rare:not(.keep) { display: none; }
.chips.show-all .chip.rare { display: inline-flex; }
.chip:hover { border-color: rgba(234,230,218,.4); }
.chip[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--ink); }
.chip[aria-pressed="true"] .n { color: rgba(26,15,6,.7); }
.filter-foot { display: flex; justify-content: space-between; align-items: center; }
.filter-foot p { margin: 0 !important; font-weight: 600; }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 18px; margin-top: 18px; }
.proj { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: flex; flex-direction: column; }
.cover {

  // ---------- sky for every time of day and weather ----------

    const bottom = new T.Mesh(new T.CircleGeometry(0.043, 32), mugMat); bottom.rotation.x = -Math.PI / 2; bottom.position.y = 0.002; mug.add(bottom);

    // --- plant
    const plant = new T.Group(); plant.position.set(0.92, DESK_Y, -0.38); s.add(plant);

    const soil = new T.Mesh(new T.CircleGeometry(0.07, 24), new T.MeshStandardMaterial({ color: "#2a1d14" })); soil.rotation.x = -Math.PI / 2; soil.position.y = 0.125; plant.add(soil);
    const leafMat = new T.MeshStandardMaterial({ color: "#3f7a4a", roughness: 0.55, side: T.DoubleSide });

    // --- books: management, blockchain and AI, stacked bottom to top
    const books = new T.Group(); books.position.set(-0.52, DESK_Y, 0.25); books.rotation.y = 0.35; s.add(books); this.booksGroup = books;

    }, 0);

    // --- notebook + pen
    const note = new T.Mesh(new T.BoxGeometry(0.15, 0.008, 0.21), new T.MeshStandardMaterial({ color: "#1f3a3d", roughness: 0.85 }));
    note.position.set(0.5, DESK_Y + 0.004, 0.4); note.rotation.y = -0.25; note.castShadow = true; note.receiveShadow = true; s.add(note);
    const pen = new T.Mesh(new T.CylinderGeometry(0.004, 0.004, 0.14, 10), new T.MeshStandardMaterial({ color: "#f2a541", metalness: 0.4, roughness: 0.3 }));
    pen.rotation.z = Math.PI / 2; pen.rotation.y = 0.6; pen.position.set(0.51, DESK_Y + 0.013, 0.4); pen.castShadow = true; s.add(pen);

    const cvHit = new T.Mesh(new T.BoxGeometry(0.17, 0.03, 0.23), new T.MeshBasicMaterial({ visible: false }));
    cvHit.position.y = 0.012; cvHit.userData.prop = "cv"; cvGroup.add(cvHit);
    this.cvGroup = cvGroup; this.cvHit = cvHit; this.cvSheet = sheet;
    this.cvRest = { x: 0.25, y: DESK_Y + 0.001, z: 0.45, ry: 0.12 };
    this.cvAnim = null; this.cvBusy = false;

    // --- Dynamic Eye Technology token (the company's eye logo) on a little stand: tap it to see the project
    const coinBase = new T.Group(); coinBase.position.set(-0.4, DESK_Y, -0.26); s.add(coinBase);
    const brass2 = new T.MeshStandardMaterial({ color: "#7d6a92", metalness: 0.8, roughness: 0.3 });
    const cBase = new T.Mesh(new T.CylinderGeometry(0.03, 0.034, 0.008, 32), brass2); cBase.position.y = 0.004; cBase.castShadow = true; coinBase.add(cBase);
    const cPost = new T.Mesh(new T.CylinderGeometry(0.0025, 0.0025, 0.07, 8), brass2); cPost.position.y = 0.043; coinBase.add(cPost);
    const coinSpin = new T.Group(); coinSpin.position.y = 0.106; coinBase.add(coinSpin);
    const R = 0.046, DEPTH = 0.008;
    // round body with a purple metal rim
    const rimMat = new T.MeshStandardMaterial({ color: "#5d2a7f", metalness: 0.75, roughness: 0.3, emissive: "#6a1b8f", emissiveIntensity: 0.25 });
    const coinBody = new T.Mesh(new T.CylinderGeometry(R, R, DEPTH, 48), rimMat);
    coinBody.rotation.x = Math.PI / 2; coinBody.castShadow = true; coinSpin.add(coinBody);
    // the logo on both faces (a light disc, so the purple stays readable)

    logoTex.encoding = T.sRGBEncoding; logoTex.anisotropy = 8;

    const faceGeo = new T.CircleGeometry(R * 0.93, 64);
    [1, -1].forEach(side => {

    // soft purple halo behind the token
    const haloTex = canvasTex(128, 128, (g, w) => {
      const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      gr.addColorStop(0, "rgba(190,90,230,.5)"); gr.addColorStop(0.45, "rgba(150,60,200,.15)"); gr.addColorStop(1, "rgba(150,60,200,0)");
      g.fillStyle = gr; g.fillRect(0, 0, w, w);
    });
    const halo = new T.Sprite(new T.SpriteMaterial({ map: haloTex, transparent: true, depthWrite: false, blending: T.AdditiveBlending }));
    halo.scale.setScalar(0.2); halo.position.z = -0.02; coinSpin.add(halo);
    const coinHit = new T.Mesh(new T.CylinderGeometry(0.065, 0.065, 0.14, 12), new T.MeshBasicMaterial({ visible: false }));
    coinHit.position.y = 0.09; coinHit.userData.prop = "coin"; coinBase.add(coinHit);
    this.coin = { group: coinBase, spin: coinSpin, boost: 0 }; this.coinHit = coinHit;

    // --- hourglass: the desk's hint at what is inside the laptop
    const hg = new T.Group(); hg.position.set(0.5, DESK_Y, -0.3); s.add(hg); this.hgGroup = hg;
    const brass = new T.MeshStandardMaterial({ color: "#b8945a", metalness: 0.7, roughness: 0.35 });
    const spin = new T.Group(); spin.position.y = 0.088; hg.add(spin);

      const a = (i / 3) * TAU + 0.4;
      const post = new T.Mesh(new T.CylinderGeometry(0.0035, 0.0035, 0.16, 8), brass);
      post.position.set(Math.cos(a) * 0.043, 0, Math.sin(a) * 0.043); post.castShadow = true; spin.add(post);
    }
    const prof = [[0.001, -0.07], [0.028, -0.066], [0.036, -0.045], [0.03, -0.02], [0.01, -0.006], [0.004, 0], [0.01, 0.006], [0.03, 0.02], [0.036, 0.045], [0.028, 0.066], [0.001, 0.07]].map(([r, y]) => new T.Vector2(r, y));
    spin.add(new T.Mesh(new T.LatheGeometry(prof, 32), new T.MeshStandardMaterial({ color: "#cfe6ff", transparent: true, opacity: 0.2, roughness: 0.05, metalness: 0.1, side: T.DoubleSide, depthWrite: false })));
    const sandMat = new T.MeshStandardMaterial({ color: "#f2a541", roughness: 0.8, emissive: "#f2a541", emissiveIntensity: 0.08 });
    const topSand = new T.Mesh(new T.CylinderGeometry(0.03, 0.005, 1, 20), sandMat); spin.add(topSand);
    const botSand = new T.Mesh(new T.ConeGeometry(0.033, 1, 20), sandMat); spin.add(botSand);
    const stream = new T.Mesh(new T.CylinderGeometry(0.0012, 0.0012, 0.07, 6), sandMat); stream.position.y = -0.03; spin.add(stream);
    // a generous invisible target so a fingertip can hit it, and a soft glow that invites a flip
    const hgHit = new T.Mesh(new T.CylinderGeometry(0.085, 0.085, 0.24, 12), new T.MeshBasicMaterial({ visible: false }));
    hgHit.position.y = 0.11; hgHit.userData.prop = "hourglass"; hg.add(hgHit); this.hgHit = hgHit;
    const hgHint = new T.Sprite(new T.SpriteMaterial({ map: softDot("242,165,65"), transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending }));
    hgHint.scale.setScalar(0.3); hgHint.position.y = 0.09; hg.add(hgHint);
    this.hourglass = { spin, topSand, botSand, stream, hint: hgHint, n: 0, k: 0, flipT: null, RUN: 45 };

    // raycast targets
    this.raycaster = new T.Raycaster();
    this.hitTargets = [this.screen, bezel, lid];

    // camera framing
    this.introLook = new T.Vector3(0.02, DESK_Y + 0.17, -0.04);
    this.introPosBase = new T.Vector3(0.42, DESK_Y + 0.58, 1.38);
    this.introPos = this.introPosBase.clone();

    this._initEnv();
  };

  // ---------- the laptop screen (canvas) ----------
  DeskScene.prototype._buildScreen = function () {
    const n = 180;
    this.screenStars = Array.from({ length: n }, () => ({ x: Math.random(), y: 0.14 + Math.random() * 0.86, r: Math.random() * 1.6 + 0.4, p: Math.random() * TAU, s: 0.5 + Math.random() * 2 }));
    this._drawScreen(0);
  };

  DeskScene.prototype._drawScreen = function (t) {
    const g = this.screenCanvas.getContext("2d");
    const w = 1280, h = 800;
    const p = this.screenPower;
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    if (p <= 0.001) { this.screenTex.needsUpdate = true; return; }
    g.globalAlpha = clamp(p, 0, 1);

    const bg = g.createRadialGradient(w * 0.72, h * 0.45, 20, w * 0.6, h * 0.5, w * 0.9);
    bg.addColorStop(0, "#2a1a4a"); bg.addColorStop(0.5, "#101634"); bg.addColorStop(1, "#070b1a");
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    this.screenStars.forEach(st => {
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * st.s + st.p));
      g.fillStyle = `rgba(234,230,218,${a})`;
      g.beginPath(); g.arc(st.x * w, st.y * h, st.r, 0, TAU); g.fill();
    });
    const L = this.loc, rtl = !!L.rtl, fx = x => (rtl ? w - x : x);      // fx mirrors a position for right-to-left
    const FONT = "'Instrument Sans', system-ui, sans-serif";
    // delivery roadmap dial: a ring that fills up step by step (spec, build, test, ship)
    const px = w * (rtl ? 0.23 : 0.77), py = h * 0.58, pr = 150;
    const D = window.CONTENT.delivery, tot = D.phases.reduce((a, p) => a + p.blocks, 0);
    const phaseOf = i => { let k = 0; for (const p of D.phases) { k += p.blocks; if (i < k) return p; } return D.phases[D.phases.length - 1]; };
    const nOn = this.reduced ? tot - 4 : Math.min(tot, Math.floor(t % (tot + 3)) + 1), done = nOn >= tot;
    const halo = g.createRadialGradient(px, py, pr * 0.7, px, py, pr * 2.1);
    halo.addColorStop(0, "rgba(242,165,65,.28)"); halo.addColorStop(1, "rgba(242,165,65,0)");
    g.fillStyle = halo; g.fillRect(0, 0, w, h);
    g.lineWidth = 2;
    for (let i = 1; i <= 3; i++) {
      g.strokeStyle = `rgba(201,162,94,${0.34 - i * 0.07})`;
      g.setLineDash([7, 11]); g.lineDashOffset = t * 14 * (i % 2 ? 1 : -1);
      g.beginPath(); g.arc(px, py, pr * (1.15 + i * 0.28), 0, TAU); g.stroke();
    }
    g.setLineDash([]);
    const face = g.createRadialGradient(px - 40, py - 50, 10, px, py, pr);
    face.addColorStop(0, "#242d55"); face.addColorStop(1, "#090d1d");
    g.fillStyle = face; g.beginPath(); g.arc(px, py, pr, 0, TAU); g.fill();
    g.strokeStyle = "#c9a25e"; g.lineWidth = 8; g.beginPath(); g.arc(px, py, pr, 0, TAU); g.stroke();
    // progress ring, one segment per step; the step in progress pulses
    const seg = (i, r, wd, col, alpha) => {
      const a0 = (i / tot) * TAU - Math.PI / 2 + 0.05, a1 = ((i + 1) / tot) * TAU - Math.PI / 2 - 0.05;
      g.globalAlpha = alpha; g.lineWidth = wd; g.strokeStyle = col; g.beginPath(); g.arc(px, py, r, a0, a1); g.stroke(); g.globalAlpha = 1;
    };
    for (let i = 0; i < tot; i++) seg(i, pr * 0.84, 12, i < nOn ? phaseOf(i).color : "rgba(201,162,94,.16)", 1);
    if (!done) seg(nOn - 1, pr * 0.84, 20, phaseOf(nOn - 1).color, 0.25 + 0.2 * Math.sin(t * 6));
    // the face: current phase and step count
    const ph = phaseOf(Math.max(0, Math.min(tot - 1, nOn - 1)));
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "rgba(234,230,218,.6)"; g.font = `500 14px ${FONT}`; g.fillText(D.title.toUpperCase(), px, py - 42);
    g.fillStyle = done ? "#f6c98a" : ph.color; g.font = `700 ${done ? 24 : 38}px 'Unbounded', ${FONT}`;
    g.fillText(done ? "DELIVERED" : ph.name.toUpperCase(), px, py - 2);
    g.fillStyle = "rgba(234,230,218,.9)"; g.font = `600 24px ${FONT}`;
    g.fillText(`${String(nOn).padStart(2, "0")} / ${String(tot).padStart(2, "0")}`, px, py + 40);
    g.textAlign = "left"; g.textBaseline = "alphabetic";

    // browser chrome
    g.direction = rtl ? "rtl" : "ltr";
    g.fillStyle = "rgba(10,14,34,.92)"; g.fillRect(0, 0, w, 104);
    ["#ff6b5a", "#f2c14e", "#57c26a"].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(fx(34 + i * 30), 30, 9, 0, TAU); g.fill(); });
    g.font = `500 20px ${FONT}`; g.textAlign = "center";
    let tx = fx(140);
    L.tabs.forEach((name, i) => {
      const tw = g.measureText(name).width + 44, x0 = rtl ? tx - tw : tx;
      if (i === 0) { g.fillStyle = "rgba(234,230,218,.12)"; g.beginPath(); (g.roundRect ? g.roundRect(x0, 10, tw, 40, 10) : g.rect(x0, 10, tw, 40)); g.fill(); }
      g.fillStyle = i === 0 ? "#eae6da" : "rgba(234,230,218,.55)";
      g.fillText(name, x0 + tw / 2, 37);
      tx += rtl ? -(tw + 6) : tw + 6;
    });
    g.fillStyle = "rgba(234,230,218,.08)";
    g.beginPath(); (g.roundRect ? g.roundRect(rtl ? 40 : 140, 60, w - 180, 34, 17) : g.rect(rtl ? 40 : 140, 60, w - 180, 34)); g.fill();
    g.fillStyle = "rgba(234,230,218,.7)"; g.font = `400 18px ${FONT}`; g.direction = "ltr"; g.textAlign = rtl ? "right" : "left";
    g.fillText(L.url, rtl ? w - 162 : 162, 83);

    // hero text
    g.direction = rtl ? "rtl" : "ltr"; g.textAlign = rtl ? "right" : "left";
    g.fillStyle = "#eae6da";
    g.font = `600 76px 'Unbounded', ${FONT}`;
    g.fillText(this.profileName, fx(86), 330);
    g.fillStyle = "#f2a541";
    g.font = `500 30px ${FONT}`;
    g.fillText(L.role, fx(90), 385);
    g.fillStyle = "rgba(234,230,218,.7)";
    g.font = `400 24px ${FONT}`;
    L.lines.forEach((l, i) => g.fillText(l, fx(90), 440 + i * 36));

    // call to action pulse
    const pulse = 0.5 + 0.5 * Math.sin(t * 3);
    const hover = this.hoverScreen ? 1 : 0, bx = rtl ? w - 340 : 90;
    g.fillStyle = `rgba(242,165,65,${0.85 + 0.15 * hover})`;
    g.beginPath(); (g.roundRect ? g.roundRect(bx, 560, 250, 64, 32) : g.rect(bx, 560, 250, 64)); g.fill();
    g.strokeStyle = `rgba(242,165,65,${0.4 * (1 - pulse)})`; g.lineWidth = 3 + pulse * 10;
    g.beginPath(); (g.roundRect ? g.roundRect(bx - pulse * 8, 560 - pulse * 8, 250 + pulse * 16, 64 + pulse * 16, 40) : g.rect(bx, 560, 250, 64)); g.stroke();
    g.fillStyle = "#1a0f06"; g.font = `600 24px ${FONT}`; g.textAlign = "center";
    g.fillText(L.cta, bx + 125, 600);
    g.direction = "ltr"; g.textAlign = "left";

    // boot overlay
    if (p < 1) {
      g.globalAlpha = 1 - p;
      g.fillStyle = "#070b1a"; g.fillRect(0, 0, w, h);
      g.fillStyle = "#f2a541"; g.font = "600 56px 'Unbounded', system-ui, sans-serif";
      g.textAlign = "center"; g.fillText("DevLeb", w / 2, h / 2 + 18); g.textAlign = "left";
    }
    g.globalAlpha = 1;
    // subtle scanline glare
    const glare = g.createLinearGradient(0, 0, w, h);
    glare.addColorStop(0, "rgba(255,255,255,.06)"); glare.addColorStop(0.4, "rgba(255,255,255,0)");
    g.fillStyle = glare; g.fillRect(0, 0, w, h);
    this.screenTex.needsUpdate = true;
  };

  // Which prop (if any) is under the pointer: "hourglass", "cv", "coin" or null.
  DeskScene.prototype.pickProp = function (ndcX, ndcY) {
    this.raycaster.setFromCamera({ x: ndcX, y: ndcY }, this.camera);
    const hits = this.raycaster.intersectObjects([this.hgHit, this.cvHit, this.coinHit], false);
    return hits.length ? hits[0].object.userData.prop : null;
  };
  DeskScene.prototype.setHoverProp = function (prop) { this.hoverProp = prop; this.hgHover = prop === "hourglass"; };
  DeskScene.prototype.spinCoin = function () { this.coin.boost = 12; };
  DeskScene.prototype._updateProps = function (dt) {
    const c = this.coin;
    if (this.reduced) c.spin.rotation.y = 0.5;
    else { c.spin.rotation.y += dt * (0.9 + (this.hoverProp === "coin" ? 2.2 : 0) + c.boost); c.boost = Math.max(0, c.boost - dt * 6); }
    if (this.cvAnim) return this._stepCv(dt);
    const target = this.DESK_Y + 0.001 + (this.hoverProp === "cv" && !this.cvBusy ? 0.014 : 0);
    this.cvGroup.position.y += (target - this.cvGroup.position.y) * (this.reduced ? 1 : 1 - Math.exp(-dt * 10));
  };

  /* Tapping the CV: the sheet lifts off the table, flips once and turns to face you, hovers for a moment
     (the returned promise resolves then), and glides into the laptop screen as the camera flies in. */
  const CV_RAISE = 1.0, CV_HOLD = 0.4, CV_SEND = 0.6;
  DeskScene.prototype.raiseCv = function () {
    return new Promise(resolve => {
      this.cvBusy = true;
      if (this.reduced) return resolve();          // no flourish: straight to the laptop
      const mats = [...new Set([].concat(this.cvSheet.material))];
      mats.forEach(m => { m.transparent = true; });
      this.cvAnim = { t: 0, mats, resolve, resolved: false, from: null };
    });
  };
  // the paper goes back on the table (called while the screen is covered)
  DeskScene.prototype.resetCv = function () {
    const r = this.cvRest, g = this.cvGroup;
    this.cvAnim = null; this.cvBusy = false;
    [].concat(this.cvSheet.material).forEach(m => { m.opacity = 1; m.transparent = false; });
    g.visible = true; g.position.set(r.x, r.y, r.z); g.rotation.set(0, r.ry, 0); g.scale.setScalar(1);
  };
  DeskScene.prototype._stepCv = function (dt) {
    const a = this.cvAnim, g = this.cvGroup, r = this.cvRest, Y = this.DESK_Y;
    a.t += dt;
    const UP = { x: 0.36, y: Y + 0.27, z: 0.55, rx: 1.2, ry: 0.07, s: 1.55 };   // hovering, facing the camera
    if (a.t < CV_RAISE + CV_HOLD) {
      const p = easeInOut(clamp(a.t / CV_RAISE, 0, 1)), float = a.t > CV_RAISE ? Math.sin((a.t - CV_RAISE) * 9) * 0.004 : 0;
      g.position.set(r.x + (UP.x - r.x) * p, r.y + (UP.y - r.y) * p + Math.sin(Math.PI * p) * 0.04 + float, r.z + (UP.z - r.z) * p);

  // ---------- time of day + weather ----------
  DeskScene.prototype._envTarget = function (phase, weather) {
    const P = PH[phase], W = WX[weather];
    const mixc = hex => { const c = new T.Color(hex); if (W.tone) c.lerp(new T.Color(W.tone), W.k); return c; };
    const tint = new T.Color(CLOUD_LIGHT[phase]);
    const dark = { sunny: 0, cloudy: 0.15, rainy: 0.6, foggy: 0.2, snowy: 0.1 }[weather];
    tint.lerp(new T.Color(CLOUD_DARK[phase]), dark);

      hemiSky: mixc(P.hemiSky), hemiGnd: mixc(P.hemiGnd), dirCol: mixc(P.dirCol), bounceCol: mixc(P.bounceCol), bg: new T.Color(P.bg),
      cloudTint: tint, fogTint: new T.Color(FOG_TINT[phase]),
      hemi: P.hemi * W.hemi, dir: P.dir * W.dir, bounce: P.bounce * (weather === "sunny" ? 1 : 0.8), lamp: Math.max(P.lamp, W.lampMin),
      rain: weather === "rainy" ? 1 : 0, snow: weather === "snowy" ? 1 : 0, fog: weather === "foggy" ? 1 : 0,
      sparse: weather === "sunny" ? (phase === "night" ? 0.3 : 0.85) : weather === "cloudy" ? 0.5 : 0,
      dense: { sunny: 0, cloudy: 0.65, rainy: 0.95, foggy: 0.3, snowy: 0.85 }[weather],
      glass: weather === "rainy" ? 1 : weather === "foggy" ? 0.35 : 0
    };
  };
  DeskScene.prototype._cloneEnv = function (t) {
    const o = {}; for (const k in t) o[k] = t[k].isColor ? t[k].clone() : t[k]; return o;
  };
  DeskScene.prototype._initEnv = function () {
    this.env = { phase: "night", weather: "sunny" };
    this.env.tgt = this._envTarget("night", "sunny");
    this.env.cur = this._cloneEnv(this.env.tgt);
    this.colOn = new T.Color("#ffd9a0"); this.colOff = new T.Color("#5f564b");

  };
  DeskScene.prototype.getEnvironment = function () { return { phase: this.env.phase, weather: this.env.weather }; };

  DeskScene.prototype.setEnvironment = function (phase, weather, opts) {
    const e = this.env;
    if (!PH[phase] || !WX[weather] || (e.phase === phase && e.weather === weather)) return;
    const instant = !!(opts && opts.instant) || this.reduced;
    e.tgt = this._envTarget(phase, weather);
    if (instant) e.cur = this._cloneEnv(e.tgt);

      s.a.material.map.dispose(); s.a.material.map = tex;
    } else {

  DeskScene.prototype._finishSkyFade = function () {

    s.b.material.map = canvasTex(4, 4, () => {}); s.b.material.opacity = 0; s.b.visible = false;

  // eases the lights toward the current target and applies them
  DeskScene.prototype._stepEnv = function (dt) {
    const e = this.env; if (!e) return;
    const k = this.reduced ? 1 : 1 - Math.exp(-dt * 2.4);

      const a = e.cur[key], b = e.tgt[key];
      if (a.isColor) a.lerp(b, k); else e.cur[key] = a + (b - a) * k;

    const c = e.cur;
    this.hemi.color.copy(c.hemiSky); this.hemi.groundColor.copy(c.hemiGnd); this.hemi.intensity = c.hemi;

  // clouds, fog, rain, snow and the droplets on the glass
  DeskScene.prototype._updateFx = function (dt) {
    const c = this.env.cur, L = this.layers, drift = this.reduced ? 0 : dt;

  DeskScene.prototype.openLid = function () {

  DeskScene.prototype.hitScreen = function (ndcX, ndcY) {

  DeskScene.prototype._screenFrame = function () {
    this.scene.updateMatrixWorld(true);

  // fly into the screen; onProgress(t 0..1)
  DeskScene.prototype.enter = function (onProgress) {
    return new Promise(resolve => {
      this.lidAngle = this.lidTarget = -0.26;
      this.screenPower = 1;

      const startQuat = this.camera.quaternion.clone();
      const mid = startPos.clone().lerp(end.pos, 0.5); mid.y += 0.08; mid.x += 0.12;

  // fly back out to the desk view
  DeskScene.prototype.exit = function (onProgress) {

      this.camera.position.copy(from.pos);
      this.camera.quaternion.copy(from.quat);

    });
  };

  DeskScene.prototype.update = function (dt) {
    this.clock += dt;
    const t = this.clock;

    // lid
    this.lidAngle += (this.lidTarget - this.lidAngle) * (this.reduced ? 1 : 1 - Math.pow(0.02, dt));
    this.hinge.rotation.x = this.lidAngle;
    if (this.powerOnAt !== undefined && t > this.powerOnAt) this.screenPower = Math.min(1, this.screenPower + dt / (this.reduced ? 0.01 : 1.2));
    this.screenLight.intensity = 0.7 * this.screenPower;

    // screen canvas at ~30fps

    // ambient life

      const dp = this.dust.geometry.attributes.position;
      for (let i = 0; i < dp.count; i++) {
        dp.array[i * 3] = this.dustBase[i * 3] + Math.sin(t * 0.3 + i) * 0.02;
        dp.array[i * 3 + 1] = this.dustBase[i * 3 + 1] + Math.sin(t * 0.2 + i * 1.7) * 0.03;
      }
      dp.needsUpdate = true;
      this.steam.forEach(sp => {
        const k = (t * 0.22 + sp.userData.offset) % 1;
        sp.position.y = this.DESK_Y + 0.1 + k * 0.22;
        sp.position.x = 0.55 + Math.sin(k * 6 + sp.userData.offset * 9) * 0.02;
        sp.scale.setScalar(0.04 + k * 0.08);
        sp.material.opacity = Math.sin(k * Math.PI) * 0.12;
      });
    }

    this._updateHourglass(dt);
    this._updateProps(dt);
    this._stepEnv(dt);
    this._updateFx(dt);

    // camera
    if (this.fly) {
      const f = this.fly;
      f.t = Math.min(1, f.t + dt / f.dur);
      const e = easeInOut(f.t);
      const a = f.startPos.clone().lerp(f.mid, e), b = f.mid.clone().lerp(f.end.pos, e);
      this.camera.position.copy(a.lerp(b, e));
      const qe = f.out ? easeOut(f.t) : Math.pow(e, 0.8);
      this.camera.quaternion.copy(f.startQuat).slerp(f.end.quat, qe);
      if (f.onProgress) f.onProgress(f.t);
      if (f.t >= 1) {
        this.fly = null;
        this.mode = f.out ? "intro" : "inside";
        f.resolve();
      }
    } else if (this.mode === "intro") {
      const k = this.reduced ? 0 : 1 - Math.pow(0.05, dt);
      this.pointerSmooth.lerp(this.pointer, k);
      const off = new T.Vector3(this.pointerSmooth.x * 0.16, -this.pointerSmooth.y * 0.08 + Math.sin(t * 0.4) * 0.008, 0);
      this.camera.position.copy(this.introPos).add(off);
      this.camera.lookAt(this.introLook);
    }
  };

  DeskScene.prototype.render = function () {
    this.renderer.render(this.scene, this.camera);
  };

  window.DeskScene = DeskScene;
})();

  <script>
/* ==========================================================================
   Time scene — the backdrop inside the laptop browser.
   A tunnel of clock dials. Each page is a moment in time marked by a brass
   astrolabe clock. Switching tabs travels through the tunnel: twisting one
   way into the past, the other way into the future.
   ========================================================================== */
(function () {
  const T = window.THREE;
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  const ROMAN = ["XII", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI"];

  // clock look per page (label comes from the browser's era for that page)
  const MARKERS = {
    home:       { tint: "#f2a541", metal: "#c9a25e" },
    education:  { tint: "#7cc7b4", metal: "#b7c4bd" },
    experience: { tint: "#e0a36a", metal: "#b87333" },
    projects:   { tint: "#7cc7b4", metal: "#c9a25e" },
    contact:    { tint: "#f6c98a", metal: "#d9c7a0" },
    resume:     { tint: "#f2a541", metal: "#b8945a" },
    blog:       { tint: "#c9a0dc", metal: "#b9a6c9" },
    notfound:   { tint: "#8a90a8", metal: "#6f7382" }
  };

  function tex(w, h, draw) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);

  }

  // a transparent clock-dial band: ticks, numerals, gear teeth
  function dialTexture(variant, color, size = 1024) {
    return tex(size, size, (g, w) => {
      g.scale(w / 1024, w / 1024); w = 1024;
      const c = w / 2, r1 = w * 0.49, r0 = w * 0.37;
      g.strokeStyle = rgba(color, 0.9); g.fillStyle = rgba(color, 0.9);
      g.lineWidth = 4; g.beginPath(); g.arc(c, c, r1, 0, TAU); g.stroke();
      g.lineWidth = 2; g.beginPath(); g.arc(c, c, r0, 0, TAU); g.stroke();
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * TAU, major = i % 5 === 0;
        const len = major ? 34 : 16;
        g.lineWidth = major ? 5 : 2;
        g.beginPath();
        g.moveTo(c + Math.cos(a) * (r1 - 8), c + Math.sin(a) * (r1 - 8));
        g.lineTo(c + Math.cos(a) * (r1 - 8 - len), c + Math.sin(a) * (r1 - 8 - len));
        g.stroke();
      }
      g.textAlign = "center"; g.textBaseline = "middle";
      g.font = `600 ${variant === 0 ? 46 : 34}px Georgia, 'Times New Roman', serif`;
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU - Math.PI / 2;
        const rr = (r0 + r1) / 2 - 20;
        g.save(); g.translate(c + Math.cos(a) * rr, c + Math.sin(a) * rr); g.rotate(a + Math.PI / 2);
        g.fillText(variant === 0 ? ROMAN[i] : variant === 1 ? String(i * 5).padStart(2, "0") : "", 0, 0);
        g.restore();
      }
      if (variant === 2) { // gear teeth
        for (let i = 0; i < 72; i++) {
          g.save(); g.translate(c, c); g.rotate((i / 72) * TAU);
          g.fillRect(-7, -r1 - 2, 14, 18); g.restore();
        }
        g.setLineDash([10, 14]); g.lineWidth = 3; g.beginPath(); g.arc(c, c, r0 + 30, 0, TAU); g.stroke(); g.setLineDash([]);
      }

  }

  function glowTexture(color) {
    return tex(256, 256, (g, w) => {
      const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      gr.addColorStop(0, rgba(color, 0.55)); gr.addColorStop(0.35, rgba(color, 0.16)); gr.addColorStop(1, rgba(color, 0));
      g.fillStyle = gr; g.fillRect(0, 0, w, w);

  function TimeScene(renderer, opts) {
    this.renderer = renderer;
    this.mobile = opts.mobile;
    this.reduced = opts.reducedMotion;
    this.S = this.mobile ? 512 : 1024; // texture size
    this.scene = new T.Scene();
    this.bg = new T.Color("#0a0e1a");
    this.scene.background = this.bg.clone();
    this.scene.fog = new T.Fog(this.bg.clone(), 30, 520);
    this.camera = new T.PerspectiveCamera(60, 1, 0.1, 2000);

    this.speed = 0.3; this.dir = 1;
    this.clock = 0;
    this.pointer = new T.Vector2(); this.pointerSmooth = new T.Vector2();
    this.scroll = 0; this.scrollSmooth = 0;
    this.nudge = 0;
    this.rm = { n: 0, t: 0, total: 0 };   // delivery roadmap progress, shared by every page's dial
    this.cache = {};
    this.labels = opts.labels || {};
    this.warp = null;
    this.tintPast = new T.Color("#e0a060");
    this.tintFuture = new T.Color("#7cc7b4");

    // light at the end of the tunnel
    this.endGlow = new T.Sprite(new T.SpriteMaterial({ map: glowTexture("#ffffff"), color: this.tintRest.clone(), transparent: true, depthWrite: false, blending: T.AdditiveBlending, fog: false }));
    this.endGlow.position.set(0, 0, -900); this.endGlow.scale.setScalar(700);
    this.scene.add(this.endGlow);

  TimeScene.prototype.prewarm = function (keys) {

    { key: "resume", title: "Resume", icon: "📝" },          // 2023
    { key: "projects", title: "Projects", icon: "📚" },      // 2017
    { key: "education", title: "Education", icon: "🎓" },    // 2009
    { key: "contact", title: "Contact", icon: "💬" },        // NEXT
    { key: "blog", title: "Blog", icon: "♾️" }               // ∞

    "": "home", index: "home", about: "home", me: "home",
    edu: "education", certificates: "education", certs: "education", degree: "education",
    work: "experience", "work&experience": "experience", jobs: "experience", career: "experience",
    project: "projects", portfolio: "projects", work_samples: "projects",
    contacts: "contact", email: "contact", social: "contact",
    cv: "resume", skills: "resume",
    blogs: "blog", articles: "blog", medium: "blog"

    experience: { n: YEAR - 0.5, label: String(YEAR) }, // opens on the latest role; the dial's year then follows the scroll
    projects:   { n: 2017, label: "2017" },
    resume:     { n: 2023, label: "2023" },
    home:       { n: YEAR, label: "NOW" },
    contact:    { n: YEAR + 1, label: "NEXT" },
    blog:       { n: YEAR + 40, label: "∞" },
    notfound:   { n: null, label: "????" }

  // "2019 – 2023" → { from: 2019, to: 2023 }; "Present" is this year
  const roleYears = x => {
    const ys = (String(x.years).match(/\d{4}/g) || []).map(Number);

    let s = String(input || "").trim().toLowerCase();
    s = s.replace(/^devleb:\/\//, "").replace(/^https?:\/\/[^/]+/, "").replace(/^#?\/?/, "").replace(/\/+$/, "").split(/[?#]/)[0];
    if (ROUTES.some(r => r.key === s)) return s;
    if (ALIASES[s] !== undefined) return ALIASES[s];
    const partial = ROUTES.find(r => s.length >= 3 && r.key.startsWith(s));
    return partial ? partial.key : null;
  }

  function toast(msg) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast(t("Copied {x}", { x: text })); return true; }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
      ta.remove();
      toast(ok ? t("Copied {x}", { x: text }) : t("Copy blocked here. The address is {x}", { x: text }));
      return ok;
    }
  }

  async function cvBytes() {
    if (A.cv.startsWith("data:")) {
      const b64 = A.cv.split(",")[1];
      const bin = atob(b64); const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    }
    const r = await fetch(A.cv);
    if (!r.ok) throw new Error("CV file not found at " + A.cv);
    return new Uint8Array(await r.arrayBuffer());
  }

  // claude.ai published pages save files through the downloads capability;
  // everywhere else a normal download link is used.
  let downloadsNS = null;
  if (window.claude && typeof window.claude.use === "function") {
    Promise.race([window.claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 8000))])
      .then(ns => { downloadsNS = ns; }).catch(() => {});
  }
  async function downloadCV() {
    if (downloadsNS) {
      try {
        const bytes = await cvBytes();
        await downloadsNS.save({ filename: A.cvFileName, data: new Blob([bytes], { type: "application/pdf" }) });
        toast(t("CV saved"));
      } catch (e) {
        if (e && e.code === "declined") return;
        toast(t("The download didn't start here. Try the link on the published site."));
      }
      return;
    }
    const a = document.createElement("a");
    a.href = A.cv; a.download = A.cvFileName; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
  }

  function loadScript(src) {
    return new Promise((res, rej) => {
      if ([...document.scripts].some(s => s.src === src)) return res();
      const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load " + src));
      document.head.appendChild(s);
    });
  }

  async function renderPdf(container) {
    const V = window.VENDOR;
    container.innerHTML = `<p class="muted">${esc(t("Loading the CV…"))}</p>`;
    try {
      await loadScript(V.pdfWorker); // runs on the main thread: no separate worker file needed
      await loadScript(V.pdf);
      const lib = window.pdfjsLib;
      const doc = await lib.getDocument({ data: await cvBytes() }).promise;
      container.innerHTML = "";
      const width = Math.min(container.clientWidth || 800, 900);
      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const vp0 = page.getViewport({ scale: 1 });
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const vp = page.getViewport({ scale: (width / vp0.width) * dpr });
        const cv = document.createElement("canvas");
        cv.width = vp.width; cv.height = vp.height;
        cv.style.width = width + "px"; cv.style.maxWidth = "100%"; cv.style.height = "auto";
        cv.className = "pdf-page"; cv.setAttribute("aria-label", t("CV page {i}", { i }));
        container.appendChild(cv);
        await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      }
    } catch (e) {
      container.innerHTML = `<p class="muted">${esc(t("The CV preview couldn't load ({msg}). Use Download CV instead.", { msg: e.message }))}</p>`;
    }
  }

    }).join("");
    const nodes = cats.map((c, i) => {
      const a = ((-90 + (i * 360) / n) * Math.PI) / 180, x = cx + Math.cos(a) * R, y = cx + Math.sin(a) * R;
      return `<g class="lg-node" data-i="${i}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">

    return `

        <filter id="lgGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>

      ${nodes}

  const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const skillTokens = name => {
    const inner = [...name.matchAll(/\(([^)]*)\)/g)].map(m => m[1]), out = [];
    [name.replace(/\([^)]*\)/g, " "), ...inner].forEach(part => part.split(/[\/,&]| and /).forEach(x => { x = x.trim(); if (x.length > 1) out.push(x); }));

  // ---------- page behaviour ----------
  const INIT = {
    education(root) {
      const tabs = [...root.querySelectorAll('[role="tab"]')];
      const select = tab => {
        tabs.forEach(t => {
          const on = t === tab;
          t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1;
          root.querySelector("#" + t.getAttribute("aria-controls")).hidden = !on;
        });
      };
      tabs.forEach((t, i) => {
        t.addEventListener("click", () => select(t));
        t.addEventListener("keydown", e => {
          if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
            const n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
            select(n); n.focus(); e.preventDefault();
          }
        });
      });
    },

    projects(root) {
      const state = { q: "", tech: new Set() };
      const grid = root.querySelector("#proj-grid");
      const count = root.querySelector("#proj-count");
      const q = root.querySelector("#proj-q");
      const chips = [...root.querySelectorAll(".chip[data-tech]")];
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const countText = n => `${n} ${n === 1 ? "project" : "projects"}`;

      const draw = () => {
        const list = C.projects.filter(p =>
          (!state.tech.size || [...state.tech].every(x => p.tech.includes(x))) &&
          (!state.q || (p.title + " " + p.desc + " " + p.tech.join(" ")).toLowerCase().includes(state.q))
        );
        count.textContent = countText(list.length);
        chips.forEach(c => { const on = state.tech.has(c.dataset.tech); c.setAttribute("aria-pressed", on); c.classList.toggle("keep", on); });
        if (!list.length) {
          grid.innerHTML = `<div class="panel empty"><p>${esc(t("No projects match these filters."))}</p><button type="button" class="btn" data-clear>${esc(t("Clear filters"))}</button></div>`;
          return;
        }
        grid.innerHTML = list.map(p => {
          const key = pkey(p), parts = key.split("-");
          const initials = (parts.length > 1 ? parts.map(w => w[0]).join("") : key.slice(0, 3)).slice(0, 3).toUpperCase();
          const meta = [projDates(p), p.role].filter(Boolean);
          return `
          <article class="proj book" id="proj-${key}">
            <div class="book-tilt"><div class="book-body">
              <div class="pg pg-inside" id="pg-${key}" inert aria-hidden="true">
                <div class="pg-scroll">
                  <h2>${esc(p.title)}</h2>
                  ${meta.length ? `<p class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join("")}</p>` : ""}
                  ${roleBadge(p)}
                  ${p.desc ? `<h3>${esc(t("Description"))}</h3><p>${esc(p.desc)}</p>` : ""}
                  ${p.apps && p.apps.length ? `<h3>${esc(t(p.appsTitle || "Areas of work"))}</h3>${areaTiles(p)}` : ""}
                  ${(p.sections || []).filter(x => x.points && x.points.length).map(x => `<h3>${esc(t(x.title))}</h3><ul class="points">${x.points.map(pt => `<li>${esc(pt)}</li>`).join("")}</ul>`).join("")}
                  ${exampleFor(p.key) ? `<h3>${esc(t("Engineering example"))}: ${esc(exampleFor(p.key).topic)}</h3>${exampleBlock(exampleFor(p.key))}` : ""}
                  ${p.tasks && p.tasks.length ? `<h3>${esc(t("Tasks"))}</h3><ul class="points">${p.tasks.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
                  <div class="tag-row">${p.tech.map(x => `<button type="button" class="tag${state.tech.has(x) ? " on" : ""}" data-tech-add="${esc(x)}" aria-label="${esc(t("Filter by {name}", { name: x }))}">${esc(x)}</button>`).join("")}</div>
                </div>
                <button type="button" class="pg-close" aria-label="${esc(t("Close"))}">${icon("close")}</button>
              </div>
              <button type="button" class="pg pg-cover" aria-expanded="false" aria-controls="pg-${key}" aria-label="${esc(t("Open project {name}", { name: p.title }))}">
                <span class="cover${p.logo ? " has-logo" : ""}" style="--h:${p.hue}" aria-hidden="true">${p.logo && A[p.logo] ? `<img class="cover-logo" src="${A[p.logo]}" alt="">` : `<span>${esc(initials)}</span>`}</span>
                <span class="cover-info">
                  <span class="cv-title">${esc(p.title)}</span>
                  ${meta.length ? `<span class="cv-meta">${esc(meta.join(" \u00b7 "))}</span>` : ""}
                  <span class="cv-tags" aria-hidden="true">${p.tech.slice(0, 3).map(x => `<i>${esc(x)}</i>`).join("")}</span>
                  <span class="cv-open" aria-hidden="true">${esc(t("Open"))} <b>\u203a</b></span>
                </span>
              </button>
            </div></div>
          </article>`;
        }).join("");
      };

      // a project is a book: the cover swings open onto the details
      const setBook = (book, open, focus) => {
        const cover = book.querySelector(".pg-cover"), inside = book.querySelector(".pg-inside");
        book.classList.toggle("open", open);
        cover.setAttribute("aria-expanded", open);
        if (open) { inside.removeAttribute("inert"); inside.setAttribute("aria-hidden", "false"); cover.setAttribute("inert", ""); }
        else { inside.setAttribute("inert", ""); inside.setAttribute("aria-hidden", "true"); cover.removeAttribute("inert"); }
        if (focus) (open ? inside.querySelector(".pg-close") : cover).focus({ preventScroll: true });
      };

      const more = root.querySelector("#tech-more"), chipBox = root.querySelector("#tech-chips");
      more.addEventListener("click", () => {
        const open = !chipBox.classList.contains("show-all");
        chipBox.classList.toggle("show-all", open);
        more.setAttribute("aria-expanded", open);
        more.textContent = open ? t("Show fewer") : t("Show all {n} technologies", { n: chips.length });
      });
      q.addEventListener("input", () => { state.q = q.value.trim().toLowerCase(); draw(); });
      chips.forEach(c => c.addEventListener("click", () => { const x = c.dataset.tech; state.tech.has(x) ? state.tech.delete(x) : state.tech.add(x); draw(); }));
      const clear = () => { state.q = ""; q.value = ""; state.tech.clear(); draw(); };
      root.querySelector("#proj-clear").addEventListener("click", clear);
      grid.addEventListener("click", e => {
        const cover = e.target.closest(".pg-cover");
        if (cover) { setBook(cover.closest(".book"), true, true); return; }
        const close = e.target.closest(".pg-close");
        if (close) { setBook(close.closest(".book"), false, true); return; }
        const b = e.target.closest("[data-tech-add]");
        if (b) { const x = b.dataset.techAdd; state.tech.has(x) ? state.tech.delete(x) : state.tech.add(x); draw(); root.querySelector(".filters").scrollIntoView({ behavior: "smooth", block: "nearest" }); }
        if (e.target.closest("[data-clear]")) clear();
      });
      const onKey = e => {
        if (!grid.isConnected) { document.removeEventListener("keydown", onKey); return; }
        if (e.key !== "Escape") return;
        grid.querySelectorAll(".book.open").forEach(book => setBook(book, false, book.contains(document.activeElement)));
      };
      document.addEventListener("keydown", onKey);

      // the cards lean towards the pointer, with a soft glare (mouse only)
      if (!reduced && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const rest = book => { book.style.setProperty("--rx", "0deg"); book.style.setProperty("--ry", "0deg"); book.style.setProperty("--glow", "0"); };
        grid.addEventListener("pointermove", e => {
          const book = e.target.closest(".book");
          if (!book || book.classList.contains("open")) return;
          const r = book.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
          book.style.setProperty("--ry", ((px - 0.5) * 10).toFixed(2) + "deg");
          book.style.setProperty("--rx", ((0.5 - py) * 8).toFixed(2) + "deg");
          book.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
          book.style.setProperty("--my", (py * 100).toFixed(1) + "%");
          book.style.setProperty("--glow", "1");
        });
        grid.addEventListener("pointerout", e => { const book = e.target.closest(".book"); if (book && !book.contains(e.relatedTarget)) rest(book); });
      }
      draw();
    },

    contact(root) {
      const $ = id => root.querySelector("#" + id);
      $("cf-send").addEventListener("click", () => {
        const name = $("cf-name").value.trim(), subject = $("cf-subject").value.trim(), msg = $("cf-msg").value.trim();
        const missing = [!name && t("your name"), !subject && t("a subject"), !msg && t("a message")].filter(Boolean);
        if (missing.length) { $("cf-err").textContent = t("Add {list} first.", { list: joinList(missing) }); return; }
        $("cf-err").textContent = "";
        const body = `${msg}\n\n— ${name}`;
        window.location.href = `mailto:${C.profile.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        toast(t("Opening your email app"));
      });
    },

    resume(root) {
      // --- technical leadership clock
      const lg = root.querySelector("#leadership");
      if (lg) {
        const items = [...lg.querySelectorAll(".lg-item")], nodes = [...lg.querySelectorAll(".lg-node")];
        const hand = lg.querySelector(".lg-hand"), big = lg.querySelector(".lg-num-big");
        const n = items.length, reducedLg = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let cur = 0, angle = 0, auto = !reducedLg, timer = null, visible = false, hovering = false;
        const select = (i, user) => {
          if (user) { auto = false; lg.classList.remove("auto"); }
          let step = ((i - cur) % n + n) % n;       // the hand always moves forward, like time
          if (step === 0 && user) step = 0;
          angle += step * (360 / n);
          cur = i;
          hand.style.transform = `rotate(${angle}deg)`;
          big.textContent = String(i + 1).padStart(2, "0");
          items.forEach((it, k) => {
            const on = k === i;
            it.classList.toggle("open", on);
            it.querySelector(".lg-cat").setAttribute("aria-expanded", on);
          });
          nodes.forEach((nd, k) => nd.classList.toggle("on", k === i));
          if (auto) { lg.classList.remove("tick"); void lg.offsetWidth; lg.classList.add("tick"); }
        };
        items.forEach((it, i) => {
          const b = it.querySelector(".lg-cat");
          b.addEventListener("click", () => select(i, true));
          b.addEventListener("keydown", e => {
            if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
            const k = (i + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
            items[k].querySelector(".lg-cat").focus(); select(k, true); e.preventDefault();
          });
        });
        nodes.forEach((nd, i) => nd.addEventListener("click", () => { select(i, true); items[i].querySelector(".lg-cat").focus({ preventScroll: true }); }));
        lg.addEventListener("pointerenter", () => { hovering = true; });
        lg.addEventListener("pointerleave", () => { hovering = false; });
        if (auto) {
          lg.classList.add("auto");
          const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible && auto) select(cur, false); }, { threshold: 0.4 });
          io.observe(lg);
          timer = setInterval(() => {
            if (!lg.isConnected) { clearInterval(timer); io.disconnect(); return; }
            if (auto && visible && !hovering && !lg.contains(document.activeElement)) select((cur + 1) % n, false);
          }, 6000);
        }
        select(0, false);
      }

      const chart = root.querySelector("#skills-chart");
      let cat = "all";
      const draw = () => {
        chart.innerHTML = C.skills.filter(s => cat === "all" || (s.group || s.cat) === cat).map(s => {
          const rows = s.items.map(it => ({ name: it[0], ev: skillEvidence(it) }));
          const proven = rows.filter(r => r.ev), plain = rows.filter(r => !r.ev);
          return `
          <div class="skill-cat">
            <h3>${esc(s.cat)}</h3>
            ${proven.length ? `<ul class="evid">${proven.map(r => `<li><span class="ev-name">${esc(r.name)}</span><span class="ev-text">${esc(r.ev)}</span></li>`).join("")}</ul>` : ""}
            ${plain.length ? `<p class="also"><strong>${esc(t("Also"))}:</strong> ${plain.map(r => esc(r.name)).join(", ")}</p>` : ""}
          </div>`;
        }).join("");
      };
      root.querySelectorAll("[data-scroll-to]").forEach(b => b.addEventListener("click", () => {
        const el = root.querySelector("#" + b.dataset.scrollTo);
        if (el) el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      }));
      root.querySelectorAll(".chip[data-cat]").forEach(c => c.addEventListener("click", () => {
        cat = c.dataset.cat;
        root.querySelectorAll(".chip[data-cat]").forEach(x => x.setAttribute("aria-pressed", x === c));
        draw();
      }));
      draw();
      const tg = root.querySelector("#cv-toggle"), view = root.querySelector("#cv-view");
      tg.addEventListener("click", () => {
        const open = view.hidden;
        view.hidden = !open; tg.setAttribute("aria-expanded", open);
        tg.lastChild.textContent = t(open ? "Hide CV" : "View CV");
        if (open && !view.dataset.loaded) { view.dataset.loaded = "1"; renderPdf(view); }
        if (open) view.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
  };

/* ==========================================================================
   Phone tilt: the desk shifts a little as the phone is tilted.
   Android turns it on by itself. iPhones need a tap (Motion > Tilt in the Scene

   ========================================================================== */

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hasEvent = "DeviceOrientationEvent" in window;

  let on = false, sink = null, sawData = false;

  function handler(e) {
    if (e.gamma == null || e.beta == null || !sink) return;

    let x = e.gamma, y = e.beta - 50;                 // holding a phone upright is about 50 degrees

    on = true;
    return true;
  }

    needsPermission,
    setSink(fn) { sink = fn; },

    get on() { return on; },

    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snowy";
    return "cloudy";

  const wxLabel = (w, phase) => t(w === "sunny" && phase === "night" ? "Clear" : cap(w));
  const condWord = (w, phase) => t({ sunny: phase === "night" ? "clear" : "sunny", cloudy: "cloudy", rainy: "raining", foggy: "foggy", snowy: "snowing" }[w]);

  async function getJson(url, ms) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms || 7000);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) throw fail("network");

  const getPosition = () => new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(fail("nogeo"));

      () => rej(fail("declined")), { timeout: 8000, maximumAge: 3600000 });
  });
  async function silentPosition() {            // only if the visitor has already allowed it
    try {
      if (!navigator.geolocation || !navigator.permissions) return null;
      const p = await navigator.permissions.query({ name: "geolocation" });
      return p.state === "granted" ? await getPosition() : null;

  }

  async function forecast(lat, lon) {
    const w = await getJson("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current=weather_code,temperature_2m&daily=sunrise,sunset&timezone=auto&forecast_days=1");
    if (!w || !w.current) throw fail("weather");
    return {
      weather: weatherFromCode(w.current.weather_code), temp: w.current.temperature_2m,
      sun: { rise: hm(w.daily && w.daily.sunrise && w.daily.sunrise[0]), set: hm(w.daily && w.daily.sunset && w.daily.sunset[0]) }

    const loc = list.find(r => r.timezone === tz) || list[0];      // prefer the city that really is in this time zone

    const res = await forecast(loc.latitude, loc.longitude);

      if (c && c.res && Date.now() - c.t < CACHE_MS) return c.res;

    snow: '<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/>',

  function init(desk) {
    if (!desk || document.getElementById("scene-ctl")) return;
    const saved = store.get(LS_SCENE) || {};
    const st = {
      time: PHASES.includes(saved.time) ? saved.time : "auto",
      weather: WEATHERS.includes(saved.weather) ? saved.weather : "live",
      precise: !!saved.precise,
      tilt: saved.tilt,
      live: null, liveState: "idle", reason: "", tz: ""              // liveState: idle | loading | ok | failed
    };

    const buildPop = () => `
      <p class="sp-h">${esc(t("Time of day"))}</p>
      <div class="sp-row" role="group" aria-label="${esc(t("Time of day"))}">
        ${chip("time", "auto", t("Auto"))}${PHASES.map(p => chip("time", p, t(cap(p)))).join("")}
      </div>
      <p class="sp-h">${esc(t("Weather"))}</p>
      <div class="sp-row" role="group" aria-label="${esc(t("Weather"))}">
        ${chip("wx", "live", t("Live"))}${chip("wx", "here", t("My location"))}${WEATHERS.map(w => chip("wx", w, t(cap(w)))).join("")}

    const noteHtml = () => {
      const p = [esc(t(st.time === "auto" ? "Time follows your clock." : "Time set by you."))];
      if (st.weather !== "live") p.push(esc(t("Weather set by you. Pick Live to follow the real weather.")));

        p.push(esc(t(st.live.basis === "device" ? "Based on your device's location. It is not stored." : "Based on your time zone's main city, not your exact location.")));

      }

      return p.join(" ");
    };

    const lineText = e => {
      const time = timeText();
      if (st.weather === "live") {
        if (st.liveState === "loading" || st.liveState === "idle") return t("Checking the weather…");

          return t(st.live.basis === "device" ? "It's {time} where you are: {temp}°C, {cond}." : "It's {time} in {city}: {temp}°C, {cond}.", v);
        }

    };

    const render = () => {
      const e = effective();
      const icon = e.weather === "rainy" ? "rain" : e.weather === "snowy" ? "snow" : e.weather === "foggy" ? "fog" : e.weather === "cloudy" ? "cloud" : (e.phase === "night" ? "moon" : "sun");
      const label = `${t(cap(e.phase))} · ${wxLabel(e.weather, e.phase)}`;

    };

    const loadLive = async ask => {
      st.liveState = "loading"; render();
      try { st.live = await liveWeather({ ask }); st.liveState = "ok"; st.reason = ""; }
      catch (err) { st.live = null; st.liveState = "failed"; st.reason = (err && err.code) || "network"; st.tz = (err && err.extra) || ""; }

    };

    // ----- interaction (events are delegated, so the panel can be rebuilt freely)
    const setOpen = open => { $("#scene-pop").hidden = !open; $("#scene-btn").setAttribute("aria-expanded", open); };
    ctl.addEventListener("click", async e => {
      if (e.target.closest("#scene-btn")) { setOpen($("#scene-pop").hidden); return; }

      if (tm) { st.time = tm.dataset.time; save(); apply(false); }
      else if (wx) {
        const v = wx.dataset.wx;
        if (v === "live" || v === "here") {
          st.weather = "live"; st.precise = v === "here"; save();
          await loadLive(st.precise);
        } else { st.weather = v; save(); apply(false); }
      } else if (tl && window.Tilt) {
        if (window.Tilt.on) { window.Tilt.disable(); st.tilt = "off"; }
        else { st.tilt = (await window.Tilt.enable()) ? "on" : "off"; }

    });

    document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#scene-pop").hidden) { setOpen(false); $("#scene-btn").focus(); } });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (st.time === "auto") apply(false); else render(); } });

    // a language change rebuilds the labels

    // ----- tilt: Android starts it by itself; iPhone waits for a tap
    if (window.Tilt && window.Tilt.supported && (st.tilt === "on" || (st.tilt === undefined && !window.Tilt.needsPermission))) {
      window.Tilt.enable().then(ok => { if (ok) render(); });
    }

    // first look: instantly, so the desk never flashes the wrong sky
    apply(true);
    if (st.weather === "live") loadLive(false);
    setInterval(() => { if (st.time === "auto") apply(false); else render(); }, 60 * 1000);
  }

  window.SceneEnvironment = { init, phaseFor, weatherFromCode };
})();

  <script>
/* ==========================================================================

(function () {

             lines: [t("Backend / Blockchain / Intelligence & data"), t("BSc Computer Science")], cta: t("Step inside") };
  };
  const eraLabels = () => Object.fromEntries(Object.entries(window.PortfolioBrowser.ERA).map(([k, v]) => [k, window.I18N.t(v.label)]));
  const $ = s => document.querySelector(s);

    } catch (e) { return false; }
  }
  const has3D = !!window.THREE && webglOK();

  // ---------- browser (always available) ----------
  const browser = new window.PortfolioBrowser(browserEl, {
    onWarp: (key, dir) => (tunnel ? tunnel.warpTo(key, dir) : { mid: Promise.resolve(), done: new Promise(r => setTimeout(r, reduced ? 0 : 350)) }),
    onShow: key => tunnel && tunnel.show(key),
    onDesk: () => exitToDesk(),
    onScroll: p => tunnel && tunnel.setScroll(p),
    onYear: (key, label, dir) => tunnel && tunnel.setLabel(key, label, dir)
  });

  function routeFromHash() {
    const h = (location.hash || "").replace(/^#\/?/, "");

  }
  // The site always opens on Home. Only an explicit link such as  yoursite/?page=projects  opens another page;
  // a leftover #/page in the address (from an earlier visit or a refresh) is ignored.
  function routeFromLink() {

  if (has3D) {

    if (deep) {
      // a shared link to a page goes straight to that page
      desk.lidAngle = desk.lidTarget = -0.26; desk.screenPower = 1;
      finishLoading();
      enterBrowser({ instant: true, route: deep });
      return;
    }
    setTimeout(() => {
      finishLoading();
      body.classList.add("intro-ready");
      desk.openLid();
    }, reduced ? 50 : 450);
  }

  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
  fontsReady.then(start);
})();

</script>
</body>
</html>
